timeout।\"),\nT(\"Logging Best Practices\",\"\u003cb>ভালো ডায়েরি:\u003c/b> কখন, কোথায়, কে, কী — গুছিয়ে, গোপন কথা বাদ দিয়ে।\",\n[\"Structured log (JSON)।\",\"Level: debug, info, warn, error।\",\"request_id, trace_id, user_id রাখো।\",\"Password, token, card, PII লগ না।\",\"বেশি log = খরচ; sampling।\"],\n\"আমি JSON structured log লিখি, সঠিক level দিয়ে, আর প্রতিটায় request ID আর trace ID রাখি। Password, token বা ব্যক্তিগত তথ্য কখনো log করি না।\",\"{level:'error', traceId, orderId, msg:'courier booking failed'}।\"),\nT(\"Log Aggregation\",\"\u003cb>সব ঘরের ডায়েরি এক লাইব্রেরিতে।\u003c/b>\",\n[\"সব server-এর log এক জায়গায়।\",\"Agent (Fluent Bit, Vector) → store → search।\",\"ELK (Elasticsearch, Logstash, Kibana), Loki + Grafana।\",\"Retention policy, index।\",\"Trace ID দিয়ে খোঁজা।\"],\n\"অনেক server আর container-এর log এক জায়গায় জমা করি, যাতে এক জায়গা থেকে খোঁজা যায়। Agent log তুলে Elasticsearch বা Loki-তে পাঠায়, আর Kibana বা Grafana-য় দেখি।\",\"traceId=abc123 লিখে খুঁজলে ৫টা service-এর log একসাথে।\"),\nT(\"Metrics and Instrumentation\",\"\u003cb>গাড়ির ড্যাশবোর্ড:\u003c/b> speed, তেল, তাপমাত্রা সবসময় চোখের সামনে।\",\n[\"Counter, Gauge, Histogram।\",\"RED: Rate, Errors, Duration (service-এর জন্য)।\",\"USE: Utilization, Saturation, Errors (resource-এর জন্য)।\",\"Prometheus + Grafana, OpenTelemetry।\",\"Label-এর cardinality কম রাখো।\"],\n\"Code-এ instrumentation দিয়ে metric বের করি, service-এর জন্য RED (rate, error, duration) আর resource-এর জন্য USE। Prometheus-এ জমা রেখে Grafana-য় দেখি। Label-এ user ID-র মতো অসংখ্য মান রাখি না।\",\"http_request_duration_seconds histogram → p95, p99।\"),\nT(\"Distributed Tracing\",\"\u003cb>পার্সেল ট্র্যাকিং:\u003c/b> এক নম্বর দিয়ে পুরো যাত্রা, প্রতিটা স্টপে কত সময়।\",\n[\"Trace = পুরো request; Span = প্রতিটা ধাপ।\",\"traceparent header দিয়ে context যায়।\",\"OpenTelemetry → Jaeger / Tempo / Zipkin।\",\"সবচেয়ে লম্বা span = bottleneck।\",\"Sampling দিয়ে খরচ কমাও।\"],\n\"Distributed tracing-এ প্রতিটা request-এর একটা trace ID থাকে, আর প্রতিটা DB বা HTTP call একটা span। এতে microservice-এ কোন ধাপ ধীর সেটা চোখে দেখা যায়।\",\"Checkout 1.5s: trace-এ shipping API একাই 1.2s।\"),\nT(\"Alerts and Monitoring\",\"\u003cb>ধোঁয়া দেখলে বাজবে এমন অ্যালার্ম, প্রতিটা হাঁচিতে না।\u003c/b>\",\n[\"Symptom-এ alert (user-এর সমস্যা), cause-এ না।\",\"SLI, SLO (99.9%), error budget।\",\"Severity: page vs ticket।\",\"Alert fatigue এড়াও।\",\"প্রতিটা alert-এর সাথে runbook link।\"],\n\"Alert দিই user-এর উপর প্রভাব পড়ছে এমন লক্ষণে, যেমন error rate বা p99 latency SLO পার হলে। অপ্রয়োজনীয় alert কমাই যাতে আসল সমস্যা চোখ এড়িয়ে না যায়, আর প্রতিটার সাথে কী করতে হবে তা লিখে রাখি।\",\"৫ মিনিট ধরে 5xx > 2% → on-call-এ page।\"),\nT(\"Dashboards & Runbooks\",\"\u003cb>Dashboard = এক নজরে অবস্থা। Runbook = আগুন লাগলে কী করবে তার ধাপ।\u003c/b>\",\n[\"Dashboard: উপরে সারসংক্ষেপ (RED), নিচে বিস্তারিত।\",\"প্রতি service একটা dashboard।\",\"Runbook: লক্ষণ → কারণ খোঁজা → সমাধানের ধাপ।\",\"Incident-এর পর postmortem, runbook update।\"],\n\"Dashboard-এ এক নজরে service-এর অবস্থা দেখা যায়, আর runbook-এ লেখা থাকে কোন alert এলে ধাপে ধাপে কী করতে হবে। এতে রাত ৩টায় নতুন কেউও দ্রুত সমস্যা সামলাতে পারে।\",\"Runbook: 'DB connection exhausted' → pool দেখো → slow query kill → scale।\")\n]);\n\nP(\"sec\",\"Advanced Security\",[\nT(\"SSL/TLS\",\"\u003cb>তালা দেওয়া খাম + সিল-মারা পরিচয়পত্র।\u003c/b>\",\n[\"Encryption (গোপনীয়তা) + integrity + identity (certificate)।\",\"Handshake: key exchange, তারপর symmetric encryption।\",\"Certificate CA দিয়ে sign করা।\",\"TLS 1.2/1.3; পুরনোগুলো বন্ধ।\",\"SSL termination LB-তে; ভেতরে mTLS।\"],\n\"TLS data encrypt করে, পথে কেউ বদলাতে পারে না সেটা নিশ্চিত করে, আর certificate দিয়ে server-এর পরিচয় প্রমাণ করে। Handshake-এ key ঠিক করে তারপর দ্রুত symmetric encryption চলে। সাধারণত load balancer-এ TLS শেষ করি।\",\"Let's Encrypt certificate + auto renew, TLS 1.3।\"),\nT(\"Encryption at Rest\",\"\u003cb>আলমারিতে রাখা জিনিসও তালাবদ্ধ।\u003c/b>\",\n[\"Disk, DB, backup, S3-এ data encrypt।\",\"AES-256।\",\"Key আলাদা জায়গায় (KMS)।\",\"Envelope encryption: data key + master key।\",\"খুব সংবেদনশীল field-এ app-level encryption।\"],\n\"Encryption at rest-এ disk, database আর backup-এ রাখা data encrypt থাকে, যাতে disk চুরি হলেও পড়া না যায়। Key KMS-এ রাখি, আর envelope encryption ব্যবহার করি।\",\"RDS encryption on + S3 SSE-KMS; NID নম্বর app-level-এ encrypt।\"),\nT(\"Secrets Management\",\"\u003cb>চাবি পকেটে না, লকারে।\u003c/b> Code বা git-এ কখনো password না।\",\n[\"Secret code/git-এ রাখা নিষেধ।\",\"Vault, AWS Secrets Manager, GCP Secret Manager।\",\"Runtime-এ inject (env বা mount)।\",\"Rotation নিয়মিত।\",\"কে কোন secret পড়তে পারবে (least privilege), audit log।\"],\n\"Password আর API key কখনো code বা git-এ রাখি না। Secret manager-এ রাখি, runtime-এ app-এ inject হয়, নিয়মিত rotate করি, আর শুধু দরকারি service-কে access দিই।\",\"DB password Secrets Manager-এ, প্রতি ৩০ দিনে auto rotate।\"),\nT(\"Password Management\",\"\u003cb>পাসওয়ার্ড কখনো রাখবে না, শুধু তার লবণ-মাখা হ্যাশ।\u003c/b>\",\n[\"Plain text বা MD5/SHA1 না।\",\"bcrypt / Argon2 / scrypt (ইচ্ছা করে ধীর)।\",\"প্রতিটা password-এ আলাদা salt।\",\"Login-এ rate limit, lockout, MFA।\",\"Breached password check।\"],\n\"Password কখনো plain রাখি না, bcrypt বা Argon2-এর মতো ধীর hash দিয়ে salt সহ রাখি, যাতে DB ফাঁস হলেও ভাঙা কঠিন হয়। Login-এ rate limit আর MFA দিই।\",\"bcrypt cost 12: একটা hash ~250ms, তাই brute force কার্যত অসম্ভব।\",\nnull,`const hash = await bcrypt.hash(password, 12);\nconst ok = await bcrypt.compare(input, hash);`),\nT(\"RBAC\",\"\u003cb>অফিসের পদ অনুযায়ী চাবি:\u003c/b> ম্যানেজার, ক্যাশিয়ার, গেস্ট — যার যার রুম।\",\n[\"Role-Based Access Control।\",\"User → Role → Permission।\",\"Least privilege।\",\"ABAC: attribute দিয়ে (owner, department, সময়)।\",\"Multi-tenant-এ tenant + role দুটোই check।\"],\n\"RBAC-এ user-কে role দিই আর role-কে permission, তাই প্রতিটা user-এর অনুমতি আলাদা করে সামলাতে হয় না। আরও সূক্ষ্ম নিয়ম লাগলে ABAC, যেমন শুধু নিজের order।\",\"Admin: সব; Staff: order দেখা ও বদল; Customer: শুধু নিজের order।\"),\nT(\"SAML\",\"\u003cb>Enterprise SSO-র XML পাসপোর্ট।\u003c/b>\",\n[\"XML-ভিত্তিক SSO protocol।\",\"IdP (Okta, Azure AD) → SP (তোমার app)।\",\"Signed assertion-এ user-এর পরিচয়।\",\"Enterprise B2B-তে প্রচলিত।\",\"নতুন app-এ প্রায়ই OIDC (JSON, সহজ)।\"],\n\"SAML হলো XML-ভিত্তিক SSO standard, যেখানে identity provider signed assertion দিয়ে service provider-কে user-এর পরিচয় জানায়। বড় company-র B2B integration-এ প্রচলিত, নতুন app-এ সাধারণত OIDC সহজ।\",\"Client company-র কর্মীরা Azure AD দিয়ে আমাদের SaaS-এ login।\")\n]);\n\n\nconst esc=s=>s.replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\");\nconst hl=s=>esc(s).split(\"\\n\").map(l=>l.replace(/(\\/\\/.*|--.*|#.*)$/,'\u003cspan class=\"cm\">$1\u003c/span>')).join(\"\\n\");\nconst KEY=\"sd-done\";let done={};try{done=JSON.parse(localStorage.getItem(KEY)||\"{}\")}catch(e){}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};\nconst bn=n=>String(n).replace(/\\d/g,d=>\"০১২৩৪৫৬৭৮৯\"[d]);\nconst total=parts.reduce((a,p)=>a+p.items.length,0);let q=\"\";\nfunction render(){\n  const cnt=Object.values(done).filter(Boolean).length;let n=0;\n  document.getElementById(\"list\").innerHTML=parts.map(p=>`\u003csection class=\"part\">\u003ch2>\u003csmall>Part\u003c/small>${p.name}\u003c/h2>\u003cdiv class=\"cards\">`+p.items.map((it,i)=>{n++;const k=p.id+\"-\"+i,d=!!done[k];\n    return `\u003carticle class=\"card${d?\" done\":\"\"}\" id=\"q-${k}\">\u003cdiv class=\"top\">\u003ch3>\u003cspan class=\"n\">${bn(n)}\u003c/span>${it.t}\u003c/h3>\n    \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" id=\"c-${k}\" data-k=\"${k}\" ${d?\"checked\":\"\"}>Done\u003c/label>\u003c/div>\n    \u003cdiv class=\"say\">\u003cb>🎤 Interview-এ এভাবে বলো\u003c/b>\u003cp>${it.say}\u003c/p>\u003cp class=\"ex\">\u003cb>💡 Example\u003c/b>${it.ex}\u003c/p>\u003c/div>\n    \u003cp class=\"hook\">${it.hook}\u003c/p>\n    \u003cdiv class=\"duo${it.pic?\"\":\" solo\"}\">\u003cdiv class=\"pics\">${it.pic}\u003c/div>\u003cul class=\"cave\">${it.b.map(x=>`\u003cli>${x}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>\n    ${it.c?`\u003cpre>\u003ccode>${hl(it.c)}\u003c/code>\u003c/pre>`:\"\"}\u003c/article>`}).join(\"\")+`\u003c/div>\u003c/section>`).join(\"\");\n  renderSide(cnt);spy();\n}\nfunction renderSide(cnt){let m=0;const ql=q.trim().toLowerCase();\n  document.getElementById(\"side\").innerHTML=`\u003cdiv class=\"sh\">\u003cspan>সব topic · ${bn(cnt)}/${bn(total)} শেষ\u003c/span>\u003cbutton id=\"sideClose\">✕\u003c/button>\u003c/div>\u003cinput class=\"search\" id=\"sq\" type=\"search\" placeholder=\"খোঁজো… (যেমন cache, CAP)\" value=\"${esc(q)}\">`+\n  parts.map(p=>{const rows=p.items.map((it,i)=>{m++;const k=p.id+\"-\"+i;if(ql&&!it.t.toLowerCase().includes(ql))return \"\";\n    return `\u003ca href=\"#q-${k}\" data-go=\"${k}\">\u003cspan class=\"sn2\">${bn(m)}\u003c/span>\u003cspan>${it.t}\u003c/span>${done[k]?'\u003cspan class=\"ok\">✓\u003c/span>':\"\u003cspan>\u003c/span>\"}\u003c/a>`}).join(\"\");\n    return rows?`\u003cdiv class=\"grp\">${p.name}\u003c/div>`+rows:\"\"}).join(\"\");}\nlet io;function spy(){try{io&&io.disconnect();io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const k=e.target.id.slice(2);document.querySelectorAll(\"#side a\").forEach(a=>a.classList.toggle(\"on\",a.dataset.go===k));}});},{rootMargin:\"-80px 0px -60% 0px\"});document.querySelectorAll(\".card[id]\").forEach(c=>io.observe(c));}catch(e){}}\ndocument.addEventListener(\"click\",e=>{const a=e.target.closest(\"#side a[data-go]\");\n  if(a){e.preventDefault();const el=document.getElementById(\"q-\"+a.dataset.go);if(el)el.scrollIntoView({behavior:\"smooth\",block:\"start\"});document.getElementById(\"side\").classList.remove(\"open\");return;}\n  if(e.target.closest(\"#sideBtn\")){document.getElementById(\"side\").classList.add(\"open\");return;}\n  if(e.target.closest(\"#sideClose\"))document.getElementById(\"side\").classList.remove(\"open\");});\ndocument.addEventListener(\"input\",e=>{if(e.target.id===\"sq\"){q=e.target.value;const pos=e.target.selectionStart;renderSide(Object.values(done).filter(Boolean).length);const s=document.getElementById(\"sq\");s.focus();s.setSelectionRange(pos,pos);spy();}});\ndocument.addEventListener(\"change\",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){done[k]=e.target.checked;save();render();}});\nrender();\n\u003c/script>\n\u003c/body>\u003c/html>", "lc": "\u003c!doctype html>\u003chtml lang=\"bn\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}\u003c/style>\u003c/head>\u003cbody>\u003ctitle>LeetCode Easy Caveman\u003c/title>\n\u003cmeta name=\"claude:viewport-fit-sides\" content=\"cover\">\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap\">\n\u003cstyle>\n/* Layout: one column of topic cards grouped by Part; each card = trick → animation → caveman bullets → code */\n:root{\n  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202c; --muted:#5b6778; --line:#dde3ea;\n  --accent:#d9342b; --accent-soft:#fde8e6; --ok:#1f8a5b; --ok-soft:#e1f4eb; --chip:#eef1f6;\n  --blue:#2f6fdb; --amber:#d98a00; --codebg:#0f1720; --codefg:#e3e9f0;\n  --display:\"Anek Bangla\",\"Hind Siliguri\",\"Noto Sans Bengali\",system-ui,sans-serif;\n  --body:\"Hind Siliguri\",\"Noto Sans Bengali\",system-ui,sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,Menlo,monospace;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f141b; --surface:#171e28; --fg:#e7ecf2; --muted:#9aa6b6; --line:#273241;\n  --accent:#ff5a4f; --accent-soft:#3a1d1c; --ok:#4cc38a; --ok-soft:#163327; --chip:#1f2835;\n  --blue:#6a9cff; --amber:#f0b03a; --codebg:#0a0f15; --codefg:#e3e9f0; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0f141b; --surface:#171e28; --fg:#e7ecf2; --muted:#9aa6b6; --line:#273241;\n  --accent:#ff5a4f; --accent-soft:#3a1d1c; --ok:#4cc38a; --ok-soft:#163327; --chip:#1f2835;\n  --blue:#6a9cff; --amber:#f0b03a; --codebg:#0a0f15; --codefg:#e3e9f0; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}\n.wrap{max-width:1240px;margin:0 auto}\n.layout{display:grid;gap:24px;align-items:start}\n.card{scroll-margin-top:16px}\n#side{font-size:14px}\n#side .sh{font:700 15px var(--display);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}\n#side .sh button{display:none;font:600 13px var(--body);background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:2px 10px;cursor:pointer}\n#side .grp{font:600 11px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}\n#side a{display:grid;grid-template-columns:26px 1fr auto;gap:4px;align-items:baseline;padding:5px 8px;border-radius:6px;color:var(--fg);text-decoration:none;line-height:1.35}\n#side a:hover{background:var(--chip)}\n#side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}\n#side a .sn2{font:500 12px var(--mono);color:var(--muted)}\n#side a .ok{color:var(--ok);font-size:12px}\n#side a:focus-visible,#sideBtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n#sideBtn{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;font:700 14px var(--body);background:var(--fg);color:var(--bg);border:none;border-radius:999px;padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}\n@media (min-width:700px){.layout{grid-template-column ce){*,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important}}\nfooter{margin-top:32px;color:var(--muted);font-size:14px}\n\n.search{width:100%;font:500 14px var(--body);padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin-bottom:6px}\n.search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n\n.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.badge{font:600 12px var(--body);padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--fg)}\n.badge.star{background:var(--accent);color:#fff}\n.story{margin:0;font-size:15.5px;color:var(--fg);background:var(--chip);border-radius:8px;padding:9px 12px}\n.timer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}\n.timer .tm{font:700 22px var(--mono);font-variant-numeric:tabular-nums;min-width:86px}\n.timer .tm.over{color:var(--accent)}\n.timer small{color:var(--muted);font-size:13px}\n.btn{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:5px 12px;cursor:pointer}\n.btn.go{background:var(--ok);color:#fff;border-color:var(--ok)}\n.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.bar2{flex:1;min-width:120px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}\n.bar2 i{display:block;height:100%;background:var(--ok);transition:width .3s}\n.grid2{display:grid;gap:12px}\n@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}\n.box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}\n.box h4{margin:0 0 6px;font:700 14px var(--display)}\n.box ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14.5px}\n.steps label{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;padding:4px 0;font-size:14.5px;cursor:pointer}\n.steps input{width:17px;height:17px;margin-top:3px;accent-color:var(--ok)}\n.steps label.dn span{color:var(--muted);text-decoration:line-through}\n.box li,.steps span{overflow-wrap:anywhere}\ncode.i{overflow-wrap:anywhere;font:500 12.5px var(--mono);background:var(--chip);padding:1px 5px;border-radius:4px}\n.card>*{min-width:0}details{min-width:0}\ndetails summary{cursor:pointer;font:700 14px var(--display);padding:4px 0}\n.ask li{color:var(--fg)}\n\n.ptop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}\n.ptitle{font:800 24px var(--display);margin:0;line-height:1.25}\n.lcno{font:600 13px var(--mono);color:var(--muted)}\n.desc{margin:0;font-size:16px}\n.exs{display:grid;gap:6px}\n.exs div{font:500 13.5px var(--mono);background:var(--chip);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere}\n.exs b{font-family:var(--body);color:var(--muted);font-weight:600}\n.editor{width:100%;min-height:240px;resize:vertical;font:500 14px/1.6 var(--mono);background:var(--codebg);color:var(--codefg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;tab-size:2}\n.editor:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.btn.run{background:var(--ok);color:#fff;border-color:var(--ok);font-size:14px;padding:7px 16px}\n.res{display:grid;gap:6px}\n.res .r{font:500 13px var(--mono);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere;border-left:4px solid}\n.res .r.ok{background:var(--ok-soft);border-color:var(--ok)}\n.res .r.no{background:var(--accent-soft);border-color:var(--accent)}\n.res .sum{font:700 15px var(--display)}\n.reveal summary{font:700 14.5px var(--display)}\n.reveal{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}\n.reveal[open]{padding-bottom:12px}\n.hintbox{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:15px}\n.navp{display:flex;justify-content:space-between;gap:8px}\n#side a{grid-template-columns:40px 1fr auto}\n.solved{color:var(--ok);font:700 14px var(--display)}\n\u003c/style>\n\u003cdiv class=\"wrap\">\n\u003cheader>\n  \u003ch1>\u003cspan class=\"play\">▶\u003c/span>LeetCode Easy Caveman\u003c/h1>\n  \u003cp class=\"lede\">৩৮টা classic easy problem, pattern অনুযায়ী সাজানো। আগে নিজে JavaScript-এ লেখো, ▶ Run চাপলে test চলবে। আটকে গেলে 💡 Hint, তারপর 🪨 কীভাবে ভাববে, সবশেষে ✅ Solution। সব test pass করলে নিজে থেকেই ✓ পড়ে।\u003c/p>\n\u003c/header>\n\u003cdiv class=\"layout\">\u003cmain id=\"main\">\u003c/main>\u003caside id=\"side\" aria-label=\"সব problem\">\u003c/aside>\u003c/div>\n\u003cbutton id=\"sideBtn\" aria-controls=\"side\">☰ সব problem\u003c/button>\n\u003cfooter>Problem-এর নাম আর নম্বর LeetCode-এর; বর্ণনা, ব্যাখ্যা আর solution নিজের ভাষায় লেখা। আসল problem LeetCode-এ পড়ে নিও।\u003c/footer>\n\u003c/div>\n\u003cscript>\n// run: worker-এর ভেতরে (f, a) => ফলাফল; না দিলে f(...a)\nconst PROBS=[\n// ───────── Array & Hashing ─────────\n{id:\"two-sum\",n:1,t:\"Two Sum\",g:\"Array & Hashing\",fn:\"twoSum\",args:\"nums, target\",\n d:\"একটা সংখ্যার array আর একটা target দেওয়া। এমন দুইটা আলাদা index খুঁজে বের করো যাদের যোগফল target। ঠিক একটা উত্তর আছে।\",\n ex:[[\"nums = [2,7,11,15], target = 9\",\"[0,1]\"],[\"nums = [3,2,4], target = 6\",\"[1,2]\"]],\n cave:[\"Brute: দুই loop → O(n²)। ধীর।\",\"ভালো: HashMap-এ আগের সংখ্যা → index রাখো।\",\"প্রতিটা x-এ দেখো target − x আগে দেখেছি কিনা।\",\"পেলে দুই index ফেরত।\"],\n hint:\"আমার এখন x, আমার জোড়া হলো target − x। সেটা কি আগে দেখেছি?\",\n sol:`function twoSum(nums, target) {\n  const seen = new Map();            // সংখ্যা → index\n  for (let i = 0; i \u003c nums.length; i++) {\n    const need = target - nums[i];\n    if (seen.has(need)) return [seen.get(need), i];\n    seen.set(nums[i], i);\n  }\n}`,tc:\"O(n) time, O(n) space\",\n tests:[[[[2,7,11,15],9],[0,1]],[[[3,2,4],6],[1,2]],[[[3,3],6],[0,1]],[[[-1,-2,-3,-4,-5],-8],[2,4]]],run:\"(f,a)=>f(...a).slice().sort((x,y)=>x-y)\",\n say:\"HashMap-এ আগের সংখ্যা রাখি, প্রতিটা সংখ্যায় দেখি target থেকে বাকিটা আগে এসেছে কিনা। এক pass-এ O(n)।\"},\n{id:\"contains-duplicate\",n:217,t:\"Contains Duplicate\",g:\"Array & Hashing\",fn:\"containsDuplicate\",args:\"nums\",\n d:\"Array-তে কোনো সংখ্যা দুবার বা বেশি থাকলে true, সব আলাদা হলে false।\",\n ex:[[\"nums = [1,2,3,1]\",\"true\"],[\"nums = [1,2,3,4]\",\"false\"]],\n cave:[\"Set-এ রাখতে রাখতে যাও।\",\"আগে থেকেই Set-এ থাকলে → true।\",\"শেষ পর্যন্ত না পেলে → false।\",\"এক লাইনে: new Set(nums).size !== nums.length।\"],\n hint:\"\\\"আগে দেখেছি কিনা\\\" দ্রুত জানার data structure কোনটা?\",\n sol:`function containsDuplicate(nums) {\n  const seen = new Set();\n  for (const x of nums) {\n    if (seen.has(x)) return true;\n    seen.add(x);\n  }\n  return false;\n}`,tc:\"O(n) time, O(n) space\",\n tests:[[[[1,2,3,1]],true],[[[1,2,3,4]],false],[[[1,1,1,3,3,4,3,2,4,2]],true],[[[]],false]],\n say:\"Set-এ রাখতে রাখতে যাই, আগেই থাকলে duplicate। O(n)। জায়গা কম লাগলে sort করে পাশাপাশি দেখা যায়, O(n log n)।\"},\n{id:\"valid-anagram\",n:242,t:\"Valid Anagram\",g:\"Array & Hashing\",fn:\"isAnagram\",args:\"s, t\",\n d:\"দুইটা string-এ ঠিক একই অক্ষর একই সংখ্যায় আছে কিনা (শুধু ক্রম আলাদা হতে পারে)।\",\n ex:[[\"s = \\\"anagram\\\", t = \\\"nagaram\\\"\",\"true\"],[\"s = \\\"rat\\\", t = \\\"car\\\"\",\"false\"]],\n cave:[\"Length আলাদা → false।\",\"s-এর প্রতিটা অক্ষরে count++।\",\"t-এর প্রতিটা অক্ষরে count−−।\",\"কোনো count ০-এর নিচে নামলে → false।\"],\n hint:\"প্রতিটা অক্ষর কতবার আছে গুনে মিলাও।\",\n sol:`function isAnagram(s, t) {\n  if (s.length !== t.length) return false;\n  const cnt = {};\n  for (const c of s) cnt[c] = (cnt[c] || 0) + 1;\n  for (const c of t) {\n    if (!cnt[c]) return false;   // নেই বা শেষ হয়ে গেছে\n    cnt[c]--;\n  }\n  return true;\n}`,tc:\"O(n) time, O(1) space (২৬ অক্ষর)\",\n tests:[[[\"anagram\",\"nagaram\"],true],[[\"rat\",\"car\"],false],[[\"a\",\"ab\"],false],[[\"\",\"\"],true]],\n say:\"প্রতিটা অক্ষর গুনি, একটায় বাড়াই আরেকটায় কমাই; কোথাও মাইনাস হলে anagram না। O(n)।\"},\n{id:\"majority-element\",n:169,t:\"Majority Element\",g:\"Array & Hashing\",fn:\"majorityElement\",args:\"nums\",\n d:\"যে সংখ্যা অর্ধেকের বেশি বার আছে সেটা ফেরত দাও। এমন সংখ্যা সবসময় আছে।\",\n ex:[[\"nums = [3,2,3]\",\"3\"],[\"nums = [2,2,1,1,1,2,2]\",\"2\"]],\n cave:[\"সহজ: HashMap-এ গুনো।\",\"চালাক: Boyer-Moore ভোট।\",\"candidate একই হলে vote++, আলাদা হলে vote−−।\",\"vote ০ হলে নতুন candidate।\",\"O(1) জায়গা।\"],\n hint:\"সংখ্যাগরিষ্ঠ সবাইকে কাটাকাটি করেও টিকে থাকে।\",\n sol:`function majorityElement(nums) {\n  let cand = null, votes = 0;\n  for (const x of nums) {\n    if (votes === 0) cand = x;\n    votes += x === cand ? 1 : -1;\n  }\n  return cand;\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[[3,2,3]],3],[[[2,2,1,1,1,2,2]],2],[[[1]],1],[[[6,5,5]],5]],\n say:\"Boyer-Moore voting: একই হলে vote বাড়াই, আলাদা হলে কমাই, ০ হলে নতুন candidate। অর্ধেকের বেশি থাকায় শেষে সেটাই টেকে।\"},\n{id:\"move-zeroes\",n:283,t:\"Move Zeroes\",g:\"Two Pointers\",fn:\"moveZeroes\",args:\"nums\",\n d:\"সব ০ array-র শেষে পাঠাও, বাকিদের ক্রম ঠিক রেখে। নতুন array না বানিয়ে, একই array-তে (in-place)।\",\n ex:[[\"nums = [0,1,0,3,12]\",\"[1,3,12,0,0]\"]],\n cave:[\"দুই pointer: write আর read।\",\"০ না হলে nums[write] = x, write++।\",\"শেষে write থেকে বাকিটা ০।\",\"অথবা swap করো।\"],\n hint:\"অ-শূন্য সংখ্যাগুলোকে সামনে একে একে বসাও।\",\n sol:`function moveZeroes(nums) {\n  let w = 0;                           // পরের অ-শূন্য কোথায় বসবে\n  for (let r = 0; r \u003c nums.length; r++) {\n    if (nums[r] !== 0) {\n      [nums[w], nums[r]] = [nums[r], nums[w]];\n      w++;\n    }\n  }\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[[0,1,0,3,12]],[1,3,12,0,0]],[[[0]],[0]],[[[1,2]],[1,2]],[[[0,0,1]],[1,0,0]]],run:\"(f,a)=>{f(...a);return a[0]}\",\n say:\"Write pointer দিয়ে অ-শূন্য গুলো সামনে swap করি, ক্রম ঠিক থাকে, বাড়তি জায়গা লাগে না।\"},\n{id:\"remove-duplicates\",n:26,t:\"Remove Duplicates from Sorted Array\",g:\"Two Pointers\",fn:\"removeDuplicates\",args:\"nums\",\n d:\"Sorted array থেকে duplicate সরাও in-place। প্রথম k ঘরে আলাদা সংখ্যাগুলো রাখো আর k ফেরত দাও।\",\n ex:[[\"nums = [1,1,2]\",\"2, nums = [1,2,_]\"],[\"nums = [0,0,1,1,1,2,2,3,3,4]\",\"5, nums = [0,1,2,3,4,...]\"]],\n cave:[\"Sorted, তাই duplicate পাশাপাশি।\",\"w = 1।\",\"nums[r] ≠ nums[w−1] হলে nums[w++] = nums[r]।\",\"শেষে w-ই k।\"],\n hint:\"আগের রাখা সংখ্যার থেকে আলাদা হলে তবেই রাখো।\",\n sol:`function removeDuplicates(nums) {\n  if (!nums.length) return 0;\n  let w = 1;\n  for (let r = 1; r \u003c nums.length; r++) {\n    if (nums[r] !== nums[w - 1]) nums[w++] = nums[r];\n  }\n  return w;\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[[1,1,2]],[2,[1,2]]],[[[0,0,1,1,1,2,2,3,3,4]],[5,[0,1,2,3,4]]],[[[1]],[1,[1]]]],run:\"(f,a)=>{const k=f(...a);return [k,a[0].slice(0,k)]}\",\n say:\"Sorted বলে duplicate পাশাপাশি থাকে; write pointer দিয়ে শুধু নতুন মান লিখি। O(n), O(1)।\"},\n{id:\"best-time-stock\",n:121,t:\"Best Time to Buy and Sell Stock\",g:\"Array & Hashing\",fn:\"maxProfit\",args:\"prices\",\n d:\"প্রতিদিনের শেয়ারের দাম দেওয়া। একদিন কিনে পরের কোনো দিন বেচে সর্বোচ্চ লাভ কত? লাভ না হলে ০।\",\n ex:[[\"prices = [7,1,5,3,6,4]\",\"5 (১-এ কিনে ৬-এ বেচো)\"],[\"prices = [7,6,4,3,1]\",\"0\"]],\n cave:[\"এখন পর্যন্ত সবচেয়ে কম দাম মনে রাখো।\",\"প্রতিদিন: আজ বেচলে লাভ = আজ − min।\",\"সর্বোচ্চ লাভ update।\",\"এক pass।\"],\n hint:\"আজ বেচলে, অতীতের সবচেয়ে সস্তা দিনে কেনা উচিত ছিল।\",\n sol:`function maxProfit(prices) {\n  let min = Infinity, best = 0;\n  for (const p of prices) {\n    min = Math.min(min, p);\n    best = Math.max(best, p - min);\n  }\n  return best;\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[[7,1,5,3,6,4]],5],[[[7,6,4,3,1]],0],[[[2,4,1]],2],[[[1]],0]],\n say:\"এখন পর্যন্ত সর্বনিম্ন দাম রাখি, প্রতিদিন আজ বেচলে কত লাভ দেখি। এক pass, O(n)।\"},\n{id:\"plus-one\",n:66,t:\"Plus One\",g:\"Array & Hashing\",fn:\"plusOne\",args:\"digits\",\n d:\"একটা বড় সংখ্যা digit-এর array হিসেবে দেওয়া। সংখ্যাটায় ১ যোগ করে আবার array ফেরত দাও।\",\n ex:[[\"digits = [1,2,3]\",\"[1,2,4]\"],[\"digits = [9,9]\",\"[1,0,0]\"]],\n cave:[\"শেষ থেকে শুরু।\",\"৯ না হলে +১ করে return।\",\"৯ হলে ০ করো, carry সামনে যায়।\",\"সব ৯ হলে সামনে ১ বসাও।\"],\n hint:\"হাতে যোগ করার মতো, ডান থেকে carry।\",\n sol:`function plusOne(digits) {\n  for (let i = digits.length - 1; i >= 0; i--) {\n    if (digits[i] \u003c 9) { digits[i]++; return digits; }\n    digits[i] = 0;                 // ৯ → ০, carry চলবে\n  }\n  return [1, ...digits];           // সব ৯ ছিল\n}`,tc:\"O(n) time\",\n tests:[[[[1,2,3]],[1,2,4]],[[[9]],[1,0]],[[[9,9]],[1,0,0]],[[[4,3,2,1]],[4,3,2,2]]],\n say:\"ডান থেকে যাই, ৯ না হলে বাড়িয়ে শেষ, ৯ হলে ০ করে carry। সব ৯ হলে সামনে ১।\"},\n{id:\"single-number\",n:136,t:\"Single Number\",g:\"Bit Manipulation\",fn:\"singleNumber\",args:\"nums\",\n d:\"সব সংখ্যা দুবার করে আছে, শুধু একটা একবার। সেটা খুঁজে বের করো, বাড়তি জায়গা ছাড়া।\",\n ex:[[\"nums = [4,1,2,1,2]\",\"4\"]],\n cave:[\"XOR-এর জাদু: a ^ a = 0, a ^ 0 = a।\",\"সব XOR করো।\",\"জোড়াগুলো কেটে যায়।\",\"যা বাকি থাকে সেটাই উত্তর।\"],\n hint:\"কোন operation-এ একই সংখ্যা দুবার দিলে ০ হয়ে যায়?\",\n sol:`function singleNumber(nums) {\n  let x = 0;\n  for (const n of nums) x ^= n;   // জোড়া কেটে যায়\n  return x;\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[[2,2,1]],1],[[[4,1,2,1,2]],4],[[[1]],1]],\n say:\"সব সংখ্যা XOR করি; a^a=0 বলে জোড়াগুলো বাতিল হয়, একা যেটা সেটা থাকে। O(1) জায়গা।\"},\n{id:\"intersection-ii\",n:350,t:\"Intersection of Two Arrays II\",g:\"Array & Hashing\",fn:\"intersect\",args:\"nums1, nums2\",\n d:\"দুই array-তে যে সংখ্যাগুলো common, যতবার দুটোতেই আছে ততবার করে ফেরত দাও (যেকোনো ক্রমে)।\",\n ex:[[\"nums1 = [1,2,2,1], nums2 = [2,2]\",\"[2,2]\"],[\"nums1 = [4,9,5], nums2 = [9,4,9,8,4]\",\"[4,9]\"]],\n cave:[\"nums1-এর count Map-এ।\",\"nums2-এর প্রতিটায় count > 0 হলে নাও, count−−।\",\"Sorted হলে two pointer-ও চলে।\"],\n hint:\"কোন সংখ্যা কতবার আছে গুনে রাখো।\",\n sol:`function intersect(nums1, nums2) {\n  const cnt = new Map(), res = [];\n  for (const x of nums1) cnt.set(x, (cnt.get(x) || 0) + 1);\n  for (const x of nums2) {\n    if (cnt.get(x) > 0) { res.push(x); cnt.set(x, cnt.get(x) - 1); }\n  }\n  return res;\n}`,tc:\"O(n + m) time\",\n tests:[[[[1,2,2,1],[2,2]],[2,2]],[[[4,9,5],[9,4,9,8,4]],[4,9]],[[[1],[2]],[]]],run:\"(f,a)=>f(...a).slice().sort((x,y)=>x-y)\",\n say:\"একটা array-র count Map-এ রাখি, অন্যটায় মিললে নিই আর count কমাই। O(n+m)।\"},\n{id:\"missing-number\",n:268,t:\"Missing Number\",g:\"Math\",fn:\"missingNumber\",args:\"nums\",\n d:\"০ থেকে n পর্যন্ত n+1টা সংখ্যার মধ্যে একটা নেই, বাকি n টা array-তে। কোনটা নেই?\",\n ex:[[\"nums = [3,0,1]\",\"2\"],[\"nums = [9,6,4,2,3,5,7,0,1]\",\"8\"]],\n cave:[\"০..n-এর যোগফল = n(n+1)/2।\",\"Array-র যোগফল বিয়োগ করো।\",\"বাকিটাই missing।\",\"XOR দিয়েও হয়।\"],\n hint:\"পুরো যোগফল জানা থাকলে কী বাদ গেছে বের করা সহজ।\",\n sol:`function missingNumber(nums) {\n  const n = nums.length;\n  let sum = (n * (n + 1)) / 2;\n  for (const x of nums) sum -= x;\n  return sum;\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[[3,0,1]],2],[[[0,1]],2],[[[9,6,4,2,3,5,7,0,1]],8],[[[1]],0]],\n say:\"০ থেকে n-এর যোগফল সূত্রে বের করে array-র যোগফল বিয়োগ করি। O(n), O(1)।\"},\n{id:\"running-sum\",n:1480,t:\"Running Sum of 1d Array\",g:\"Prefix Sum\",fn:\"runningSum\",args:\"nums\",\n d:\"প্রতিটা ঘরে শুরু থেকে ওই ঘর পর্যন্ত যোগফল বসাও।\",\n ex:[[\"nums = [1,2,3,4]\",\"[1,3,6,10]\"]],\n cave:[\"Prefix sum: nums[i] += nums[i−1]।\",\"এটাই অনেক range-sum problem-এর ভিত্তি।\"],\n hint:\"আগের ঘরের যোগফলের সাথে এই ঘর যোগ।\",\n sol:`function runningSum(nums) {\n  const out = [...nums];\n  for (let i = 1; i \u003c out.length; i++) out[i] += out[i - 1];\n  return out;\n}`,tc:\"O(n) time\",\n tests:[[[[1,2,3,4]],[1,3,6,10]],[[[1,1,1,1,1]],[1,2,3,4,5]],[[[3,1,2,10,1]],[3,4,6,16,17]]],\n say:\"Prefix sum বানাই, প্রতিটা ঘর আগের যোগফল + নিজে। পরে যেকোনো range-এর যোগ O(1)-এ বের করা যায়।\"},\n\n// ───────── Strings & Two Pointers ─────────\n{id:\"valid-palindrome\",n:125,t:\"Valid Palindrome\",g:\"Two Pointers\",fn:\"isPalindrome\",args:\"s\",\n d:\"শুধু অক্ষর আর সংখ্যা ধরে (ছোট-বড় হাতের পার্থক্য বাদ দিয়ে) string-টা সামনে থেকে আর পেছন থেকে একই কিনা।\",\n ex:[[\"s = \\\"A man, a plan, a canal: Panama\\\"\",\"true\"],[\"s = \\\"race a car\\\"\",\"false\"]],\n cave:[\"দুই pointer: শুরু আর শেষ।\",\"অক্ষর/সংখ্যা না হলে skip।\",\"lowercase-এ মিলাও।\",\"না মিললে false।\"],\n hint:\"দুই প্রান্ত থেকে মাঝের দিকে আসো।\",\n sol:`function isPalindrome(s) {\n  const ok = c => /[a-z0-9]/i.test(c);\n  let l = 0, r = s.length - 1;\n  while (l \u003c r) {\n    if (!ok(s[l])) { l++; continue; }\n    if (!ok(s[r])) { r--; continue; }\n    if (s[l].toLowerCase() !== s[r].toLowerCase()) return false;\n    l++; r--;\n  }\n  return true;\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[\"A man, a plan, a canal: Panama\"],true],[[\"race a car\"],false],[[\" \"],true],[[\"0P\"],false]],\n say:\"দুই pointer দুই প্রান্ত থেকে আসে, অপ্রয়োজনীয় অক্ষর বাদ দিয়ে মিলাই। বাড়তি string বানাই না, O(1) জায়গা।\"},\n{id:\"reverse-string\",n:344,t:\"Reverse String\",g:\"Two Pointers\",fn:\"reverseString\",args:\"s\",\n d:\"অক্ষরের array উল্টে দাও in-place।\",\n ex:[[\"s = [\\\"h\\\",\\\"e\\\",\\\"l\\\",\\\"l\\\",\\\"o\\\"]\",\"[\\\"o\\\",\\\"l\\\",\\\"l\\\",\\\"e\\\",\\\"h\\\"]\"]],\n cave:[\"l = 0, r = শেষ।\",\"swap, তারপর l++, r−−।\",\"মাঝে এলে থামো।\"],\n hint:\"প্রথম আর শেষ অদলবদল, তারপর ভেতরের দিকে।\",\n sol:`function reverseString(s) {\n  let l = 0, r = s.length - 1;\n  while (l \u003c r) {\n    [s[l], s[r]] = [s[r], s[l]];\n    l++; r--;\n  }\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[[\"h\",\"e\",\"l\",\"l\",\"o\"]],[\"o\",\"l\",\"l\",\"e\",\"h\"]],[[[\"H\",\"a\",\"n\",\"n\",\"a\",\"h\"]],[\"h\",\"a\",\"n\",\"n\",\"a\",\"H\"]]],run:\"(f,a)=>{f(...a);return a[0]}\",\n say:\"দুই প্রান্ত swap করতে করতে মাঝে আসি। O(n), বাড়তি জায়গা নেই।\"},\n{id:\"merge-sorted-array\",n:88,t:\"Merge Sorted Array\",g:\"Two Pointers\",fn:\"merge\",args:\"nums1, m, nums2, n\",\n d:\"দুইটা sorted array। nums1-এর শেষে n টা খালি (০) ঘর আছে। nums2-কে nums1-এর ভেতরে merge করো, sorted রেখে।\",\n ex:[[\"nums1 = [1,2,3,0,0,0], m = 3, nums2 = [2,5,6], n = 3\",\"[1,2,2,3,5,6]\"]],\n cave:[\"সামনে থেকে বসালে overwrite হয়।\",\"পেছন থেকে বসাও!\",\"তিন pointer: i = m−1, j = n−1, k = শেষ।\",\"বড়টা nums1[k]-এ।\",\"nums2 বাকি থাকলে কপি।\"],\n hint:\"খালি জায়গা কোথায়? সেখান থেকে শুরু করো।\",\n sol:`function merge(nums1, m, nums2, n) {\n  let i = m - 1, j = n - 1, k = m + n - 1;\n  while (j >= 0) {\n    if (i >= 0 && nums1[i] > nums2[j]) nums1[k--] = nums1[i--];\n    else nums1[k--] = nums2[j--];\n  }\n}`,tc:\"O(m + n) time, O(1) space\",\n tests:[[[[1,2,3,0,0,0],3,[2,5,6],3],[1,2,2,3,5,6]],[[[1],1,[],0],[1]],[[[0],0,[1],1],[1]],[[[4,5,6,0,0,0],3,[1,2,3],3],[1,2,3,4,5,6]]],run:\"(f,a)=>{f(...a);return a[0]}\",\n say:\"পেছন থেকে merge করি, কারণ nums1-এর শেষে খালি জায়গা; এতে কিছু overwrite হয় না আর বাড়তি array লাগে না।\"},\n{id:\"longest-common-prefix\",n:14,t:\"Longest Common Prefix\",g:\"Strings\",fn:\"longestCommonPrefix\",args:\"strs\",\n d:\"কয়েকটা string-এর সবচেয়ে লম্বা common শুরু অংশ কী? না থাকলে খালি string।\",\n ex:[[\"strs = [\\\"flower\\\",\\\"flow\\\",\\\"flight\\\"]\",\"\\\"fl\\\"\"],[\"strs = [\\\"dog\\\",\\\"racecar\\\",\\\"car\\\"]\",\"\\\"\\\"\"]],\n cave:[\"প্রথম string-কে prefix ধরো।\",\"প্রতিটা string-এর শুরুতে না মিললে prefix-এর শেষ কাটো।\",\"খালি হলে থামো।\"],\n hint:\"প্রথমটাকে নমুনা ধরে ছোট করতে থাকো।\",\n sol:`function longestCommonPrefix(strs) {\n  let p = strs[0] ?? '';\n  for (const s of strs) {\n    while (!s.startsWith(p)) p = p.slice(0, -1);\n    if (!p) break;\n  }\n  return p;\n}`,tc:\"O(সব অক্ষর) time\",\n tests:[[[[\"flower\",\"flow\",\"flight\"]],\"fl\"],[[[\"dog\",\"racecar\",\"car\"]],\"\"],[[[\"a\"]],\"a\"],[[[\"ab\",\"a\"]],\"a\"]],\n say:\"প্রথম string-কে prefix ধরে, যতক্ষণ বাকিগুলোর শুরুতে না মেলে ততক্ষণ ছোট করি।\"},\n{id:\"is-subsequence\",n:392,t:\"Is Subsequence\",g:\"Two Pointers\",fn:\"isSubsequence\",args:\"s, t\",\n d:\"t থেকে কিছু অক্ষর বাদ দিয়ে (ক্রম না বদলে) s পাওয়া যায় কিনা।\",\n ex:[[\"s = \\\"abc\\\", t = \\\"ahbgdc\\\"\",\"true\"],[\"s = \\\"axc\\\", t = \\\"ahbgdc\\\"\",\"false\"]],\n cave:[\"i চলে s-এ, j চলে t-এ।\",\"মিললে i++।\",\"j সবসময় ++।\",\"শেষে i === s.length?\"],\n hint:\"t-এর উপর দিয়ে হাঁটো, s-এর পরের অক্ষর খোঁজো।\",\n sol:`function isSubsequence(s, t) {\n  let i = 0;\n  for (let j = 0; j \u003c t.length && i \u003c s.length; j++) {\n    if (s[i] === t[j]) i++;\n  }\n  return i === s.length;\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[\"abc\",\"ahbgdc\"],true],[[\"axc\",\"ahbgdc\"],false],[[\"\",\"abc\"],true],[[\"b\",\"c\"],false]],\n say:\"দুই pointer: t-এর উপর দিয়ে যাই, মিললে s-এর pointer এগোয়; শেষে s পুরো মিললে true।\"},\n{id:\"first-unique-char\",n:387,t:\"First Unique Character in a String\",g:\"Array & Hashing\",fn:\"firstUniqChar\",args:\"s\",\n d:\"String-এ প্রথম যে অক্ষর মাত্র একবার আছে তার index। না থাকলে −১।\",\n ex:[[\"s = \\\"leetcode\\\"\",\"0\"],[\"s = \\\"loveleetcode\\\"\",\"2\"],[\"s = \\\"aabb\\\"\",\"-1\"]],\n cave:[\"প্রথম pass: প্রতিটা অক্ষর গুনো।\",\"দ্বিতীয় pass: count ১ হলে সেই index।\"],\n hint:\"দুইবার হাঁটো: একবার গুনতে, একবার খুঁজতে।\",\n sol:`function firstUniqChar(s) {\n  const cnt = {};\n  for (const c of s) cnt[c] = (cnt[c] || 0) + 1;\n  for (let i = 0; i \u003c s.length; i++) if (cnt[s[i]] === 1) return i;\n  return -1;\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[\"leetcode\"],0],[[\"loveleetcode\"],2],[[\"aabb\"],-1]],\n say:\"এক pass-এ গুনি, দ্বিতীয় pass-এ প্রথম যার count ১ সেটা ফেরত দিই। O(n)।\"},\n{id:\"roman-to-integer\",n:13,t:\"Roman to Integer\",g:\"Strings\",fn:\"romanToInt\",args:\"s\",\n d:\"Roman সংখ্যা (I, V, X, L, C, D, M) থেকে সাধারণ সংখ্যা। ছোটটা বড়টার আগে থাকলে বিয়োগ (IV = ৪)।\",\n ex:[[\"s = \\\"III\\\"\",\"3\"],[\"s = \\\"MCMXCIV\\\"\",\"1994\"]],\n cave:[\"Map: I=1, V=5, X=10 ...\",\"বাম থেকে যাও।\",\"এটার মান \u003c পরেরটার মান → বিয়োগ।\",\"না হলে যোগ।\"],\n hint:\"পরের অক্ষরের মান বড় হলে এটা মাইনাস।\",\n sol:`function romanToInt(s) {\n  const v = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };\n  let total = 0;\n  for (let i = 0; i \u003c s.length; i++) {\n    const cur = v[s[i]], next = v[s[i + 1]] || 0;\n    total += cur \u003c next ? -cur : cur;\n  }\n  return total;\n}`,tc:\"O(n) time\",\n tests:[[[\"III\"],3],[[\"LVIII\"],58],[[\"MCMXCIV\"],1994],[[\"IV\"],4]],\n say:\"প্রতিটা অক্ষরের মান দেখি, পরেরটা বড় হলে বিয়োগ, না হলে যোগ। এক pass।\"},\n{id:\"ransom-note\",n:383,t:\"Ransom Note\",g:\"Array & Hashing\",fn:\"canConstruct\",args:\"ransomNote, magazine\",\n d:\"Magazine-এর অক্ষর কেটে (প্রতিটা একবারই ব্যবহার) ransomNote বানানো যাবে কিনা।\",\n ex:[[\"ransomNote = \\\"aa\\\", magazine = \\\"aab\\\"\",\"true\"],[\"ransomNote = \\\"aa\\\", magazine = \\\"ab\\\"\",\"false\"]],\n cave:[\"Magazine-এর অক্ষর গুনো।\",\"Note-এর প্রতিটায় count−−।\",\"কম পড়লে false।\"],\n hint:\"Anagram-এর মতোই, শুধু magazine-এ বেশি থাকতে পারে।\",\n sol:`function canConstruct(ransomNote, magazine) {\n  const cnt = {};\n  for (const c of magazine) cnt[c] = (cnt[c] || 0) + 1;\n  for (const c of ransomNote) {\n    if (!cnt[c]) return false;\n    cnt[c]--;\n  }\n  return true;\n}`,tc:\"O(n + m) time\",\n tests:[[[\"a\",\"b\"],false],[[\"aa\",\"ab\"],false],[[\"aa\",\"aab\"],true]],\n say:\"Magazine-এর অক্ষর গুনে রাখি, note-এর প্রতিটা অক্ষরে একটা করে খরচ করি; কম পড়লে false।\"},\n\n// ───────── Stack ─────────\n{id:\"valid-parentheses\",n:20,t:\"Valid Parentheses\",g:\"Stack\",fn:\"isValid\",args:\"s\",\n d:\"শুধু ( ) { } [ ] দিয়ে তৈরি string। প্রতিটা খোলা bracket ঠিক ধরনের বন্ধ দিয়ে ঠিক ক্রমে বন্ধ হয়েছে কিনা।\",\n ex:[[\"s = \\\"()[]{}\\\"\",\"true\"],[\"s = \\\"(]\\\"\",\"false\"],[\"s = \\\"([)]\\\"\",\"false\"]],\n cave:[\"খোলা → stack-এ push।\",\"বন্ধ → stack-এর উপরেরটা মিলবে তো?\",\"না মিললে বা stack খালি → false।\",\"শেষে stack খালি হতে হবে।\"],\n hint:\"সবশেষে খোলাটাই সবার আগে বন্ধ হয় (LIFO)।\",\n sol:`function isValid(s) {\n  const pair = { ')': '(', ']': '[', '}': '{' };\n  const st = [];\n  for (const c of s) {\n    if (!pair[c]) st.push(c);                 // খোলা\n    else if (st.pop() !== pair[c]) return false;\n  }\n  return st.length === 0;\n}`,tc:\"O(n) time, O(n) space\",\n tests:[[[\"()\"],true],[[\"()[]{}\"],true],[[\"(]\"],false],[[\"([)]\"],false],[[\"{[]}\"],true],[[\"(\"],false]],\n say:\"Stack-এ খোলা bracket রাখি, বন্ধ এলে উপরেরটার সাথে মিলাই। শেষে stack খালি হলে valid। O(n)।\"},\n\n// ───────── Binary Search ─────────\n{id:\"binary-search\",n:704,t:\"Binary Search\",g:\"Binary Search\",fn:\"search\",args:\"nums, target\",\n d:\"Sorted array-তে target-এর index খোঁজো, না থাকলে −১। O(log n) হতে হবে।\",\n ex:[[\"nums = [-1,0,3,5,9,12], target = 9\",\"4\"],[\"nums = [-1,0,3,5,9,12], target = 2\",\"-1\"]],\n cave:[\"l = 0, r = শেষ।\",\"mid দেখো।\",\"ছোট হলে ডানে, বড় হলে বামে।\",\"প্রতিবার অর্ধেক বাদ।\"],\n hint:\"অভিধানে শব্দ খোঁজার মতো, মাঝখান খুলে দেখো।\",\n sol:`function search(nums, target) {\n  let l = 0, r = nums.length - 1;\n  while (l \u003c= r) {\n    const mid = (l + r) >> 1;\n    if (nums[mid] === target) return mid;\n    if (nums[mid] \u003c target) l = mid + 1;\n    else r = mid - 1;\n  }\n  return -1;\n}`,tc:\"O(log n) time\",\n tests:[[[[-1,0,3,5,9,12],9],4],[[[-1,0,3,5,9,12],2],-1],[[[5],5],0]],\n say:\"Sorted বলে মাঝখান দেখে অর্ধেক বাদ দিই, প্রতিবার। O(log n)।\"},\n{id:\"search-insert\",n:35,t:\"Search Insert Position\",g:\"Binary Search\",fn:\"searchInsert\",args:\"nums, target\",\n d:\"Sorted array-তে target থাকলে তার index, না থাকলে কোথায় বসালে sorted থাকে সেই index।\",\n ex:[[\"nums = [1,3,5,6], target = 5\",\"2\"],[\"nums = [1,3,5,6], target = 2\",\"1\"],[\"nums = [1,3,5,6], target = 7\",\"4\"]],\n cave:[\"সাধারণ binary search।\",\"না পেলে শেষে l-ই উত্তর।\"],\n hint:\"Loop শেষে l কোথায় দাঁড়ায়?\",\n sol:`function searchInsert(nums, target) {\n  let l = 0, r = nums.length - 1;\n  while (l \u003c= r) {\n    const mid = (l + r) >> 1;\n    if (nums[mid] === target) return mid;\n    if (nums[mid] \u003c target) l = mid + 1;\n    else r = mid - 1;\n  }\n  return l;   // প্রথম বড় সংখ্যার জায়গা\n}`,tc:\"O(log n) time\",\n tests:[[[[1,3,5,6],5],2],[[[1,3,5,6],2],1],[[[1,3,5,6],7],4],[[[1,3,5,6],0],0]],\n say:\"Binary search চালাই; না পেলে loop শেষে l ঠিক সেই জায়গায় থাকে যেখানে বসাতে হবে।\"},\n{id:\"sqrt-x\",n:69,t:\"Sqrt(x)\",g:\"Binary Search\",fn:\"mySqrt\",args:\"x\",\n d:\"x-এর বর্গমূলের পূর্ণসংখ্যা অংশ বের করো, Math.sqrt ছাড়া।\",\n ex:[[\"x = 4\",\"2\"],[\"x = 8\",\"2 (২.৮২... থেকে)\"]],\n cave:[\"উত্তর ০ থেকে x-এর মধ্যে।\",\"Binary search: mid*mid ≤ x?\",\"হ্যাঁ হলে উত্তর হতে পারে, ডানে যাও।\",\"না হলে বামে।\"],\n hint:\"উত্তরের পরিসরে binary search।\",\n sol:`function mySqrt(x) {\n  let l = 0, r = x, ans = 0;\n  while (l \u003c= r) {\n    const mid = Math.floor((l + r) / 2);\n    if (mid * mid \u003c= x) { ans = mid; l = mid + 1; }\n    else r = mid - 1;\n  }\n  return ans;\n}`,tc:\"O(log x) time\",\n tests:[[[4],2],[[8],2],[[0],0],[[1],1],[[2147395599],46339]],\n say:\"উত্তরের পরিসর ০ থেকে x-এ binary search করি, mid² ≤ x হলে ডানে যাই। O(log x)।\"},\n\n// ───────── DP / Recursion ─────────\n{id:\"climbing-stairs\",n:70,t:\"Climbing Stairs\",g:\"Dynamic Programming\",fn:\"climbStairs\",args:\"n\",\n d:\"n ধাপের সিঁড়ি, একবারে ১ বা ২ ধাপ ওঠা যায়। কতভাবে উপরে ওঠা যায়?\",\n ex:[[\"n = 2\",\"2\"],[\"n = 3\",\"3\"]],\n cave:[\"শেষ ধাপে আসা যায় n−১ থেকে বা n−২ থেকে।\",\"ways(n) = ways(n−1) + ways(n−2)।\",\"এটা Fibonacci!\",\"শুধু দুইটা variable রাখো।\"],\n hint:\"শেষ লাফটা ১ ধাপের ছিল নাকি ২ ধাপের?\",\n sol:`function climbStairs(n) {\n  let a = 1, b = 1;          // ways(0), ways(1)\n  for (let i = 2; i \u003c= n; i++) [a, b] = [b, a + b];\n  return b;\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[1],1],[[2],2],[[3],3],[[5],8],[[45],1836311903]],\n say:\"n-এ পৌঁছানো যায় n−১ বা n−২ থেকে, তাই ways(n) = ways(n−1) + ways(n−2)। শুধু শেষ দুইটা মান রাখি, O(1) জায়গা।\"},\n{id:\"fibonacci\",n:509,t:\"Fibonacci Number\",g:\"Dynamic Programming\",fn:\"fib\",args:\"n\",\n d:\"F(0)=0, F(1)=1, F(n)=F(n−1)+F(n−2)। F(n) বের করো।\",\n ex:[[\"n = 4\",\"3\"]],\n cave:[\"সরাসরি recursion = O(2ⁿ), একই হিসাব বারবার।\",\"Memo বা loop = O(n)।\",\"দুইটা variable যথেষ্ট।\"],\n hint:\"একই F(k) বারবার হিসাব কোরো না।\",\n sol:`function fib(n) {\n  let a = 0, b = 1;\n  for (let i = 0; i \u003c n; i++) [a, b] = [b, a + b];\n  return a;\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[0],0],[[1],1],[[2],1],[[4],3],[[30],832040]],\n say:\"সরল recursion একই কাজ বারবার করে, তাই নিচ থেকে loop দিয়ে শেষ দুইটা মান রেখে হিসাব করি।\"},\n{id:\"pascals-triangle\",n:118,t:\"Pascal's Triangle\",g:\"Dynamic Programming\",fn:\"generate\",args:\"numRows\",\n d:\"Pascal-এর ত্রিভুজের প্রথম numRows সারি বানাও। প্রতিটা ভেতরের সংখ্যা = উপরের দুইটার যোগফল।\",\n ex:[[\"numRows = 5\",\"[[1],[1,1],[1,2,1],[1,3,3,1],[1,4,6,4,1]]\"]],\n cave:[\"প্রতিটা সারির দুই মাথায় ১।\",\"ভেতরে: আগের সারির j−1 + j।\"],\n hint:\"আগের সারি থেকে নতুন সারি।\",\n sol:`function generate(numRows) {\n  const rows = [];\n  for (let i = 0; i \u003c numRows; i++) {\n    const row = Array(i + 1).fill(1);\n    for (let j = 1; j \u003c i; j++) row[j] = rows[i - 1][j - 1] + rows[i - 1][j];\n    rows.push(row);\n  }\n  return rows;\n}`,tc:\"O(n²) time\",\n tests:[[[1],[[1]]],[[5],[[1],[1,1],[1,2,1],[1,3,3,1],[1,4,6,4,1]]]],\n say:\"প্রতিটা সারি আগের সারি থেকে বানাই, দুই মাথায় ১ আর ভেতরে উপরের দুইটার যোগফল।\"},\n\n// ───────── Math ─────────\n{id:\"palindrome-number\",n:9,t:\"Palindrome Number\",g:\"Math\",fn:\"isPalindromeNum\",args:\"x\",\n d:\"পূর্ণসংখ্যা x উল্টালে একই থাকে কিনা। ঋণাত্মক হলে false।\",\n ex:[[\"x = 121\",\"true\"],[\"x = -121\",\"false\"],[\"x = 10\",\"false\"]],\n cave:[\"String বানিয়ে উল্টানো সহজ।\",\"String ছাড়া: অর্ধেক উল্টাও।\",\"x % 10 দিয়ে শেষ digit, x/10 দিয়ে বাদ।\"],\n hint:\"শেষ digit গুলো দিয়ে উল্টো সংখ্যা বানাও।\",\n sol:`function isPalindromeNum(x) {\n  if (x \u003c 0 || (x % 10 === 0 && x !== 0)) return false;\n  let rev = 0;\n  while (x > rev) {                 // অর্ধেক পর্যন্ত উল্টাও\n    rev = rev * 10 + (x % 10);\n    x = Math.floor(x / 10);\n  }\n  return x === rev || x === Math.floor(rev / 10);\n}`,tc:\"O(log x) time, O(1) space\",\n tests:[[[121],true],[[-121],false],[[10],false],[[0],true],[[1221],true]],\n say:\"String না বানিয়ে শেষ digit দিয়ে অর্ধেক সংখ্যা উল্টাই আর বাকি অর্ধেকের সাথে মিলাই।\"},\n{id:\"fizz-buzz\",n:412,t:\"Fizz Buzz\",g:\"Math\",fn:\"fizzBuzz\",args:\"n\",\n d:\"১ থেকে n: ৩ আর ৫ দুটোতেই ভাগ গেলে \\\"FizzBuzz\\\", শুধু ৩-এ \\\"Fizz\\\", শুধু ৫-এ \\\"Buzz\\\", না হলে সংখ্যাটা string হিসেবে।\",\n ex:[[\"n = 5\",\"[\\\"1\\\",\\\"2\\\",\\\"Fizz\\\",\\\"4\\\",\\\"Buzz\\\"]\"]],\n cave:[\"আগে ১৫ চেক করো!\",\"তারপর ৩, তারপর ৫।\",\"ক্রম ভুল হলেই bug।\"],\n hint:\"কোন শর্ত আগে চেক করতে হবে?\",\n sol:`function fizzBuzz(n) {\n  const out = [];\n  for (let i = 1; i \u003c= n; i++) {\n    if (i % 15 === 0) out.push('FizzBuzz');\n    else if (i % 3 === 0) out.push('Fizz');\n    else if (i % 5 === 0) out.push('Buzz');\n    else out.push(String(i));\n  }\n  return out;\n}`,tc:\"O(n) time\",\n tests:[[[3],[\"1\",\"2\",\"Fizz\"]],[[5],[\"1\",\"2\",\"Fizz\",\"4\",\"Buzz\"]],[[15],[\"1\",\"2\",\"Fizz\",\"4\",\"Buzz\",\"Fizz\",\"7\",\"8\",\"Fizz\",\"Buzz\",\"11\",\"Fizz\",\"13\",\"14\",\"FizzBuzz\"]]],\n say:\"সবচেয়ে নির্দিষ্ট শর্ত (১৫) আগে চেক করি, তারপর ৩ আর ৫।\"},\n{id:\"power-of-two\",n:231,t:\"Power of Two\",g:\"Bit Manipulation\",fn:\"isPowerOfTwo\",args:\"n\",\n d:\"n কি ২-এর কোনো ঘাত (১, ২, ৪, ৮, ...)?\",\n ex:[[\"n = 16\",\"true\"],[\"n = 3\",\"false\"]],\n cave:[\"২-এর ঘাতের binary-তে ঠিক একটা ১।\",\"n & (n − 1) শেষ ১-টা মুছে দেয়।\",\"তাই n > 0 আর n & (n−1) === 0।\"],\n hint:\"8 = 1000, 7 = 0111। দুটো AND করলে?\",\n sol:`function isPowerOfTwo(n) {\n  return n > 0 && (n & (n - 1)) === 0;\n}`,tc:\"O(1)\",\n tests:[[[1],true],[[16],true],[[3],false],[[0],false],[[-16],false]],\n say:\"২-এর ঘাতে binary-তে একটাই ১ থাকে; n & (n−1) সেটা মুছে ০ বানায়। O(1)।\"},\n{id:\"number-of-1-bits\",n:191,t:\"Number of 1 Bits\",g:\"Bit Manipulation\",fn:\"hammingWeight\",args:\"n\",\n d:\"একটা ধনাত্মক সংখ্যার binary-তে কয়টা ১ আছে?\",\n ex:[[\"n = 11 (1011)\",\"3\"],[\"n = 128 (10000000)\",\"1\"]],\n cave:[\"n & (n − 1) প্রতিবার একটা ১ মুছে।\",\"যতবার মুছতে পারো = উত্তর।\",\"অথবা n & 1 দেখে n >>>= 1।\"],\n hint:\"Power of Two-এর trick-টা বারবার চালাও।\",\n sol:`function hammingWeight(n) {\n  let count = 0;\n  while (n !== 0) {\n    n &= n - 1;     // সবচেয়ে ডানের ১ মুছে দেয়\n    count++;\n  }\n  return count;\n}`,tc:\"O(১-এর সংখ্যা)\",\n tests:[[[11],3],[[128],1],[[2147483645],30],[[0],0]],\n say:\"n & (n−1) প্রতিবার সবচেয়ে ডানের ১ মুছে দেয়, কয়বার মুছলাম সেটাই উত্তর।\"},\n\n// ───────── Linked List ─────────\n{id:\"reverse-linked-list\",n:206,t:\"Reverse Linked List\",g:\"Linked List\",fn:\"reverseList\",args:\"head\",\n d:\"Singly linked list উল্টে দাও আর নতুন head ফেরত দাও। (Node: { val, next })\",\n ex:[[\"head = 1→2→3→4→5\",\"5→4→3→2→1\"]],\n cave:[\"তিনটা pointer: prev, cur, next।\",\"next = cur.next সেভ করো।\",\"cur.next = prev (তীর উল্টাও)।\",\"prev = cur, cur = next।\",\"শেষে prev-ই নতুন head।\"],\n hint:\"প্রতিটা node-এর তীর পেছনের দিকে ঘোরাও, কিন্তু আগে পরেরটা হারিয়ে ফেলো না।\",\n sol:`function reverseList(head) {\n  let prev = null, cur = head;\n  while (cur) {\n    const next = cur.next;   // হারানোর আগে সেভ\n    cur.next = prev;         // তীর উল্টাও\n    prev = cur;\n    cur = next;\n  }\n  return prev;\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[[1,2,3,4,5]],[5,4,3,2,1]],[[[1,2]],[2,1]],[[[]],[]]],run:\"(f,a)=>toArr(f(toList(a[0])))\",\n say:\"prev, cur, next তিনটা pointer দিয়ে প্রতিটা node-এর next উল্টে দিই। O(n), বাড়তি জায়গা নেই।\"},\n{id:\"merge-two-lists\",n:21,t:\"Merge Two Sorted Lists\",g:\"Linked List\",fn:\"mergeTwoLists\",args:\"list1, list2\",\n d:\"দুইটা sorted linked list জুড়ে একটা sorted list বানাও।\",\n ex:[[\"1→2→4, 1→3→4\",\"1→1→2→3→4→4\"]],\n cave:[\"Dummy node দিয়ে শুরু (edge case কমে)।\",\"দুই head-এর ছোটটা জুড়ে দাও, সেটা এগোও।\",\"একটা শেষ হলে বাকিটা পুরো জুড়ে দাও।\",\"dummy.next return।\"],\n hint:\"নকল একটা শুরুর node রাখলে প্রথম node নিয়ে আলাদা চিন্তা লাগে না।\",\n sol:`function mergeTwoLists(list1, list2) {\n  const dummy = { val: 0, next: null };\n  let tail = dummy;\n  while (list1 && list2) {\n    if (list1.val \u003c= list2.val) { tail.next = list1; list1 = list1.next; }\n    else { tail.next = list2; list2 = list2.next; }\n    tail = tail.next;\n  }\n  tail.next = list1 || list2;   // বাকিটা\n  return dummy.next;\n}`,tc:\"O(n + m) time, O(1) space\",\n tests:[[[[1,2,4],[1,3,4]],[1,1,2,3,4,4]],[[[],[]],[]],[[[],[0]],[0]]],run:\"(f,a)=>toArr(f(toList(a[0]),toList(a[1])))\",\n say:\"Dummy node নিয়ে দুই list-এর ছোট head-টা একে একে জুড়ি, শেষে বাকি অংশ সরাসরি জুড়ে দিই।\"},\n{id:\"middle-linked-list\",n:876,t:\"Middle of the Linked List\",g:\"Linked List\",fn:\"middleNode\",args:\"head\",\n d:\"Linked list-এর মাঝের node ফেরত দাও। দুইটা মাঝ থাকলে দ্বিতীয়টা।\",\n ex:[[\"1→2→3→4→5\",\"3→4→5\"],[\"1→2→3→4→5→6\",\"4→5→6\"]],\n cave:[\"কচ্ছপ আর খরগোশ (slow/fast)।\",\"slow ১ ধাপ, fast ২ ধাপ।\",\"fast শেষে পৌঁছালে slow মাঝখানে।\"],\n hint:\"একজন দ্বিগুণ গতিতে চললে, সে যখন শেষে, অন্যজন কোথায়?\",\n sol:`function middleNode(head) {\n  let slow = head, fast = head;\n  while (fast && fast.next) {\n    slow = slow.next;\n    fast = fast.next.next;\n  }\n  return slow;\n}`,tc:\"O(n) time, O(1) space\",\n tests:[[[[1,2,3,4,5]],[3,4,5]],[[[1,2,3,4,5,6]],[4,5,6]],[[[1]],[1]]],run:\"(f,a)=>toArr(f(toList(a[0])))\",\n say:\"Slow আর fast pointer: fast দুই ধাপ যায়, তাই fast শেষে পৌঁছালে slow ঠিক মাঝে থাকে। এক pass।\"},\n\n// ───────── Trees ─────────\n{id:\"max-depth\",n:104,t:\"Maximum Depth of Binary Tree\",g:\"Tree\",fn:\"maxDepth\",args:\"root\",\n d:\"Binary tree-এর সর্বোচ্চ গভীরতা (root থেকে সবচেয়ে দূরের leaf পর্যন্ত node সংখ্যা)। (Node: { val, left, right })\",\n ex:[[\"root = [3,9,20,null,null,15,7]\",\"3\"]],\n cave:[\"খালি tree → ০।\",\"১ + max(বাম গভীরতা, ডান গভীরতা)।\",\"Recursion (DFS)।\",\"BFS দিয়ে level গুনলেও হয়।\"],\n hint:\"আমার গভীরতা = ১ + আমার বাচ্চাদের মধ্যে যার গভীরতা বেশি।\",\n sol:`function maxDepth(root) {\n  if (!root) return 0;\n  return 1 + Math.max(maxDepth(root.left), maxDepth(root.right));\n}`,tc:\"O(n) time, O(h) space\",\n tests:[[[[3,9,20,null,null,15,7]],3],[[[1,null,2]],2],[[[]],0]],run:\"(f,a)=>f(toTree(a[0]))\",\n say:\"Recursion: খালি হলে ০, না হলে ১ যোগ বাম আর ডানের গভীরতার বড়টা। প্রতিটা node একবার, O(n)।\"},\n{id:\"invert-tree\",n:226,t:\"Invert Binary Tree\",g:\"Tree\",fn:\"invertTree\",args:\"root\",\n d:\"Binary tree-কে আয়নায় উল্টাও: প্রতিটা node-এর বাম আর ডান অদলবদল।\",\n ex:[[\"root = [4,2,7,1,3,6,9]\",\"[4,7,2,9,6,3,1]\"]],\n cave:[\"খালি → null।\",\"বাম আর ডান swap।\",\"দুই দিকেই recursion।\"],\n hint:\"প্রতিটা node-এ শুধু বাচ্চা দুটো অদলবদল।\",\n sol:`function invertTree(root) {\n  if (!root) return null;\n  [root.left, root.right] = [invertTree(root.right), invertTree(root.left)];\n  return root;\n}`,tc:\"O(n) time\",\n tests:[[[[4,2,7,1,3,6,9]],[4,7,2,9,6,3,1]],[[[2,1,3]],[2,3,1]],[[[]],[]]],run:\"(f,a)=>fromTree(f(toTree(a[0])))\",\n say:\"প্রতিটা node-এ বাম আর ডান অদলবদল করি, recursion দিয়ে নিচ পর্যন্ত। O(n)।\"},\n{id:\"same-tree\",n:100,t:\"Same Tree\",g:\"Tree\",fn:\"isSameTree\",args:\"p, q\",\n d:\"দুইটা binary tree গঠন আর মান দুটোতেই হুবহু এক কিনা।\",\n ex:[[\"p = [1,2,3], q = [1,2,3]\",\"true\"],[\"p = [1,2], q = [1,null,2]\",\"false\"]],\n cave:[\"দুটোই null → true।\",\"একটা null → false।\",\"val আলাদা → false।\",\"বাম-বাম আর ডান-ডান দুটোই same?\"],\n hint:\"দুই tree একসাথে হাঁটো।\",\n sol:`function isSameTree(p, q) {\n  if (!p && !q) return true;\n  if (!p || !q || p.val !== q.val) return false;\n  return isSameTree(p.left, q.left) && isSameTree(p.right, q.right);\n}`,tc:\"O(n) time\",\n tests:[[[[1,2,3],[1,2,3]],true],[[[1,2],[1,null,2]],false],[[[1,2,1],[1,1,2]],false]],run:\"(f,a)=>f(toTree(a[0]),toTree(a[1]))\",\n say:\"দুই tree একসাথে recursion দিয়ে চলি: দুটো null হলে ঠিক, একটা null বা মান আলাদা হলে ভুল।\"},\n{id:\"symmetric-tree\",n:101,t:\"Symmetric Tree\",g:\"Tree\",fn:\"isSymmetric\",args:\"root\",\n d:\"Tree-টা মাঝখান দিয়ে আয়নার মতো সমান কিনা।\",\n ex:[[\"root = [1,2,2,3,4,4,3]\",\"true\"],[\"root = [1,2,2,null,3,null,3]\",\"false\"]],\n cave:[\"বাম subtree আর ডান subtree আয়না কিনা।\",\"mirror(a, b): a.val == b.val\",\"আর a.left ↔ b.right, a.right ↔ b.left।\"],\n hint:\"Same Tree-এর মতো, শুধু বাম-কে ডানের সাথে মিলাও।\",\n sol:`function isSymmetric(root) {\n  const mirror = (a, b) => {\n    if (!a && !b) return true;\n    if (!a || !b || a.val !== b.val) return false;\n    return mirror(a.left, b.right) && mirror(a.right, b.left);\n  };\n  return !root || mirror(root.left, root.right);\n}`,tc:\"O(n) time\",\n tests:[[[[1,2,2,3,4,4,3]],true],[[[1,2,2,null,3,null,3]],false],[[[1]],true]],run:\"(f,a)=>f(toTree(a[0]))\",\n say:\"বাম আর ডান subtree-কে আয়না হিসেবে মিলাই: বামের বাম ডানের ডানের সাথে, বামের ডান ডানের বামের সাথে।\"}\n];\n\nconst HELPERS='function toList(arr){let h=null;for(let i=arr.length-1;i>=0;i--)h={val:arr[i],next:h};return h;}\\nfunction toArr(h){const o=[];let n=0;while(h&&n++\u003c10000){o.push(h.val);h=h.next;}return o;}\\nfunction toTree(arr){if(!arr.length||arr[0]==null)return null;const root={val:arr[0],left:null,right:null};const q=[root];let i=1;\\n while(q.length&&i\u003carr.length){const n=q.shift();if(i\u003carr.length&&arr[i]!=null){n.left={val:arr[i],left:null,right:null};q.push(n.left);}i++;\\n if(i\u003carr.length&&arr[i]!=null){n.right={val:arr[i],left:null,right:null};q.push(n.right);}i++;}return root;}\\nfunction fromTree(root){const o=[];const q=[root];while(q.length){const n=q.shift();if(n){o.push(n.val);q.push(n.left,n.right);}else o.push(null);}while(o.length&&o[o.length-1]==null)o.pop();return o;}\\n';\nconst esc=s=>String(s).replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\");\nconst hl=s=>esc(s).split(\"\\n\").map(l=>l.replace(/(\\/\\/.*)$/,'\u003cspan class=\"cm\">$1\u003c/span>')).join(\"\\n\");\nconst bn=n=>String(n).replace(/\\d/g,d=>\"০১২৩৪৫৬৭৮৯\"[d]);\nconst LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};\nlet solved=LS.get(\"lc-solved\",{}),cur=LS.get(\"lc-cur\",PROBS[0].id),q=\"\";\nif(!PROBS.find(p=>p.id===cur))cur=PROBS[0].id;\nconst starter=p=>`function ${p.fn}(${p.args}) {\\n  \\n}\\n`;\nconst codeOf=p=>LS.get(\"lc-code-\"+p.id,starter(p));\nlet worker=null,timer=null;\nfunction runTests(p,code,cb){\n if(worker){worker.terminate();clearTimeout(timer);}\n const harness=`\\nconst __fn=(typeof ${p.fn}==='function')?${p.fn}:null;\\nconst __run=${p.run||\"(f,a)=>f(...a)\"};\\nconst __tests=${JSON.stringify(p.tests)};\\nif(!__fn){postMessage({err:'${p.fn} নামে function পাওয়া যায়নি'})}else{const out=[];for(const [args,exp] of __tests){try{const a=JSON.parse(JSON.stringify(args));const got=__run(__fn,a);out.push({ok:JSON.stringify(got)===JSON.stringify(exp),got:got===undefined?'undefined':JSON.stringify(got),exp:JSON.stringify(exp),args:JSON.stringify(args)})}catch(e){out.push({ok:false,err:String(e&&e.message||e),exp:JSON.stringify(exp),args:JSON.stringify(args)})}}postMessage({res:out})}`;\n const blob=new Blob([HELPERS+\"\\n\"+code+\"\\n\"+harness],{type:\"text/javascript\"});\n const url=URL.createObjectURL(blob);\n try{worker=new Worker(url);}catch(e){cb({err:\"এই browser-এ code চালানো যাচ্ছে না: \"+e.message});return;}\n timer=setTimeout(()=>{worker.terminate();worker=null;cb({err:\"৩ সেকেন্ডেও শেষ হয়নি — infinite loop আছে?\"});},3000);\n worker.onmessage=e=>{clearTimeout(timer);worker.terminate();worker=null;URL.revokeObjectURL(url);cb(e.data);};\n worker.onerror=e=>{e.preventDefault();clearTimeout(timer);worker.terminate();worker=null;cb({err:\"Syntax/Runtime error: \"+(e.message||\"code-এ ভুল আছে\")});};\n}\nfunction view(){\n const i=PROBS.findIndex(p=>p.id===cur),p=PROBS[i];LS.set(\"lc-cur\",cur);\n document.getElementById(\"main\").innerHTML=`\u003carticle class=\"card${solved[p.id]?\" done\":\"\"}\">\n \u003cdiv class=\"ptop\">\u003cdiv>\u003cdiv class=\"lcno\">LeetCode #${p.n} · ${bn(i+1)}/${bn(PROBS.length)}\u003c/div>\u003ch2 class=\"ptitle\">${p.t}\u003c/h2>\u003c/div>\n \u003cdiv class=\"meta\">\u003cspan class=\"badge\">Easy\u003c/span>\u003cspan class=\"badge star\">${p.g}\u003c/span>${solved[p.id]?'\u003cspan class=\"solved\">✓ Solved\u003c/span>':\"\"}\u003c/div>\u003c/div>\n \u003cp class=\"desc\">📌 ${esc(p.d)}\u003c/p>\n \u003cdiv class=\"exs\">${p.ex.map((e,k)=>`\u003cdiv>\u003cb>উদাহরণ ${bn(k+1)}:\u003c/b> ${esc(e[0])} → \u003cb>উত্তর:\u003c/b> ${esc(e[1])}\u003c/div>`).join(\"\")}\u003c/div>\n \u003clabel for=\"ed\" class=\"lcno\">✍️ তোমার solution (JavaScript) · function-এর নাম \u003ccode class=\"i\">${p.fn}\u003c/code> রাখো\u003c/label>\n \u003ctextarea id=\"ed\" class=\"editor\" spellcheck=\"false\" autocapitalize=\"off\" autocomplete=\"off\">${esc(codeOf(p))}\u003c/textarea>\n \u003cdiv class=\"tools\">\u003cbutton class=\"btn run\" id=\"runBtn\">▶ Run (${bn(p.tests.length)}টা test)\u003c/button>\u003cbutton class=\"btn\" id=\"hintBtn\">💡 Hint\u003c/button>\u003cbutton class=\"btn\" id=\"resetBtn\">↺ খালি করো\u003c/button>\u003cspan class=\"lcno\">Ctrl/⌘ + Enter = Run\u003c/span>\u003c/div>\n \u003cdiv id=\"hint\" hidden>\u003cdiv class=\"hintbox\">💡 ${esc(p.hint)}\u003c/div>\u003c/div>\n \u003cdiv class=\"res\" id=\"res\">\u003c/div>\n \u003cdetails class=\"reveal\">\u003csummary>🪨 কীভাবে ভাববে (caveman)\u003c/summary>\u003cul class=\"cave\" style=\"margin-top:8px\">${p.cave.map(x=>`\u003cli>${esc(x)}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/details>\n \u003cdetails class=\"reveal\" id=\"solD\">\u003csummary>✅ Solution দেখো\u003c/summary>\n  \u003cdiv class=\"tools\" style=\"margin:8px 0\">\u003cspan class=\"badge\">⏱ ${esc(p.tc)}\u003c/span>\u003cbutton class=\"btn\" id=\"useSol\">Editor-এ বসাও\u003c/button>\u003c/div>\n  \u003cpre>\u003ccode>${hl(p.sol)}\u003c/code>\u003c/pre>\n  \u003cdiv class=\"say\" style=\"margin-top:10px\">\u003cb>🎤 Interview-এ এভাবে বলো\u003c/b>\u003cp>${esc(p.say)}\u003c/p>\u003c/div>\u003c/details>\n \u003cdiv class=\"navp\">${i>0?`\u003cbutton class=\"btn\" data-open=\"${PROBS[i-1].id}\">← ${PROBS[i-1].t}\u003c/button>`:\"\u003cspan>\u003c/span>\"}${i\u003cPROBS.length-1?`\u003cbutton class=\"btn go\" data-open=\"${PROBS[i+1].id}\">${PROBS[i+1].t} →\u003c/button>`:\"\u003cspan>\u003c/span>\"}\u003c/div>\n \u003c/article>`;\n side();\n}\nfunction side(){const ql=q.toLowerCase();const n=Object.values(solved).filter(Boolean).length;let m=0;\n const groups=[...new Set(PROBS.map(p=>p.g))];\n document.getElementById(\"side\").innerHTML=`\u003cdiv class=\"sh\">\u003cspan>Solved · ${bn(n)}/${bn(PROBS.length)}\u003c/span>\u003cbutton id=\"sideClose\">✕\u003c/button>\u003c/div>\u003cinput class=\"search\" id=\"sq\" type=\"search\" placeholder=\"খোঁজো… (sum, tree)\" value=\"${esc(q)}\">`+\n groups.map(g=>{const rows=PROBS.map((p,i)=>[p,i]).filter(([p])=>p.g===g&&(!ql||p.t.toLowerCase().includes(ql)||String(p.n)===ql)).map(([p,i])=>`\u003ca href=\"#\" data-open=\"${p.id}\" class=\"${p.id===cur?\"on\":\"\"}\">\u003cspan class=\"sn2\">${p.n}\u003c/span>\u003cspan>${p.t}\u003c/span>${solved[p.id]?'\u003cspan class=\"ok\">✓\u003c/span>':\"\u003cspan>\u003c/span>\"}\u003c/a>`).join(\"\");return rows?`\u003cdiv class=\"grp\">${g}\u003c/div>`+rows:\"\"}).join(\"\");}\nfunction doRun(){const p=PROBS.find(x=>x.id===cur),code=document.getElementById(\"ed\").value;LS.set(\"lc-code-\"+p.id,code);\n const res=document.getElementById(\"res\");res.innerHTML='\u003cdiv class=\"lcno\">চলছে…\u003c/div>';\n runTests(p,code,d=>{if(d.err){res.innerHTML=`\u003cdiv class=\"r no\">⚠️ ${esc(d.err)}\u003c/div>`;return;}\n  const ok=d.res.filter(r=>r.ok).length,all=ok===d.res.length;\n  res.innerHTML=`\u003cdiv class=\"sum\">${all?\"🎉 সব test pass!\":\"❌ \"+bn(ok)+\"/\"+bn(d.res.length)+\" pass\"}\u003c/div>`+d.res.map((r,k)=>`\u003cdiv class=\"r ${r.ok?\"ok\":\"no\"}\">${r.ok?\"✓\":\"✗\"} Test ${bn(k+1)} · input ${esc(r.args)}\u003cbr>${r.err?\"error: \"+esc(r.err):\"পেয়েছ: \"+esc(r.got)} ${r.ok?\"\":\"· চাই: \"+esc(r.exp)}\u003c/div>`).join(\"\");\n  if(all&&!solved[p.id]){solved[p.id]=true;LS.set(\"lc-solved\",solved);const c=document.querySelector(\"#main .card\");c&&c.classList.add(\"done\");side();}\n });}\ndocument.addEventListener(\"click\",e=>{\n const o=e.target.closest(\"[data-open]\");if(o){e.preventDefault();const ed=document.getElementById(\"ed\");if(ed)LS.set(\"lc-code-\"+cur,ed.value);cur=o.dataset.open;view();document.getElementById(\"side\").classList.remove(\"open\");window.scrollTo({top:0,behavior:\"smooth\"});return;}\n if(e.target.id===\"runBtn\")return doRun();\n if(e.target.id===\"hintBtn\"){document.getElementById(\"hint\").hidden=false;return;}\n if(e.target.id===\"resetBtn\"){const p=PROBS.find(x=>x.id===cur);document.getElementById(\"ed\").value=starter(p);LS.set(\"lc-code-\"+p.id,starter(p));document.getElementById(\"res\").innerHTML=\"\";return;}\n if(e.target.id===\"useSol\"){const p=PROBS.find(x=>x.id===cur);document.getElementById(\"ed\").value=p.sol+\"\\n\";LS.set(\"lc-code-\"+p.id,p.sol+\"\\n\");return;}\n if(e.target.closest(\"#sideBtn\")){document.getElementById(\"side\").classList.add(\"open\");return;}\n if(e.target.closest(\"#sideClose\"))document.getElementById(\"side\").classList.remove(\"open\");\n});\ndocument.addEventListener(\"keydown\",e=>{const ed=e.target.id===\"ed\";\n if(ed&&e.key===\"Tab\"&&!e.shiftKey){e.preventDefault();const t=e.target,s=t.selectionStart;t.setRangeText(\"  \",s,t.selectionEnd,\"end\");}\n if(ed&&e.key===\"Enter\"&&(e.ctrlKey||e.metaKey)){e.preventDefault();doRun();}\n});\ndocument.addEventListener(\"input\",e=>{if(e.target.id===\"sq\"){q=e.target.value;const pos=e.target.selectionStart;side();const s=document.getElementById(\"sq\");s.focus();s.setSelectionRange(pos,pos);}\n if(e.target.id===\"ed\")LS.set(\"lc-code-\"+cur,e.target.value);});\nview();\n\u003c/script>\n\u003c/body>\u003c/html>", "lab": "\u003c!doctype html>\u003chtml lang=\"bn\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}\u003c/style>\u003c/head>\u003cbody>\u003ctitle>Hands-on Practice Lab\u003c/title>\n\u003cmeta name=\"claude:viewport-fit-sides\" content=\"cover\">\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap\">\n\u003cstyle>\n/* Layout: one column of topic cards grouped by Part; each card = trick → animation → caveman bullets → code */\n:root{\n  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202c; --muted:#5b6778; --line:#dde3ea;\n  --accent:#d9342b; --accent-soft:#fde8e6; --ok:#1f8a5b; --ok-soft:#e1f4eb; --chip:#eef1f6;\n  --blue:#2f6fdb; --amber:#d98a00; --codebg:#0f1720; --codefg:#e3e9f0;\n  --display:\"Anek Bangla\",\"Hind Siliguri\",\"Noto Sans Bengali\",system-ui,sans-serif;\n  --body:\"Hind Siliguri\",\"Noto Sans Bengali\",system-ui,sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,Menlo,monospace;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f141b; --surface:#171e28; --fg:#e7ecf2; --muted:#9aa6b6; --line:#273241;\n  --accent:#ff5a4f; --accent-soft:#3a1d1c; --ok:#4cc38a; --ok-soft:#163327; --chip:#1f2835;\n  --blue:#6a9cff; --amber:#f0b03a; --codebg:#0a0f15; --codefg:#e3e9f0; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0f141b; --surface:#171e28; --fg:#e7ecf2; --muted:#9aa6b6; --line:#273241;\n  --accent:#ff5a4f; --accent-soft:#3a1d1c; --ok:#4cc38a; --ok-soft:#163327; --chip:#1f2835;\n  --blue:#6a9cff; --amber:#f0b03a; --codebg:#0a0f15; --codefg:#e3e9f0; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}\n.wrap{max-width:1240px;margin:0 auto}\n.layout{display:grid;gap:24px;align-items:start}\n.card{scroll-margin-top:16px}\n#side{font-size:14px}\n#side .sh{font:700 15px var(--display);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}\n#side .sh button{display:none;font:600 13px var(--body);background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:2px 10px;cursor:pointer}\n#side .grp{font:600 11px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}\n#side a{display:grid;grid-template-columns:26px 1fr auto;gap:4px;align-items:baseline;padding:5px 8px;border-radius:6px;color:var(--fg);text-decoration:none;line-height:1.35}\n#side a:hover{background:var(--chip)}\n#side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}\n#side a .sn2{font:500 12px var(--mono);color:var(--muted)}\n#side a .ok{color:var(--ok);font-size:12px}\n#side a:focus-visible,#sideBtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n#sideBtn{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;font:700 14px var(--body);background:var(--fg);color:var(--bg);border:none;border-radius:999px;padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}\n@media (min-width:700px){.layout{grid-template-columns:clamp(220px,26vw,300px) minmax(0,1fr)}#side{order:-1;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px;margin-top:26px}#sideBtn{display:none}}\n@media (max-width:699px){#side{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);z-i
