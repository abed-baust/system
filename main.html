2{stroke:var(--ok);animation:nd 3s infinite}\n@keyframes nd{0%,20%{stroke-width:1.5}35%,100%{stroke-width:3.5}}\n.dg .nt{fill:var(--fg);font:600 13px var(--mono);text-anchor:middle}\n.dg .nt.hit{fill:var(--ok);font-weight:800}\n.legend .bk{all:unset;color:var(--accent);font-weight:700}\n.acidg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}\n.acidg div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:1px}\n.acidg b{font:800 22px var(--display);line-height:1}\n.acidg div:nth-child(1) b{color:var(--accent)}.acidg div:nth-child(2) b{color:var(--blue)}.acidg div:nth-child(3) b{color:var(--amber)}.acidg div:nth-child(4) b{color:var(--ok)}\n.acidg i{font:600 12px var(--mono);font-style:normal;color:var(--muted)}\n.acidg span{font-weight:600;font-size:14px}\n.acidg small{font-size:12px;color:var(--muted)}\n.seg b{position:absolute;inset:0;display:flex;align-items:center;padding-inline:6px;font:600 11px var(--body);color:#fff;white-space:nowrap;overflow:hidden}\n.lane .rail{height:24px}\n.elg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}\n.elg .col{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 6px;display:grid;gap:5px;align-content:start}\n.elg .col b{font:700 12.5px var(--body)}\n.elg .col small{font-size:11px;color:var(--muted)}\n.chip{font:600 12px var(--mono);color:#fff;border-radius:5px;padding:4px 6px}\n.c-b{background:var(--blue)}.c-a{background:var(--accent)}.c-y{background:var(--amber)}\n.outrow{display:flex;gap:6px;align-items:center;margin-top:10px;font:700 13px var(--body)}\n.outrow span{font:700 15px var(--mono);border:2px solid var(--fg);border-radius:6px;width:30px;text-align:center;animation:app 4s infinite both}\n@keyframes app{0%{opacity:.15}8%,88%{opacity:1}100%{opacity:.15}}\n.jleg{display:grid;gap:4px;margin-top:8px;font-size:13px}\n.jleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}\n.jleg i.h{background:var(--accent)}.jleg i.p{background:var(--ok)}.jleg i.s{background:var(--blue)}\n.bkw{display:grid;justify-items:center;gap:4px}\n.refill{font:600 11.5px var(--body);color:var(--muted)}\n.arch .down{font-size:11.5px}\n.say{background:var(--ok-soft);border-radius:8px;padding:9px 12px;font-size:15.5px}\n.say b{display:block;font:700 13px var(--display);color:var(--ok);margin-bottom:2px}\n.say p{margin:0}\n.cmp{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}\n.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}\n.cmp th{font:700 12.5px var(--body)}\n.cmp td:first-child{color:var(--muted);font-weight:600}\n.reel{background:#0b0b0e;border-radius:12px;padding:8px;display:grid;gap:8px}\n.reel canvas{width:100%;aspect-ratio:360/470;display:block;border-radius:8px}\n.reel-cap{color:#f2f2f2;font:600 15px var(--body);min-height:3.2em;padding-inline:6px;line-height:1.5}\n.reel-nav{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px 4px}\n.reel-nav button{font:600 13px var(--mono);background:#1c1c22;color:#ddd;border:1px solid #333;border-radius:6px;padding:4px 10px;cursor:pointer}\n.reel-nav button[aria-pressed=\"true\"]{background:#4fc3f7;color:#0b0b0e;border-color:#4fc3f7}\n.reel-nav .pp{margin-left:auto}\n.reel-nav button:focus-visible{outline:2px solid #ffd54f;outline-offset:2px}\n.say .ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--ok)}\n.say .ex b{display:block;font:700 13px var(--display);color:var(--amber);margin-bottom:2px}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important}}\nfooter{margin-top:32px;color:var(--muted);font-size:14px}\n\n.search{width:100%;font:500 14px var(--body);padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin-bottom:6px}\n.search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n\n.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.badge{font:600 12px var(--body);padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--fg)}\n.badge.star{background:var(--accent);color:#fff}\n.story{margin:0;font-size:15.5px;color:var(--fg);background:var(--chip);border-radius:8px;padding:9px 12px}\n.timer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}\n.timer .tm{font:700 22px var(--mono);font-variant-numeric:tabular-nums;min-width:86px}\n.timer .tm.over{color:var(--accent)}\n.timer small{color:var(--muted);font-size:13px}\n.btn{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:5px 12px;cursor:pointer}\n.btn.go{background:var(--ok);color:#fff;border-color:var(--ok)}\n.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.bar2{flex:1;min-width:120px;height:8px;background:var(--chip);border-radius:99px;overflow:hidden}\n.bar2 i{display:block;height:100%;background:var(--ok);transition:width .3s}\n.grid2{display:grid;gap:12px}\n@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}\n.box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}\n.box h4{margin:0 0 6px;font:700 14px var(--display)}\n.box ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14.5px}\n.steps label{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;padding:4px 0;font-size:14.5px;cursor:pointer}\n.steps input{width:17px;height:17px;margin-top:3px;accent-color:var(--ok)}\n.steps label.dn span{color:var(--muted);text-decoration:line-through}\n.box li,.steps span{overflow-wrap:anywhere}\ncode.i{overflow-wrap:anywhere;font:500 12.5px var(--mono);background:var(--chip);padding:1px 5px;border-radius:4px}\n.card>*{min-width:0}details{min-width:0}\ndetails summary{cursor:pointer;font:700 14px var(--display);padding:4px 0}\n.ask li{color:var(--fg)}\n\u003c/style>\n\u003cdiv class=\"wrap\">\n\u003cheader>\n  \u003ch1>\u003cspan class=\"play\">▶\u003c/span>Hands-on Practice Lab\u003c/h1>\n  \u003cp class=\"lede\">২য় round-এর জন্য বাস্তব কাজের practice। আগে laptop প্রস্তুত করো, তারপর starter, তারপর প্রতিটা কাজ timer চালিয়ে খালি folder থেকে বানাও। ধাপ শেষ হলে tick দাও। ⭐ = Asif vai-এর বলা Bloom filter।\u003c/p>\n\u003c/header>\n\u003cdiv class=\"layout\">\u003cmain id=\"list\">\u003c/main>\u003caside id=\"side\" aria-label=\"সব কাজ\">\u003c/aside>\u003c/div>\n\u003cbutton id=\"sideBtn\" aria-controls=\"side\">☰ সব কাজ\u003c/button>\n\u003cfooter>নিয়ম: আগে যা কাজ করে এমন ছোট version → তারপর validation, error, test। কাজের সময় মুখে বলো কী করছ আর কেন।\u003c/footer>\n\u003c/div>\n\u003cscript>\nconst TASKS=[\n{id:\"prep\",t:\"Laptop প্রস্তুতি\",min:30,lvl:\"আগে করো\",story:\"Interview-এ নিজের laptop নিয়ে যাবে। Internet ধীর হতে পারে, তাই আগে থেকেই সব যেন চলে।\",\n req:[\"Node 20 LTS (`node -v`)\",\"Git + GitHub login\",\"VS Code: ESLint, Prettier, Thunder Client/REST Client\",\"Docker Desktop চালু\",\"DB GUI: DBeaver বা TablePlus\",\"Postman\"],\n steps:[\"`docker pull postgres:16` আর `docker pull redis:7` আগে করে রাখো\",\"Starter project clone করে `npm install` করো (offline-এ যেন চলে)\",\"`docker compose up -d` দিয়ে DB আর Redis চালাও, connect test\",\"VS Code font 16–18, theme পরিষ্কার, বাড়তি extension বন্ধ\",\"Notification বন্ধ, বাড়তি browser tab বন্ধ\",\"Charger, mouse, HDMI/Type-C adapter, phone hotspot ব্যাগে\",\"একবার পুরো starter চালিয়ে /health-এ 200 দেখো\"],\n hints:[\"অফিসে গিয়ে npm install করতে হলে ১০ মিনিট নষ্ট হতে পারে\",\"Hotspot backup রাখো\"],\n code:`# docker-compose.yml\nservices:\n  db:    { image: postgres:16, ports: [\"5432:5432\"], environment: { POSTGRES_PASSWORD: pass, POSTGRES_DB: app } }\n  redis: { image: redis/redis-stack:latest, ports: [\"6379:6379\"] }   # Bloom filter-ও আছে`,\n ask:[\"আপনার local setup কেমন?\",\"Docker কেন ব্যবহার করলেন?\"]},\n\n{id:\"starter\",t:\"Starter Project (সব কাজের ভিত্তি)\",min:60,lvl:\"আগে করো\",story:\"প্রতিটা কাজ শূন্য থেকে না শুরু করে এই কাঠামো ব্যবহার করবে। একবার হাতে বানাও, তাহলে মাথায় বসে যাবে।\",\n req:[\"Express + TypeScript\",\"Prisma (Postgres)\",\"Zod validation\",\"JWT auth middleware\",\"Central error middleware\",\"`.env` + `.env.example`\",\"/health endpoint\"],\n steps:[\"`npm init -y` → express, zod, jsonwebtoken, bcrypt, @prisma/client, dotenv\",\"dev: typescript, tsx, @types/*, prisma\",\"Folder: routes → controllers → services → repositories\",\"AppError class + error middleware\",\"validate(schema) middleware\",\"auth middleware (Bearer JWT)\",\"`npm run dev` দিয়ে /health চালাও\"],\n hints:[\"Layer ভাগ করো, interviewer structure দেখে\",\"Error সবসময় একই JSON format-এ\"],\n code:`src/\n  app.ts            // express, json, routes, errorMw\n  routes/ tasks.ts\n  controllers/ tasks.ts\n  services/ tasks.ts\n  middlewares/ auth.ts validate.ts error.ts\n  lib/ prisma.ts errors.ts\n\n// errors.ts\nexport class AppError extends Error { constructor(public status: number, msg: string) { super(msg); } }\n\n// error.ts\nexport const errorMw = (err, req, res, next) => {\n  const status = err instanceof AppError ? err.status : 500;\n  res.status(status).json({ error: status === 500 ? 'Internal error' : err.message });\n};\n\n// validate.ts\nexport const validate = (schema) => (req, res, next) => {\n  const r = schema.safeParse(req.body);\n  if (!r.success) return res.status(400).json({ error: r.error.flatten() });\n  req.body = r.data; next();\n};\n\n// auth.ts\nexport const auth = (req, res, next) => {\n  const t = req.headers.authorization?.split(' ')[1];\n  try { req.user = jwt.verify(t, process.env.JWT_SECRET); next(); }\n  catch { res.status(401).json({ error: 'Unauthorized' }); }\n};`,\n ask:[\"এই layer গুলো কেন আলাদা?\",\"Error middleware কেন শেষে?\"]},\n\n{id:\"task\",t:\"১. Task Manager API\",min:60,lvl:\"সবচেয়ে বেশি আসে\",story:\"একটা team-এর to-do app-এর backend। প্রতিটা user শুধু নিজের task দেখবে আর বদলাবে।\",\n req:[\"POST /auth/register, POST /auth/login (bcrypt + JWT)\",\"POST /tasks, GET /tasks, GET/PATCH/DELETE /tasks/:id\",\"শুধু নিজের task (owner check)\",\"GET /tasks?status=done&page=1&limit=10 (total সহ)\",\"Zod validation, ঠিক status code\"],\n steps:[\"Prisma model: User, Task (userId FK, status, dueDate)\",\"Register: email unique (409), password hash\",\"Login: compare → JWT (15m)\",\"Task CRUD service\",\"প্রতিটা query-তে where: { id, userId } → না পেলে 404\",\"Pagination + filter\",\"Postman দিয়ে সব test\",\"README ৩ লাইন\"],\n bonus:[\"Jest + Supertest ২টা test\",\"Rate limit login-এ\",\"Soft delete (deletedAt)\"],\n hints:[\"অন্যের task-এ 403 না দিয়ে 404 দিলে id আছে কিনা ফাঁস হয় না\",\"findMany + count একসাথে Promise.all-এ\"],\n code:`const [items, total] = await Promise.all([\n  prisma.task.findMany({ where: { userId, status }, skip: (page - 1) * limit, take: limit, orderBy: { createdAt: 'desc' } }),\n  prisma.task.count({ where: { userId, status } }),\n]);\nres.json({ items, total, page, limit });`,\n ask:[\"অন্যের task যেন না দেখে, কীভাবে নিশ্চিত করলেন?\",\"১০ লাখ task হলে pagination কীভাবে?\",\"JWT কোথায় রাখবেন?\"]},\n\n{id:\"order\",t:\"২. Product + Order (stock transaction)\",min:60,lvl:\"বেশি আসে\",story:\"ছোট e-commerce। Sale-এ একই product শেষ ১টা দুইজন একসাথে কিনতে চাইছে, oversell হওয়া চলবে না।\",\n req:[\"Product CRUD (name, price, stock)\",\"POST /orders { items: [{productId, qty}] }\",\"Stock না থাকলে 409\",\"Order + stock কমানো এক transaction-এ\",\"Total server-এ হিসাব (client-এর দাম বিশ্বাস না)\"],\n steps:[\"Model: Product, Order, OrderItem\",\"prisma.$transaction শুরু\",\"প্রতিটা item: atomic update stock = stock - qty WHERE stock >= qty\",\"update count 0 হলে throw 409 (পুরো transaction rollback)\",\"Order + items তৈরি, total হিসাব\",\"দুই terminal থেকে একসাথে request দিয়ে oversell test\"],\n bonus:[\"Idempotency-Key header (double click-এ duplicate order না)\",\"Order status: PENDING → CONFIRMED\"],\n hints:[\"SELECT তারপর UPDATE করলে race হয়; এক UPDATE-এ শর্ত দাও\",\"Price DB থেকে নাও\"],\n code:`await prisma.$transaction(async (tx) => {\n  let total = 0;\n  for (const it of items) {\n    const r = await tx.product.updateMany({\n      where: { id: it.productId, stock: { gte: it.qty } },\n      data:  { stock: { decrement: it.qty } },\n    });\n    if (r.count === 0) throw new AppError(409, 'Out of stock');\n    const p = await tx.product.findUniqueOrThrow({ where: { id: it.productId } });\n    total += p.price * it.qty;\n  }\n  return tx.order.create({ data: { userId, total, items: { create: items } } });\n});`,\n ask:[\"দুইজন একসাথে শেষ item কিনলে কী হবে?\",\"Transaction ছাড়া করলে কী সমস্যা?\",\"Optimistic vs pessimistic lock?\"]},\n\n{id:\"url\",t:\"৩. URL Shortener\",min:40,lvl:\"মাঝারি\",story:\"Marketing team লম্বা link ছোট করে SMS-এ পাঠাবে, আর কতবার click হলো দেখবে।\",\n req:[\"POST /shorten { url } → { code, shortUrl }\",\"GET /:code → 302 redirect\",\"URL validate\",\"Click count\",\"Unknown code → 404\"],\n steps:[\"Model: Link (code unique, url, clicks)\",\"Base62 random ৭ অক্ষর\",\"Unique conflict হলে আবার চেষ্টা\",\"Redirect: আগে Redis, না পেলে DB, তারপর Redis-এ রাখো\",\"Click count বাড়াও (await না করে বা Redis INCR)\"],\n bonus:[\"Custom alias\",\"Expiry date\",\"GET /links/:code/stats\"],\n hints:[\"301 browser cache করে, তাই click গোনা যায় না → 302\",\"Click update redirect-কে ধীর করবে না\"],\n code:`const ALPHA = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';\nconst code = Array.from({ length: 7 }, () => ALPHA[Math.floor(Math.random() * 62)]).join('');\n\napp.get('/:code', async (req, res) => {\n  let url = await redis.get('u:' + req.params.code);\n  if (!url) {\n    const link = await prisma.link.findUnique({ where: { code: req.params.code } });\n    if (!link) return res.sendStatus(404);\n    url = link.url; await redis.set('u:' + req.params.code, url, 'EX', 3600);\n  }\n  redis.incr('clicks:' + req.params.code);   // await না\n  res.redirect(302, url);\n});`,\n ask:[\"৭ অক্ষরে কয়টা link হবে?\",\"Collision কীভাবে সামলালেন?\",\"১ কোটি click/দিন হলে?\"]},\n\n{id:\"upload\",t:\"৪. File Upload\",min:40,lvl:\"মাঝারি\",story:\"Product-এর ছবি upload। শুধু ছবি, সর্বোচ্চ 2MB, আর ভুল file যেন server-এ না জমে।\",\n req:[\"POST /products/:id/images (multipart)\",\"শুধু jpg/png/webp, max 2MB\",\"Unique filename\",\"GET দিয়ে list\",\"ভুল হলে 400 / 413\"],\n steps:[\"multer diskStorage বা memoryStorage\",\"limits: { fileSize: 2MB }\",\"fileFilter: mimetype check\",\"Filename: uuid + extension\",\"DB-তে path save\",\"multer error → error middleware-এ 400/413\"],\n bonus:[\"sharp দিয়ে thumbnail\",\"S3 pre-signed URL (বড় file-এর জন্য)\"],\n hints:[\"Client-এর দেওয়া filename ব্যবহার করবে না (path traversal)\",\"বড় file হলে বলো: pre-signed URL দিয়ে সরাসরি S3\"],\n code:`const upload = multer({\n  storage: multer.diskStorage({ destination: 'uploads/', filename: (req, f, cb) => cb(null, randomUUID() + path.extname(f.originalname)) }),\n  limits: { fileSize: 2 * 1024 * 1024 },\n  fileFilter: (req, f, cb) => cb(null, ['image/jpeg', 'image/png', 'image/webp'].includes(f.mimetype)),\n});\nrouter.post('/products/:id/images', auth, upload.single('image'), ctrl.addImage);`,\n ask:[\"2GB video হলে কী করতেন?\",\"mimetype কি নিরাপদ check?\"]},\n\n{id:\"otp\",t:\"৫. OTP + Rate Limiter\",min:30,lvl:\"মাঝারি\",story:\"Login-এ OTP যায়। Bot প্রতি সেকেন্ডে হাজার OTP চাইছে, SMS খরচ বাড়ছে।\",\n req:[\"POST /otp/send { phone }\",\"প্রতি phone মিনিটে ৩ বার\",\"Limit পার → 429 + Retry-After\",\"OTP Redis-এ ৫ মিনিট\",\"POST /otp/verify, ভুল ৫ বার হলে block\"],\n steps:[\"Key: rl:otp:{phone}, INCR\",\"প্রথমবার হলে EXPIRE 60\",\"> 3 → 429\",\"OTP ৬ অঙ্ক, Redis SET EX 300 (hash করে রাখলে আরও ভালো)\",\"Verify: মিললে delete, না মিললে attempts++\"],\n bonus:[\"IP-ভিত্তিক limit-ও\",\"Sliding window (ZSET)\"],\n hints:[\"INCR আর EXPIRE আলাদা হলে race; MULTI বা Lua দিয়ে একসাথে\",\"OTP log-এ লিখবে না\"],\n code:`const key = 'rl:otp:' + phone;\nconst [[, n]] = await redis.multi().incr(key).expire(key, 60, 'NX').exec();\nif (n > 3) return res.status(429).set('Retry-After', '60').json({ error: 'Too many requests' });\nconst otp = String(crypto.randomInt(100000, 999999));\nawait redis.set('otp:' + phone, otp, 'EX', 300);`,\n ask:[\"Server ৫টা হলে counter কোথায়?\",\"Fixed vs sliding window?\",\"Redis down হলে কী করবেন?\"]},\n\n{id:\"ext\",t:\"৬. Third-party API Wrapper\",min:30,lvl:\"মাঝারি\",story:\"Courier বা currency API মাঝে মাঝে ধীর বা down থাকে। আমাদের API যেন আটকে না যায়।\",\n req:[\"GET /rates/:currency → বাইরের API থেকে\",\"Timeout ৩ সেকেন্ড\",\"Retry ৩ বার (backoff)\",\"Redis-এ ১০ মিনিট cache\",\"বাইরের API down → শেষ cache বা 503\"],\n steps:[\"axios.create({ timeout: 3000 })\",\"Retry helper: 300ms, 600ms, 1200ms + jitter\",\"শুধু network error / 5xx-এ retry, 4xx-এ না\",\"Cache-aside\",\"Fallback: stale cache\"],\n bonus:[\"Circuit breaker (opossum)\",\"Promise.all দিয়ে একাধিক currency একসাথে\"],\n hints:[\"POST-এ retry দিলে duplicate হতে পারে, শুধু idempotent call-এ\"],\n code:`async function withRetry(fn, tries = 3) {\n  for (let i = 0; i \u003c tries; i++) {\n    try { return await fn(); }\n    catch (e) {\n      const status = e.response?.status;\n      if (i === tries - 1 || (status && status \u003c 500)) throw e;\n      await new Promise(r => setTimeout(r, 300 * 2 ** i + Math.random() * 100));\n    }\n  }\n}`,\n ask:[\"Retry-তে jitter কেন?\",\"বাইরের API পুরো দিন down থাকলে?\"]},\n\n{id:\"csv\",t:\"৭. CSV Bulk Import\",min:45,lvl:\"মাঝারি-কঠিন\",story:\"Merchant ৫০,০০০ product-এর CSV দিল। Server যেন memory-তে না মরে, আর ভুল row-এর report আসে।\",\n req:[\"POST /products/import (CSV file)\",\"Stream করে পড়ো (পুরো file memory-তে না)\",\"১০০০ করে bulk insert\",\"ভুল row আলাদা: { row, error }\",\"শেষে: { inserted, failed }\"],\n steps:[\"csv-parse stream বা fast-csv\",\"প্রতিটা row Zod দিয়ে validate\",\"ঠিক row batch array-তে\",\"batch.length === 1000 → createMany, তারপর খালি\",\"শেষে বাকিটা insert\",\"Duplicate SKU → skipDuplicates বা upsert\"],\n bonus:[\"Job queue-তে দিয়ে 202 + progress endpoint\"],\n hints:[\"for await (const row of parser) সবচেয়ে সহজ\",\"বড় file হলে request-এ না, background job-এ\"],\n code:`const parser = fs.createReadStream(file.path).pipe(parse({ columns: true }));\nlet batch = [], inserted = 0, rowNo = 1; const failed = [];\nfor await (const row of parser) {\n  rowNo++;\n  const r = ProductSchema.safeParse(row);\n  if (!r.success) { failed.push({ row: rowNo, error: r.error.issues[0].message }); continue; }\n  batch.push(r.data);\n  if (batch.length === 1000) { inserted += (await prisma.product.createMany({ data: batch, skipDuplicates: true })).count; batch = []; }\n}\nif (batch.length) inserted += (await prisma.product.createMany({ data: batch, skipDuplicates: true })).count;\nres.json({ inserted, failed });`,\n ask:[\"১০ লাখ row হলে?\",\"Memory কেন কম লাগল?\"]},\n\n{id:\"bug\",t:\"৮. Bug Fix / Slow API\",min:30,lvl:\"প্রায়ই আসে\",story:\"ওরা একটা চালু কিন্তু ধীর বা ভুল code দেবে। খুঁজে ঠিক করতে হবে আর কারণ বলতে হবে।\",\n req:[\"N+1 query ধরা\",\"await ভুলে যাওয়া / forEach-এ async\",\"Missing index\",\"Unhandled promise rejection\",\"Race condition (stock)\"],\n steps:[\"আগে চালিয়ে সমস্যা নিজে দেখো (reproduce)\",\"console.time বা log দিয়ে কোথায় সময় যাচ্ছে মাপো\",\"Prisma log: { log: ['query'] } দিয়ে query গোনো\",\"N+1 → include / IN\",\"forEach(async) → for...of বা Promise.all\",\"EXPLAIN দিয়ে index দরকার কিনা\",\"Fix করে আবার মাপো, আগে-পরে সংখ্যা বলো\"],\n hints:[\"মুখে বলো: 'আগে মাপছি, তারপর ঠিক করছি'\",\"একবারে একটা জিনিস বদলাও\"],\n code:`// ❌ N+1 + forEach async\norders.forEach(async o => { o.user = await prisma.user.findUnique({ where: { id: o.userId } }); });\n// ✅\nconst orders = await prisma.order.findMany({ include: { user: true } });\n\n// ❌ sequential\nconst a = await getA(); const b = await getB();\n// ✅ parallel\nconst [a2, b2] = await Promise.all([getA(), getB()]);`,\n ask:[\"কীভাবে বুঝলেন এটা N+1?\",\"আগে কত ms ছিল, এখন কত?\"]},\n\n{id:\"job\",t:\"৯. Background Job (Email Queue)\",min:40,lvl:\"মাঝারি\",story:\"Order হলে confirmation email যায়। SMTP ধীর বলে order API ৩ সেকেন্ড লাগছে।\",\n req:[\"Order তৈরির পর email job queue-তে (BullMQ)\",\"API সাথে সাথে 201\",\"Worker আলাদা process\",\"Fail → ৩ বার retry, exponential backoff\",\"একই order-এ duplicate email না\"],\n steps:[\"Queue('emails', { connection })\",\"queue.add('order-confirm', { orderId }, { jobId: 'order:' + orderId, attempts: 3, backoff })\",\"Worker: email পাঠাও (nodemailer বা console.log দিয়ে simulate)\",\"Worker-এ ইচ্ছা করে কখনো throw করে retry দেখো\",\"failed event log\"],\n bonus:[\"Bull Board dashboard\",\"Delayed job: ২৪ ঘণ্টা পরে review email\"],\n hints:[\"jobId দিলে একই job দুবার যোগ হয় না\",\"Worker আলাদা process, যাতে API-কে ধীর না করে\"],\n code:`const emailQ = new Queue('emails', { connection });\nawait emailQ.add('order-confirm', { orderId }, {\n  jobId: 'order:' + orderId, attempts: 3, backoff: { type: 'exponential', delay: 2000 },\n});\n\nnew Worker('emails', async (job) => {\n  const order = await prisma.order.findUniqueOrThrow({ where: { id: job.data.orderId }, include: { user: true } });\n  await sendMail(order.user.email, 'Order confirmed #' + order.id);\n}, { connection, concurrency: 5 });`,\n ask:[\"Worker crash করলে job হারাবে?\",\"Redis না থাকলে কী ব্যবহার করতেন?\"]},\n\n{id:\"search\",t:\"১০. Search + Filter + Pagination\",min:30,lvl:\"সহজ-মাঝারি\",story:\"Product list page: নাম দিয়ে খোঁজা, দামের সীমা, sort, আর অনেক page।\",\n req:[\"GET /products?q=&minPrice=&maxPrice=&sort=price_asc&page=&limit=\",\"Query param validate (Zod coerce)\",\"limit সর্বোচ্চ ১০০\",\"Response-এ total, page\",\"Cursor pagination (bonus)\"],\n steps:[\"Zod: z.coerce.number() দিয়ে query parse\",\"where object ধাপে ধাপে বানাও\",\"q → contains, mode: insensitive\",\"sort map: { price_asc: { price: 'asc' } }\",\"findMany + count Promise.all\",\"name + price-এ index\"],\n bonus:[\"Cursor: ?cursor=lastId (বড় data-য় দ্রুত)\",\"Redis cache জনপ্রিয় query-তে\"],\n hints:[\"sort-এর মান whitelist করো, সরাসরি user input না\",\"বড় OFFSET ধীর → cursor\"],\n code:`const Q = z.object({ q: z.string().optional(), minPrice: z.coerce.number().optional(),\n  maxPrice: z.coerce.number().optional(), sort: z.enum(['price_asc', 'price_desc', 'new']).default('new'),\n  page: z.coerce.number().min(1).default(1), limit: z.coerce.number().min(1).max(100).default(20) });\nconst SORT = { price_asc: { price: 'asc' }, price_desc: { price: 'desc' }, new: { createdAt: 'desc' } };\nconst where = { ...(q && { name: { contains: q, mode: 'insensitive' } }),\n  price: { gte: minPrice, lte: maxPrice } };`,\n ask:[\"Offset vs cursor pagination?\",\"১ কোটি product-এ search হলে?\"]},\n\n{id:\"bloom\",t:\"১১. Bloom Filter: Username Check (Asif vai)\",min:45,lvl:\"Asif vai-এর পরামর্শ\",star:1,story:\"Signup page-এ user টাইপ করার সময় username available কিনা দেখায়। প্রতিটা keystroke-এ DB query দিলে চাপ পড়ে। Bloom filter দিয়ে বেশিরভাগ request DB পর্যন্তই যাবে না।\",\n req:[\"GET /username/check?u=abed → { available }\",\"প্রথমে Bloom filter দেখো\",\"Filter 'নিশ্চিত নেই' বললে → available (DB-তে যায় না)\",\"Filter 'সম্ভবত আছে' বললে → DB দিয়ে নিশ্চিত\",\"Register হলে filter-এ add\",\"Server start-এ DB-র সব username দিয়ে filter বানাও\"],\n steps:[\"নিজে Bloom filter class লেখো: bit array (Uint8Array) + k hash\",\"Hash: একটা hash থেকে double hashing (h1 + i*h2)\",\"add(item), mightContain(item)\",\"Startup-এ DB থেকে username load করে add\",\"Check endpoint: filter → (দরকার হলে) DB\",\"কতবার DB-তে গেল আর কতবার false positive হলো, counter রাখো\",\"তারপর Redis Stack-এর BF.ADD / BF.EXISTS দিয়ে একই কাজ (একাধিক server-এ share হবে)\"],\n bonus:[\"m আর k হিসাব: n = 10 লাখ, p = 1% → m ≈ 9.6M bit (~1.2MB), k ≈ 7\",\"False positive rate মেপে দেখাও\",\"Delete লাগলে Cuckoo filter (CF.ADD / CF.DEL)\"],\n hints:[\"False negative কখনো হয় না, তাই 'নেই' উত্তর ১০০% নির্ভরযোগ্য\",\"'আছে' উত্তর নিশ্চিত না, তাই DB check বাধ্যতামূলক\",\"Filter memory-তে থাকলে প্রতি server-এর আলাদা copy → Redis-এ রাখলে সবাই share\"],\n code:`import { createHash } from 'node:crypto';\n\nexport class BloomFilter {\n  private bits: Uint8Array;\n  constructor(private m: number, private k: number) { this.bits = new Uint8Array(Math.ceil(m / 8)); }\n\n  private idx(item: string): number[] {\n    const h = createHash('sha256').update(item).digest();\n    const h1 = h.readUInt32BE(0), h2 = h.readUInt32BE(4);\n    return Array.from({ length: this.k }, (_, i) => (h1 + i * h2) % this.m);  // double hashing\n  }\n  add(item: string) { for (const i of this.idx(item)) this.bits[i >> 3] |= 1 \u003c\u003c (i & 7); }\n  mightContain(item: string) { return this.idx(item).every(i => this.bits[i >> 3] & (1 \u003c\u003c (i & 7))); }\n}\n\n// ব্যবহার\nconst bf = new BloomFilter(9_600_000, 7);\n(await prisma.user.findMany({ select: { username: true } })).forEach(u => bf.add(u.username.toLowerCase()));\n\napp.get('/username/check', async (req, res) => {\n  const u = String(req.query.u).toLowerCase();\n  if (!bf.mightContain(u)) return res.json({ available: true, source: 'bloom' });   // DB-তে যায়নি\n  const exists = await prisma.user.findUnique({ where: { username: u } });\n  res.json({ available: !exists, source: 'db' });\n});\n\n// Redis Stack সংস্করণ (সব server share করে)\n// await redis.call('BF.RESERVE', 'usernames', 0.01, 1000000);\n// await redis.call('BF.ADD', 'usernames', u);\n// const maybe = await redis.call('BF.EXISTS', 'usernames', u);   // 0 = নিশ্চিত নেই`,\n ask:[\"False positive হলে কী হয়? (DB check করি, তাই ভুল উত্তর যায় না)\",\"Username delete হলে filter থেকে মুছবেন কীভাবে?\",\"m আর k কীভাবে ঠিক করলেন?\",\"একাধিক server-এ filter sync কীভাবে?\",\"Cache penetration কী, Bloom filter কীভাবে আটকায়?\"]}\n];\n\nconst esc=s=>s.replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\");\nconst ic=s=>esc(s).replace(/`([^`]+)`/g,'\u003ccode class=\"i\">$1\u003c/code>');\nconst hl=s=>esc(s).split(\"\\n\").map(l=>l.replace(/(\\/\\/.*|#.*)$/,'\u003cspan class=\"cm\">$1\u003c/span>')).join(\"\\n\");\nconst bn=n=>String(n).replace(/\\d/g,d=>\"০১২৩৪৫৬৭৮৯\"[d]);\nconst KEY=\"hp-steps\";let st={};try{st=JSON.parse(localStorage.getItem(KEY)||\"{}\")}catch(e){}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};\nconst TM={};let tick=null;\nconst fmt=s=>String(Math.floor(s/60)).padStart(2,\"0\")+\":\"+String(s%60).padStart(2,\"0\");\nconst pct=t=>Math.round(100*t.steps.filter((_,i)=>st[t.id+\"-\"+i]).length/t.steps.length);\nfunction card(t){const p=pct(t);const tm=TM[t.id]||{s:0,run:false};\n return `\u003carticle class=\"card${p===100?\" done\":\"\"}\" id=\"q-${t.id}\">\n \u003cdiv class=\"top\">\u003ch3>${t.star?\"⭐ \":\"\"}${t.t}\u003c/h3>\u003cdiv class=\"meta\">\u003cspan class=\"badge${t.star?\" star\":\"\"}\">${t.lvl}\u003c/span>\u003cspan class=\"badge\">⏱ ${bn(t.min)} মিনিট\u003c/span>\u003c/div>\u003c/div>\n \u003cp class=\"story\">📌 ${ic(t.story)}\u003c/p>\n \u003cdiv class=\"timer\">\u003cspan class=\"tm${tm.s>t.min*60?\" over\":\"\"}\" id=\"tm-${t.id}\">${fmt(tm.s)}\u003c/span>\u003csmall>/ ${t.min}:00\u003c/small>\n  \u003cbutton class=\"btn${tm.run?\"\":\" go\"}\" data-tm=\"${t.id}\">${tm.run?\"❚❚ থামাও\":\"▶ শুরু\"}\u003c/button>\u003cbutton class=\"btn\" data-rs=\"${t.id}\">↺ Reset\u003c/button>\n  \u003cdiv class=\"bar2\" title=\"ধাপ শেষ\">\u003ci style=\"width:${p}%\">\u003c/i>\u003c/div>\u003csmall>${bn(p)}% শেষ\u003c/small>\u003c/div>\n \u003cdiv class=\"grid2\">\n  \u003cdiv class=\"box\">\u003ch4>✅ যা বানাতে হবে\u003c/h4>\u003cul>${t.req.map(x=>`\u003cli>${ic(x)}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>\n  \u003cdiv class=\"box steps\">\u003ch4>🪜 ধাপ (tick দাও)\u003c/h4>${t.steps.map((x,i)=>{const k=t.id+\"-\"+i,d=!!st[k];return `\u003clabel class=\"${d?\"dn\":\"\"}\">\u003cinput type=\"checkbox\" id=\"s-${k}\" data-s=\"${k}\" ${d?\"checked\":\"\"}>\u003cspan>${ic(x)}\u003c/span>\u003c/label>`}).join(\"\")}\u003c/div>\n \u003c/div>\n \u003cdiv class=\"grid2\">\n  ${t.bonus?`\u003cdiv class=\"box\">\u003ch4>🚀 Bonus (সময় থাকলে)\u003c/h4>\u003cul>${t.bonus.map(x=>`\u003cli>${ic(x)}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>`:\"\"}\n  \u003cdiv class=\"box\">\u003ch4>🪨 Hint\u003c/h4>\u003cul>${t.hints.map(x=>`\u003cli>${ic(x)}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>\n \u003c/div>\n \u003cdetails>\u003csummary>💻 মূল code দেখো (আগে নিজে চেষ্টা করো)\u003c/summary>\u003cpre>\u003ccode>${hl(t.code)}\u003c/code>\u003c/pre>\u003c/details>\n \u003cdiv class=\"box ask\">\u003ch4>🎤 Interviewer জিজ্ঞেস করতে পারে\u003c/h4>\u003cul>${t.ask.map(x=>`\u003cli>${ic(x)}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>\n \u003c/article>`;}\nfunction render(){document.getElementById(\"list\").innerHTML=`\u003csection class=\"part\">\u003cdiv class=\"cards\">${TASKS.map(card).join(\"\")}\u003c/div>\u003c/section>`;renderSide();}\nfunction renderSide(){const all=TASKS.reduce((a,t)=>a+t.steps.length,0),dn=Object.values(st).filter(Boolean).length;\n document.getElementById(\"side\").innerHTML=`\u003cdiv class=\"sh\">\u003cspan>সব কাজ · ${bn(Math.round(100*dn/all))}%\u003c/span>\u003cbutton id=\"sideClose\">✕\u003c/button>\u003c/div>`+\n TASKS.map((t,i)=>{const p=pct(t);return `\u003ca href=\"#q-${t.id}\" data-go=\"${t.id}\">\u003cspan class=\"sn2\">${t.star?\"⭐\":bn(i)}\u003c/span>\u003cspan>${t.t}\u003c/span>\u003cspan class=\"${p===100?\"ok\":\"sn2\"}\">${p===100?\"✓\":bn(p)+\"%\"}\u003c/span>\u003c/a>`}).join(\"\");}\nfunction upd(id){const t=TASKS.find(x=>x.id===id),el=document.getElementById(\"tm-\"+id);if(el){el.textContent=fmt(TM[id].s);el.classList.toggle(\"over\",TM[id].s>t.min*60);}}\ndocument.addEventListener(\"click\",e=>{\n const g=e.target.closest(\"#side a[data-go]\");if(g){e.preventDefault();document.getElementById(\"q-\"+g.dataset.go)?.scrollIntoView({behavior:\"smooth\",block:\"start\"});document.getElementById(\"side\").classList.remove(\"open\");return;}\n if(e.target.closest(\"#sideBtn\")){document.getElementById(\"side\").classList.add(\"open\");return;}\n if(e.target.closest(\"#sideClose\")){document.getElementById(\"side\").classList.remove(\"open\");return;}\n const b=e.target.closest(\"[data-tm]\");if(b){const id=b.dataset.tm;const tm=TM[id]=TM[id]||{s:0,run:false};\n   Object.entries(TM).forEach(([k,v])=>{if(k!==id)v.run=false;});tm.run=!tm.run;\n   clearInterval(tick);if(Object.values(TM).some(v=>v.run))tick=setInterval(()=>{Object.entries(TM).forEach(([k,v])=>{if(v.run){v.s++;upd(k);}});},1000);\n   render();return;}\n const r=e.target.closest(\"[data-rs]\");if(r){TM[r.dataset.rs]={s:0,run:false};render();}\n});\ndocument.addEventListener(\"change\",e=>{const k=e.target.dataset&&e.target.dataset.s;if(k){st[k]=e.target.checked;save();const y=window.scrollY;render();window.scrollTo(0,y);}});\nrender();\n\u003c/script>\n\u003c/body>\u003c/html>", "api": "\u003c!doctype html>\u003chtml lang=\"bn\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}\u003c/style>\u003c/head>\u003cbody>\u003ctitle>Node API Step by Step\u003c/title>\n\u003cmeta name=\"claude:viewport-fit-sides\" content=\"cover\">\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap\">\n\u003cstyle>\n/* Layout: one column of topic cards grouped by Part; each card = trick → animation → caveman bullets → code */\n:root{\n  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202c; --muted:#5b6778; --line:#dde3ea;\n  --accent:#d9342b; --accent-soft:#fde8e6; --ok:#1f8a5b; --ok-soft:#e1f4eb; --chip:#eef1f6;\n  --blue:#2f6fdb; --amber:#d98a00; --codebg:#0f1720; --codefg:#e3e9f0;\n  --display:\"Anek Bangla\",\"Hind Siliguri\",\"Noto Sans Bengali\",system-ui,sans-serif;\n  --body:\"Hind Siliguri\",\"Noto Sans Bengali\",system-ui,sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,Menlo,monospace;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f141b; --surface:#171e28; --fg:#e7ecf2; --muted:#9aa6b6; --line:#273241;\n  --accent:#ff5a4f; --accent-soft:#3a1d1c; --ok:#4cc38a; --ok-soft:#163327; --chip:#1f2835;\n  --blue:#6a9cff; --amber:#f0b03a; --codebg:#0a0f15; --codefg:#e3e9f0; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0f141b; --surface:#171e28; --fg:#e7ecf2; --muted:#9aa6b6; --line:#273241;\n  --accent:#ff5a4f; --accent-soft:#3a1d1c; --ok:#4cc38a; --ok-soft:#163327; --chip:#1f2835;\n  --blue:#6a9cff; --amber:#f0b03a; --codebg:#0a0f15; --codefg:#e3e9f0; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}\n.wrap{max-width:1240px;margin:0 auto}\n.layout{display:grid;gap:24px;align-items:start}\n.card{scroll-margin-top:16px}\n#side{font-size:14px}\n#side .sh{font:700 15px var(--display);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}\n#side .sh button{display:none;font:600 13px var(--body);background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:2px 10px;cursor:pointer}\n#side .grp{font:600 11px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}\n#side a{display:grid;grid-template-columns:26px 1fr auto;gap:4px;align-items:baseline;padding:5px 8px;border-radius:6px;color:var(--fg);text-decoration:none;line-height:1.35}\n#side a:hover{background:var(--chip)}\n#side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}\n#side a .sn2{font:500 12px var(--mono);color:var(--muted)}\n#side a .ok{color:var(--ok);font-size:12px}\n#side a:focus-visible,#sideBtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n#sideBtn{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;font:700 14px var(--body);background:var(--fg);color:var(--bg);border:none;border-radius:999px;padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}\n@media (min-width:700px){.layout{grid-template-columns:clamp(220px,26vw,300px) minmax(0,1fr)}#side{order:-1;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px;margin-top:26px}#sideBtn{display:none}}\n@media (max-width:699px){#side{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);z-index:30;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .25s}#side.open{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.3)}#side .sh button{display:inline-block}}\nheader{padding-block:28px 14px}\nh1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,42px);line-height:1.15;margin:0 0 6px;text-wrap:balance}\nh1 .play{display:inline-grid;place-items:center;width:1.05em;height:.75em;border-radius:.2em;background:var(--accent);color:#fff;font-size:.8em;vertical-align:.05em;margin-right:.25em}\n.lede{color:var(--muted);margin:0;max-width:62ch}\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;backgrou
