owrap}\n.kind.up{background:var(--amber)}\n.fn{margin:0;padding:6px 14px 0 30px;font-size:14px;color:var(--muted)}\n.file pre{border-radius:0;margin:0}\n.file details{padding:0}\n.file details summary{padding:6px 12px;font:600 13px var(--body);color:var(--muted)}\n.sn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font:700 14px var(--mono);margin-right:8px;flex:none}\n.card.done .sn{background:var(--ok)}\n.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}\n\u003c/style>\n\u003cdiv class=\"wrap\">\n\u003cheader>\n  \u003ch1>\u003cspan class=\"play\">▶\u003c/span>Node API Step by Step\u003c/h1>\n  \u003cp class=\"lede\">খালি folder থেকে পুরো API, ১৬টা ধাপে। প্রতিটা ধাপে: কী করবে, কেন, কোন command, কোন file (নতুন না আপডেট), পুরো code, আর চালিয়ে কী output দেখবে। প্রতিটা ধাপ আমি নিজে চালিয়ে যাচাই করেছি, শেষে ১১টা test pass।\u003c/p>\n\u003c/header>\n\u003cdiv class=\"layout\">\u003cmain id=\"list\">\u003c/main>\u003caside id=\"side\" aria-label=\"সব ধাপ\">\u003c/aside>\u003c/div>\n\u003cbutton id=\"sideBtn\" aria-controls=\"side\">☰ সব ধাপ\u003c/button>\n\u003cfooter>Stack: Node.js 20+ · Express 5 · TypeScript · PostgreSQL (pg) · Redis (ioredis) · Zod · JWT · bcryptjs · Vitest + Supertest\u003c/footer>\n\u003c/div>\n\u003cscript>\nconst S=[{\"id\": \"s1\", \"t\": \"Project folder আর package install\", \"g\": \"একটা খালি folder থেকে Node project শুরু, সব library install।\", \"w\": [\"Express 5: async handler-এ error নিজে থেকেই error middleware-এ যায়\", \"zod = validation, jsonwebtoken = JWT, bcryptjs = password hash\", \"pg = Postgres, ioredis = Redis, dotenv = .env পড়া\", \"tsx = TypeScript সরাসরি চালানো (dev), vitest + supertest = test\"], \"cmd\": \"mkdir practice-api && cd practice-api\\nnpm init -y\\nnpm i express@5.1.0 zod@3.23.8 jsonwebtoken@9.0.2 bcryptjs@2.4.3 pg@8.13.1 ioredis@5.4.1 dotenv@16.4.5\\nnpm i -D typescript@5.6.3 tsx@4.19.2 @types/node@22.9.0 @types/express@5.0.0 @types/jsonwebtoken@9.0.7 @types/bcryptjs@2.4.6 @types/pg@8.11.10 vitest@2.1.5 supertest@7.0.0 @types/supertest@6.0.2\", \"f\": [], \"run\": \"ls\", \"exp\": \"node_modules  package-lock.json  package.json\", \"say\": \"আমি exact version pin করি যাতে সবার মেশিনে একই রকম চলে, আর runtime আর dev dependency আলাদা রাখি।\"}, {\"id\": \"s2\", \"t\": \"Script আর TypeScript config\", \"g\": \"কোন command-এ কী চলবে, আর TypeScript কীভাবে compile হবে।\", \"w\": [\"`dev`: file বদলালে নিজে restart\", \"`strict: true`: null/undefined-এর ভুল compile-এর সময়েই ধরা পড়ে\"], \"cmd\": \"\", \"f\": [{\"p\": \"package.json\", \"k\": \"আপডেট\", \"n\": [\"শুধু \\\"scripts\\\" অংশটা এটা দিয়ে বদলে দাও, বাকিটা যেমন আছে থাকুক\"], \"c\": \"  \\\"scripts\\\": {\\n    \\\"dev\\\": \\\"tsx watch src/server.ts\\\",\\n    \\\"build\\\": \\\"tsc\\\",\\n    \\\"start\\\": \\\"node dist/server.js\\\",\\n    \\\"db:migrate\\\": \\\"tsx scripts/migrate.ts\\\",\\n    \\\"test\\\": \\\"vitest run\\\"\\n  },\"}, {\"p\": \"tsconfig.json\", \"k\": \"নতুন\", \"n\": [\"src থেকে dist-এ build\", \"commonjs, ES2022\"], \"c\": \"{\\n  \\\"compilerOptions\\\": {\\n    \\\"target\\\": \\\"ES2022\\\",\\n    \\\"module\\\": \\\"commonjs\\\",\\n    \\\"rootDir\\\": \\\"src\\\",\\n    \\\"outDir\\\": \\\"dist\\\",\\n    \\\"strict\\\": true,\\n    \\\"esModuleInterop\\\": true,\\n    \\\"skipLibCheck\\\": true\\n  },\\n  \\\"include\\\": [\\\"src\\\"]\\n}\\n\"}], \"run\": \"npx tsc --version\", \"exp\": \"Version 5.6.3\", \"say\": \"Dev-এ tsx দিয়ে সরাসরি চালাই, production-এ tsc দিয়ে build করে node দিয়ে চালাই।\"}, {\"id\": \"s3\", \"t\": \"Postgres + Redis চালু (Docker), .env\", \"g\": \"DB আর Redis এক command-এ, আর config .env-এ।\", \"w\": [\"Secret কখনো code বা git-এ না\", \"`.env.example` git-এ যায়, আসল `.env` যায় না\"], \"cmd\": \"cp .env.example .env\\ndocker compose up -d\", \"f\": [{\"p\": \"docker-compose.yml\", \"k\": \"নতুন\", \"n\": [\"Postgres 16 (5432), Redis 7 (6379)\"], \"c\": \"# DB আর Redis এক command-এ চালাও: docker compose up -d\\nservices:\\n  db:\\n    image: postgres:16\\n    ports: [\\\"5432:5432\\\"]\\n    environment:\\n      POSTGRES_PASSWORD: pass\\n      POSTGRES_DB: app\\n  redis:\\n    image: redis:7\\n    ports: [\\\"6379:6379\\\"]\\n\"}, {\"p\": \".env.example\", \"k\": \"নতুন\", \"n\": [\"এটা কপি করে .env বানাবে\"], \"c\": \"# এই file কপি করে .env বানাও (cp .env.example .env)। আসল .env কখনো git-এ দেবে না।\\nPORT=3000\\nDATABASE_URL=postgresql://postgres:pass@localhost:5432/app\\nREDIS_URL=redis://localhost:6379\\nJWT_SECRET=change-me-to-a-long-random-string\\nJWT_EXPIRES_IN=15m\\n\"}, {\"p\": \".gitignore\", \"k\": \"নতুন\", \"n\": [\"node_modules, dist, .env git-এ যাবে না\"], \"c\": \"node_modules\\ndist\\n.env\\n\"}], \"run\": \"docker ps\", \"exp\": \"...postgres:16 ... Up ...\\n...redis:7 ... Up ...\", \"say\": \"Local-এ DB আর Redis Docker-এ চালাই, তাই সবার setup একই, আর config env variable দিয়ে দিই।\"}, {\"id\": \"s4\", \"t\": \"Config যাচাই (env.ts)\", \"g\": \".env পড়ে Zod দিয়ে যাচাই। কিছু missing থাকলে app শুরুতেই থামবে।\", \"w\": [\"Fail fast: production-এ গিয়ে হঠাৎ crash-এর চেয়ে শুরুতেই error ভালো\", \"PORT string থেকে number (coerce)\"], \"cmd\": \"\", \"f\": [{\"p\": \"src/config/env.ts\", \"k\": \"নতুন\", \"n\": [\"import 'dotenv/config' → .env লোড\", \"EnvSchema.parse ভুল হলে throw\"], \"c\": \"// .env পড়ে Zod দিয়ে যাচাই করে। কিছু missing থাকলে app শুরুতেই থেমে যাবে,\\n// production-এ গিয়ে হঠাৎ crash করার চেয়ে এটা ভালো।\\nimport 'dotenv/config';\\nimport { z } from 'zod';\\n\\nconst EnvSchema = z.object({\\n  PORT: z.coerce.number().default(3000),\\n  DATABASE_URL: z.string().url(),\\n  REDIS_URL: z.string().default('redis://localhost:6379'),\\n  JWT_SECRET: z.string().min(10),\\n  JWT_EXPIRES_IN: z.string().default('15m'),\\n});\\n\\nexport const env = EnvSchema.parse(process.env);\\n\"}], \"run\": \"\", \"exp\": \"(এখনো চালানোর কিছু নেই, পরের ধাপে দেখবে)\", \"say\": \"Config Zod দিয়ে যাচাই করি, ভুল থাকলে app চালুই হয় না।\"}, {\"id\": \"s5\", \"t\": \"প্রথম server চালাও\", \"g\": \"/health endpoint দিয়ে প্রথম API।\", \"w\": [\"app.ts আর server.ts আলাদা: test-এ app import করা যায়, listen ছাড়াই\"], \"cmd\": \"npm run dev\", \"f\": [{\"p\": \"src/app.ts\", \"k\": \"নতুন (প্রথম সংস্করণ)\", \"n\": [\"express.json body পড়ে\", \"/health → { ok: true }\"], \"c\": \"// Express app: এখানে middleware আর route জোড়া লাগাই।\\n// listen এখানে না (server.ts-এ), যাতে পরে test-এ app সরাসরি import করা যায়।\\nimport express from 'express';\\n\\nexport const app = express();\\n\\napp.use(express.json({ limit: '100kb' })); // body-র JSON পড়া; বিশাল body আটকানো\\n\\napp.get('/health', (_req, res) => {\\n  res.json({ ok: true }); // load balancer / k8s এটা দেখে বোঝে app বেঁচে আছে\\n});\\n\"}, {\"p\": \"src/server.ts\", \"k\": \"নতুন (প্রথম সংস্করণ)\", \"n\": [\"শুধু listen\"], \"c\": \"// App চালু করা (পরে এখানে Bloom filter আর graceful shutdown যোগ হবে)\\nimport { app } from './app';\\nimport { env } from './config/env';\\n\\napp.listen(env.PORT, () => console.log(`API on http://localhost:${env.PORT}`));\\n\"}], \"run\": \"curl localhost:3000/health\", \"exp\": \"{\\\"ok\\\":true}\", \"say\": \"Health endpoint রাখি, load balancer আর Kubernetes এটা দেখে বোঝে instance ঠিক আছে কিনা।\"}, {\"id\": \"s6\", \"t\": \"Database table আর connection\", \"g\": \"Table বানাও, আর query আর transaction-এর helper।\", \"w\": [\"UNIQUE, CHECK constraint: ভুল data DB নিজেই আটকায়\", \"price INT পয়সায়, float না\", \"Index (user_id, created_at DESC)\", \"Pool: connection বারবার খোলা না\", \"সবসময় $1, $2 placeholder → SQL injection বন্ধ\", \"withTransaction: error হলে নিজে ROLLBACK\"], \"cmd\": \"npm run db:migrate\", \"f\": [{\"p\": \"db/schema.sql\", \"k\": \"নতুন\", \"n\": [\"users, tasks, products, orders, order_items\"], \"c\": \"-- Database-এর table গুলো। `npm run db:migrate` চালালে এটা চলে।\\n-- IF NOT EXISTS: বারবার চালালেও সমস্যা নেই।\\n\\nCREATE TABLE IF NOT EXISTS users (\\n  id         SERIAL PRIMARY KEY,\\n  email      TEXT NOT NULL UNIQUE,            -- একই email দুবার না\\n  username   TEXT NOT NULL UNIQUE,            -- Bloom filter এটা নিয়ে কাজ করে\\n  password   TEXT NOT NULL,                   -- plain না, bcrypt hash\\n  created_at TIMESTAMPTZ NOT NULL DEFAULT now()\\n);\\n\\nCREATE TABLE IF NOT EXISTS tasks (\\n  id         SERIAL PRIMARY KEY,\\n  user_id    INT NOT NULL REFERENCES users(id) ON DELETE CASCADE,\\n  title      TEXT NOT NULL,\\n  status     TEXT NOT NULL DEFAULT 'TODO' CHECK (status IN ('TODO','DOING','DONE')),\\n  created_at TIMESTAMPTZ NOT NULL DEFAULT now()\\n);\\n-- \\\"আমার task, নতুনগুলো আগে\\\" query-র জন্য composite index (user_id আগে)\\nCREATE INDEX IF NOT EXISTS idx_tasks_user_created ON tasks (user_id, created_at DESC);\\n\\nCREATE TABLE IF NOT EXISTS products (\\n  id    SERIAL PRIMARY KEY,\\n  name  TEXT NOT NULL,\\n  price INT  NOT NULL CHECK (price > 0),       -- পয়সায় রাখি (int); float-এ রাউন্ডিং ভুল হয়\\n  stock INT  NOT NULL CHECK (stock >= 0)       -- DB নিজেও stock মাইনাস হতে দেবে না\\n);\\n\\nCREATE TABLE IF NOT EXISTS orders (\\n  id         SERIAL PRIMARY KEY,\\n  user_id    INT NOT NULL REFERENCES users(id),\\n  total      INT NOT NULL,\\n  created_at TIMESTAMPTZ NOT NULL DEFAULT now()\\n);\\n\\nCREATE TABLE IF NOT EXISTS order_items (\\n  id         SERIAL PRIMARY KEY,\\n  order_id   INT NOT NULL REFERENCES orders(id) ON DELETE CASCADE,\\n  product_id INT NOT NULL REFERENCES products(id),\\n  qty        INT NOT NULL CHECK (qty > 0),\\n  price      INT NOT NULL                      -- কেনার সময়ের দাম; পরে দাম বদলালেও order ঠিক থাকে\\n);\\n\"}, {\"p\": \"src/lib/db.ts\", \"k\": \"নতুন\", \"n\": [\"pool, query(), withTransaction()\"], \"c\": \"// PostgreSQL connection pool + দুটো helper।\\n// Pool: প্রতি request-এ নতুন connection না খুলে কয়েকটা খোলা connection বারবার ব্যবহার।\\nimport { Pool, type PoolClient, type QueryResultRow } from 'pg';\\nimport { env } from '../config/env';\\n\\nexport const pool = new Pool({ connectionString: env.DATABASE_URL, max: 10 });\\n\\n// সাধারণ query: সবসময় $1, $2 placeholder — string জোড়া দিলে SQL injection হয়\\nexport async function query\u003cT extends QueryResultRow = any>(sql: string, params: unknown[] = []) {\\n  const r = await pool.query\u003cT>(sql, params);\\n  return r.rows;\\n}\\n\\n// Transaction helper: BEGIN → কাজ → COMMIT; মাঝে error হলে ROLLBACK।\\n// একই client (connection) ব্যবহার করতে হয়, কারণ transaction একটা connection-এর মধ্যেই চলে।\\nexport async function withTransaction\u003cT>(fn: (tx: PoolClient) => Promise\u003cT>): Promise\u003cT> {\\n  const client = await pool.connect();\\n  try {\\n    await client.query('BEGIN');\\n    const result = await fn(client);\\n    await client.query('COMMIT');\\n    return result;\\n  } catch (e) {\\n    await client.query('ROLLBACK');\\n    throw e;\\n  } finally {\\n    client.release(); // connection pool-এ ফেরত\\n  }\\n}\\n\"}, {\"p\": \"scripts/migrate.ts\", \"k\": \"নতুন\", \"n\": [\"schema.sql পড়ে চালায়\"], \"c\": \"// db/schema.sql পড়ে database-এ চালায়।\\nimport { readFileSync } from 'node:fs';\\nimport { join } from 'node:path';\\nimport { pool } from '../src/lib/db';\\n\\n(async () => {\\n  await pool.query(readFileSync(join(__dirname, '../db/schema.sql'), 'utf8'));\\n  console.log('Migration done ✓');\\n  await pool.end();\\n})();\\n\"}], \"run\": \"docker compose exec db psql -U postgres -d app -c '\\\\dt'\", \"exp\": \"users | tasks | products | orders | order_items  (৫টা table)\", \"say\": \"Pool দিয়ে connection reuse করি, সব query parameterized, আর transaction-এর জন্য helper যেটা error হলে rollback করে।\"}, {\"id\": \"s7\", \"t\": \"Error handling\", \"g\": \"সব error এক জায়গায়, একই JSON format-এ।\", \"w\": [\"AppError: service থেকে throw new AppError(404, '...')\", \"৪ argument = error middleware, থাকে সবার শেষে\", \"Postgres 23505 (unique ভাঙা) → 409\", \"500-এ ভেতরের তথ্য user-কে দেখাই না\"], \"cmd\": \"\", \"f\": [{\"p\": \"src/lib/errors.ts\", \"k\": \"নতুন\", \"n\": [], \"c\": \"// নিজের error class। Service থেকে throw new AppError(404, '...') দিলে\\n// error middleware বুঝবে কোন status code দিতে হবে।\\nexport class AppError extends Error {\\n  constructor(public status: number, message: string) {\\n    super(message);\\n  }\\n}\\n\"}, {\"p\": \"src/middlewares/error.ts\", \"k\": \"নতুন\", \"n\": [\"notFound + errorHandler\"], \"c\": \"// সব error এখানে এসে পৌঁছায়। একই JSON format-এ উত্তর দেয়।\\n// Express 5-এ async handler-এ throw করলে নিজে থেকেই এখানে আসে (try/catch লাগে না)।\\nimport type { ErrorRequestHandler, RequestHandler } from 'express';\\nimport { AppError } from '../lib/errors';\\n\\nexport const notFound: RequestHandler = (req, res) => {\\n  res.status(404).json({ error: `Route not found: ${req.method} ${req.path}` });\\n};\\n\\n// ৪টা argument থাকলেই Express এটাকে error middleware হিসেবে চেনে, আর এটা থাকে সবার শেষে।\\nexport const errorHandler: ErrorRequestHandler = (err, req, res, _next) => {\\n  if (err instanceof AppError) {\\n    res.status(err.status).json({ error: err.message });\\n    return;\\n  }\\n  // Postgres-এর unique constraint ভাঙলে (code 23505, যেমন একই email) → 409 Conflict\\n  if (err?.code === '23505') {\\n    res.status(409).json({ error: `Already exists: ${err.constraint ?? 'duplicate'}` });\\n    return;\\n  }\\n  console.error(err); // আসল error শুধু log-এ; user-কে ভেতরের তথ্য দেখাই না\\n  res.status(500).json({ error: 'Internal server error' });\\n};\\n\"}, {\"p\": \"src/app.ts\", \"k\": \"আপডেট\", \"n\": [\"উপরে import, একদম শেষে notFound আর errorHandler\"], \"c\": \"// Express app: এখানে middleware আর route জোড়া লাগাই।\\n// listen এখানে না (server.ts-এ), যাতে পরে test-এ app সরাসরি import করা যায়।\\nimport express from 'express';\\nimport { errorHandler, notFound } from './middlewares/error';\\n\\nexport const app = express();\\n\\napp.use(express.json({ limit: '100kb' })); // body-র JSON পড়া; বিশাল body আটকানো\\n\\napp.get('/health', (_req, res) => {\\n  res.json({ ok: true }); // load balancer / k8s এটা দেখে বোঝে app বেঁচে আছে\\n});\\n\\napp.use(notFound);     // কোনো route না মিললে 404\\napp.use(errorHandler); // সবার শেষে\\n\"}], \"run\": \"curl localhost:3000/nothing\", \"exp\": \"{\\\"error\\\":\\\"Route not found: GET /nothing\\\"}\", \"say\": \"Central error handler রাখি, তাই প্রতিটা route-এ try/catch লাগে না আর সব error একই format-এ যায়।\"}, {\"id\": \"s8\", \"t\": \"Validation middleware\", \"g\": \"Zod দিয়ে body আর query যাচাই, ভুল হলে 400।\", \"w\": [\"Controller-এ শুধু পরিষ্কার data আসে\", \"Express 5-এ req.query বদলানো যায় না → res.locals.query\"], \"cmd\": \"\", \"f\": [{\"p\": \"src/middlewares/validate.ts\", \"k\": \"নতুন\", \"n\": [\"validateBody, validateQuery\"], \"c\": \"// Request-এর body বা query Zod schema দিয়ে যাচাই করে।\\n// ভুল হলে 400, ঠিক হলে পরিষ্কার করা data handler-এ যায়।\\nimport type { RequestHandler } from 'express';\\nimport type { ZodSchema } from 'zod';\\n\\nexport const validateBody =\\n  (schema: ZodSchema): RequestHandler =>\\n  (req, res, next) => {\\n    const r = schema.safeParse(req.body);\\n    if (!r.success) {\\n      res.status(400).json({ error: 'Validation failed', details: r.error.flatten().fieldErrors });\\n      return;\\n    }\\n    req.body = r.data; // অপ্রয়োজনীয় field বাদ, type ঠিক\\n    next();\\n  };\\n\\n// Express 5-এ req.query বদলানো যায় না, তাই যাচাই করা query res.locals.query-তে রাখি\\nexport const validateQuery =\\n  (schema: ZodSchema): RequestHandler =>\\n  (req, res, next) => {\\n    const r = schema.safeParse(req.query);\\n    if (!r.success) {\\n      res.status(400).json({ error: 'Invalid query', details: r.error.flatten().fieldErrors });\\n      return;\\n    }\\n    res.locals.query = r.data;\\n    next();\\n  };\\n\"}], \"run\": \"\", \"exp\": \"(পরের ধাপে register-এ ব্যবহার হবে)\", \"say\": \"Validation আলাদা middleware-এ রাখি, তাই একই নিয়ম সব route-এ একইভাবে চলে।\"}, {\"id\": \"s9\", \"t\": \"Auth: register আর login\", \"g\": \"bcrypt দিয়ে password hash, JWT token।\", \"w\": [\"Module pattern: schema → service → controller → routes\", \"Service-এ req/res নেই → আলাদা test করা সহজ\", \"Login-এ email ভুল আর password ভুল হলে একই উত্তর\", \"JWT-তে শুধু sub = userId, মেয়াদ 15m\"], \"cmd\": \"\", \"f\": [{\"p\": \"src/modules/auth/auth.schema.ts\", \"k\": \"নতুন\", \"n\": [], \"c\": \"// Register আর login-এর input কেমন হবে তার নিয়ম।\\nimport { z } from 'zod';\\n\\nexport const RegisterSchema = z.object({\\n  email: z.string().email().toLowerCase(),\\n  username: z.string().trim().toLowerCase().regex(/^[a-z0-9_]{3,30}$/, 'a-z, 0-9, _ ; 3-30 অক্ষর'),\\n  password: z.string().min(8),\\n});\\n\\nexport const LoginSchema = z.object({\\n  email: z.string().email().toLowerCase(),\\n  password: z.string().min(1),\\n});\\n\\nexport type RegisterInput = z.infer\u003ctypeof RegisterSchema>;\\nexport type LoginInput = z.infer\u003ctypeof LoginSchema>;\\n\"}, {\"p\": \"src/modules/auth/auth.service.ts\", \"k\": \"নতুন (Bloom ছাড়া)\", \"n\": [\"Bloom-এর লাইন পরে ধাপ ১৪-এ যোগ হবে\"], \"c\": \"// Business logic: password hash, user তৈরি, login যাচাই, JWT বানানো।\\n// HTTP (req/res) এখানে নেই, তাই আলাদা করে test করা সহজ।\\nimport bcrypt from 'bcryptjs';\\nimport jwt from 'jsonwebtoken';\\nimport { query } from '../../lib/db';\\nimport { env } from '../../config/env';\\nimport { AppError } from '../../lib/errors';\\nimport type { LoginInput, RegisterInput } from './auth.schema';\\n\\nconst signToken = (userId: number) =>\\n  jwt.sign({}, env.JWT_SECRET, {\\n    subject: String(userId),\\n    expiresIn: env.JWT_EXPIRES_IN as jwt.SignOptions['expiresIn'],\\n  });\\n\\nexport async function register(input: RegisterInput) {\\n  const hash = await bcrypt.hash(input.password, 12); // cost 12: ইচ্ছা করে ধীর, brute force কঠিন\\n  // email বা username আগে থাকলে UNIQUE ভাঙবে → code 23505 → error middleware 409 দেবে\\n  const [user] = await query\u003c{ id: number; email: string; username: string }>(\\n    'INSERT INTO users (email, username, password) VALUES ($1, $2, $3) RETURNING id, email, username',\\n    [input.email, input.username, hash],\\n  );\\n  return { user, token: signToken(user.id) };\\n}\\n\\nexport async function login(input: LoginInput) {\\n  const [user] = await query\u003c{ id: number; password: string }>(\\n    'SELECT id, password FROM users WHERE email = $1',\\n    [input.email],\\n  );\\n  // email ভুল আর password ভুল — দুটোতেই একই উত্তর, যাতে কোন email আছে সেটা ফাঁস না হয়\\n  if (!user || !(await bcrypt.compare(input.password, user.password))) {\\n    throw new AppError(401, 'Invalid email or password');\\n  }\\n  return { token: signToken(user.id) };\\n}\\n\"}, {\"p\": \"src/modules/auth/auth.controller.ts\", \"k\": \"নতুন\", \"n\": [\"register → 201\"], \"c\": \"// Controller: HTTP-র কাজ। req থেকে data নেয়, service ডাকে, ঠিক status code দিয়ে উত্তর দেয়।\\nimport type { Request, Response } from 'express';\\nimport * as authService from './auth.service';\\n\\nexport async function register(req: Request, res: Response) {\\n  const result = await authService.register(req.body);\\n  res.status(201).json(result); // 201 Created\\n}\\n\\nexport async function login(req: Request, res: Response) {\\n  res.json(await authService.login(req.body));\\n}\\n\"}, {\"p\": \"src/modules/auth/auth.routes.ts\", \"k\": \"নতুন (rate limit ছাড়া)\", \"n\": [\"rate limit ধাপ ১৩-এ\"], \"c\": \"// URL → middleware → controller জোড়া লাগানো।\\nimport { Router } from 'express';\\nimport { validateBody } from '../../middlewares/validate';\\nimport { LoginSchema, RegisterSchema } from './auth.schema';\\nimport * as ctrl from './auth.controller';\\n\\nexport const authRouter = Router();\\n\\nauthRouter.post('/register', validateBody(RegisterSchema), ctrl.register);\\nauthRouter.post('/login', validateBody(LoginSchema), ctrl.login);\\n\"}, {\"p\": \"src/app.ts\", \"k\": \"আপডেট\", \"n\": [\"/auth route যোগ\"], \"c\": \"// Express app: এখানে middleware আর route জোড়া লাগাই।\\n// listen এখানে না (server.ts-এ), যাতে পরে test-এ app সরাসরি import করা যায়।\\nimport express from 'express';\\nimport { authRouter } from './modules/auth/auth.routes';\\nimport { errorHandler, notFound } from './middlewares/error';\\n\\nexport const app = express();\\n\\napp.use(express.json({ limit: '100kb' })); // body-র JSON পড়া; বিশাল body আটকানো\\n\\napp.get('/health', (_req, res) => {\\n  res.json({ ok: true }); // load balancer / k8s এটা দেখে বোঝে app বেঁচে আছে\\n});\\n\\napp.use('/auth', authRouter);\\n\\napp.use(notFound);     // কোনো route না মিললে 404\\napp.use(errorHandler); // সবার শেষে\\n\"}], \"run\": \"curl -X POST localhost:3000/auth/register -H 'Content-Type: application/json' -d '{\\\"email\\\":\\\"a@x.com\\\",\\\"username\\\":\\\"abed\\\",\\\"password\\\":\\\"secret123\\\"}'\\n# আবার একই command → 409\\ncurl -X POST localhost:3000/auth/login -H 'Content-Type: application/json' -d '{\\\"email\\\":\\\"a@x.com\\\",\\\"password\\\":\\\"secret123\\\"}'\", \"exp\": \"{\\\"user\\\":{\\\"id\\\":1,...},\\\"token\\\":\\\"eyJ...\\\"}\\n{\\\"error\\\":\\\"Already exists: users_email_key\\\"}\\n{\\\"token\\\":\\\"eyJ...\\\"}\", \"say\": \"Password bcrypt দিয়ে hash করি, login-এ JWT দিই, আর ভুল credential-এ একই বার্তা দিই যাতে কোন email আছে বোঝা না যায়।\"}, {\"id\": \"s10\", \"t\": \"Auth middleware\", \"g\": \"Bearer token যাচাই করে req.user বসানো।\", \"w\": [\"Token নেই বা ভুল বা মেয়াদ শেষ → 401\", \"declare global দিয়ে req.user-এর type\"], \"cmd\": \"\", \"f\": [{\"p\": \"src/middlewares/auth.ts\", \"k\": \"নতুন\", \"n\": [], \"c\": \"// \\\"Authorization: Bearer \u003ctoken>\\\" header থেকে JWT যাচাই করে।\\n// ঠিক থাকলে req.user-এ user id বসায়, না থাকলে 401।\\nimport type { RequestHandler } from 'express';\\nimport jwt from 'jsonwebtoken';\\nimport { env } from '../config/env';\\n\\ndeclare global {\\n  namespace Express {\\n    interface Request {\\n      user?: { id: number };\\n    }\\n  }\\n}\\n\\nexport const auth: RequestHandler = (req, res, next) => {\\n  const token = req.headers.authorization?.split(' ')[1];\\n  if (!token) {\\n    res.status(401).json({ error: 'Missing token' });\\n    return;\\n  }\\n  try {\\n    const payload = jwt.verify(token, env.JWT_SECRET) as unknown as { sub: string };\\n    req.user = { id: Number(payload.sub) };\\n    next();\\n  } catch {\\n    res.status(401).json({ error: 'Invalid or expired token' }); // signature ভুল বা মেয়াদ শেষ\\n  }\\n};\\n\"}], \"run\": \"\", \"exp\": \"(পরের ধাপে /tasks-এ ব্যবহার হবে)\", \"say\": \"Auth middleware token verify করে user id বসায়, তারপর service সেই id দিয়ে owner check করে।\"}, {\"id\": \"s11\", \"t\": \"Tasks: CRUD + owner check + pagination\", \"g\": \"প্রত্যেকে শুধু নিজের task দেখবে আর বদলাবে।\", \"w\": [\"প্রতিটা query-তে user_id → IDOR বন্ধ\", \"অন্যের task-এ 403 না, 404\", \"list: data + count Promise.all-এ\", \"limit সর্বোচ্চ ১০০\", \"Router-লেভেলে auth\"], \"cmd\": \"\", \"f\": [{\"p\": \"src/modules/tasks/tasks.schema.ts\", \"k\": \"নতুন\", \"n\": [], \"c\": \"import { z } from 'zod';\\n\\nexport const CreateTaskSchema = z.object({ title: z.string().trim().min(1).max(200) });\\n\\nexport const UpdateTaskSchema = z\\n  .object({\\n    title: z.string().trim().min(1).max(200).optional(),\\n    status: z.enum(['TODO', 'DOING', 'DONE']).optional(),\\n  })\\n  .refine((d) => Object.keys(d).length > 0, 'অন্তত একটা field দাও');\\n\\n// ?status=DONE&page=1&limit=10 — query সবসময় string আসে, coerce করে number বানাই\\nexport const ListTasksQuery = z.object({\\n  status: z.enum(['TODO', 'DOING', 'DONE']).optional(),\\n  page: z.coerce.number().int().min(1).default(1),\\n  limit: z.coerce.number().int().min(1).max(100).default(10), // max 100, কেউ যেন limit=100000 না দেয়\\n});\\n\\nexport type ListTasksInput = z.infer\u003ctypeof ListTasksQuery>;\\n\"}, {\"p\": \"src/modules/tasks/tasks.service.ts\", \"k\": \"নতুন\", \"n\": [], \"c\": \"// Task-এর business logic।\\n// সবচেয়ে জরুরি নিয়ম: প্রতিটা query-তে user_id থাকবে, যাতে কেউ অন্যের task না দেখে বা বদলায় (IDOR আটকানো)।\\nimport { query } from '../../lib/db';\\nimport { AppError } from '../../lib/errors';\\nimport type { ListTasksInput } from './tasks.schema';\\n\\ntype Task = { id: number; user_id: number; title: string; status: string; created_at: string };\\n\\nexport async function create(userId: number, title: string) {\\n  const [task] = await query\u003cTask>(\\n    'INSERT INTO tasks (user_id, title) VALUES ($1, $2) RETURNING *',\\n    [userId, title],\\n  );\\n  return task;\\n}\\n\\nexport async function list(userId: number, q: ListTasksInput) {\\n  // status দিলে তবেই filter: ($2::text IS NULL OR status = $2)\\n  const where = 'WHERE user_id = $1 AND ($2::text IS NULL OR status = $2)';\\n  const params = [userId, q.status ?? null];\\n  // data আর মোট সংখ্যা একসাথে (parallel)\\n  const [items, [{ count }]] = await Promise.all([\\n    query\u003cTask>(`SELECT * FROM tasks ${where} ORDER BY created_at DESC, id DESC LIMIT $3 OFFSET $4`, [\\n      ...params,\\n      q.limit,\\n      (q.page - 1) * q.limit,\\n    ]),\\n    query\u003c{ count: string }>(`SELECT count(*) FROM tasks ${where}`, params),\\n  ]);\\n  const total = Number(count);\\n  return { items, total, page: q.page, limit: q.limit, pages: Math.ceil(total / q.limit) };\\n}\\n\\n// অন্যের task হলে 403 না দিয়ে 404 দিই, যাতে ওই id আদৌ আছে কিনা বোঝা না যায়\\nexport async function get(userId: number, id: number) {\\n  const [task] = await query\u003cTask>('SELECT * FROM tasks WHERE id = $1 AND user_id = $2', [id, userId]);\\n  if (!task) throw new AppError(404, 'Task not found');\\n  return task;\\n}\\n\\nexport async function update(userId: number, id: number, data: { title?: string; status?: string }) {\\n  // COALESCE: যে field পাঠানো হয়নি, সেটা আগের মানেই থাকবে\\n  const [task] = await query\u003cTask>(\\n    `UPDATE tasks SET title = COALESCE($3, title), status = COALESCE($4, status)\\n     WHERE id = $1 AND user_id = $2 RETURNING *`,\\n    [id, userId, data.title ?? null, data.status ?? null],\\n  );\\n  if (!task) throw new AppError(404, 'Task not found');\\n  return task;\\n}\\n\\nexport async function remove(userId: number, id: number) {\\n  const rows = await query('DELETE FROM tasks WHERE id = $1 AND user_id = $2 RETURNING id', [id, userId]);\\n  if (!rows.length) throw new AppError(404, 'Task not found');\\n}\\n\"}, {\"p\": \"src/modules/tasks/tasks.controller.ts\", \"k\": \"নতুন\", \"n\": [], \"c\": \"import type { Request, Response } from 'express';\\nimport * as svc from './tasks.service';\\nimport { AppError } from '../../lib/errors';\\n\\n// URL-এর :id সংখ্যা কিনা যাচাই\\nconst idParam = (req: Request) => {\\n  const id = Number(req.params.id);\\n  if (!Number.isInteger(id) || id \u003c 1) throw new AppError(400, 'Invalid id');\\n  return id;\\n};\\n\\nexport async function create(req: Request, res: Response) {\\n  res.status(201).json(await svc.create(req.user!.id, req.body.title));\\n}\\nexport async function list(req: Request, res: Response) {\\n  res.json(await svc.list(req.user!.id, res.locals.query));\\n}\\nexport async function get(req: Request, res: Response) {\\n  res.json(await svc.get(req.user!.id, idParam(req)));\\n}\\nexport async function update(req: Request, res: Response) {\\n  res.json(await svc.update(req.user!.id, idParam(req), req.body));\\n}\\nexport async function remove(req: Request, res: Response) {\\n  await svc.remove(req.user!.id, idParam(req));\\n  res.status(204).end(); // 204 No Content\\n}\\n\"}, {\"p\": \"src/modules/tasks/tasks.routes.ts\", \"k\": \"নতুন\", \"n\": [], \"c\": \"// সব task route-এ আগে auth লাগবে (router.use(auth))।\\nimport { Router } from 'express';\\nimport { auth } from '../../middlewares/auth';\\nimport { validateBody, validateQuery } from '../../middlewares/validate';\\nimport { CreateTaskSchema, ListTasksQuery, UpdateTaskSchema } from './tasks.schema';\\nimport * as ctrl from './tasks.controller';\\n\\nexport const tasksRouter = Router();\\ntasksRouter.use(auth);\\n\\ntasksRouter.post('/', validateBody(CreateTaskSchema), ctrl.create);\\ntasksRouter.get('/', validateQuery(ListTasksQuery), ctrl.list);\\ntasksRouter.get('/:id', ctrl.get);\\ntasksRouter.patch('/:id', validateBody(UpdateTaskSchema), ctrl.update);\\ntasksRouter.delete('/:id', ctrl.remove);\\n\"}, {\"p\": \"src/app.ts\", \"k\": \"আপডেট\", \"n\": [\"/tasks route যোগ\"], \"c\": \"// Express app: এখানে middleware আর route জোড়া লাগাই।\\n// listen এখানে না (server.ts-এ), যাতে পরে test-এ app সরাসরি import করা যায়।\\nimport express from 'express';\\nimport { authRouter } from './modules/auth/auth.routes';\\nimport { tasksRouter } from './modules/tasks/tasks.routes';\\nimport { errorHandler, notFound } from './middlewares/error';\\n\\nexport const app = express();\\n\\napp.use(express.json({ limit: '100kb' })); // body-র JSON পড়া; বিশাল body আটকানো\\n\\napp.get('/health', (_req, res) => {\\n  res.json({ ok: true }); // load balancer / k8s এটা দেখে বোঝে app বেঁচে আছে\\n});\\n\\napp.use('/auth', authRouter);\\napp.use('/tasks', tasksRouter);\\n\\napp.use(notFound);     // কোনো route না মিললে 404\\napp.use(errorHandler); // সবার শেষে\\n\"}], \"run\": \"TOKEN=... # login-এর token\\ncurl -X POST localhost:3000/tasks -H \\\"Authorization: Bearer $TOKEN\\\" -H 'Content-Type: application/json' -d '{\\\"title\\\":\\\"Practice\\\"}'\\ncurl \\\"localhost:3000/tasks?page=1&limit=5\\\" -H \\\"Authorization: Bearer $TOKEN\\\"\\n# অন্য user-এর token দিয়ে GET /tasks/1 → 404\", \"exp\": \"{\\\"id\\\":1,\\\"title\\\":\\\"Practice\\\",\\\"status\\\":\\\"TODO\\\",...}\\n{\\\"items\\\":[...],\\\"total\\\":1,\\\"page\\\":1,\\\"limit\\\":5,\\\"pages\\\":1}\", \"say\": \"প্রতিটা query user_id দিয়ে filter করি, অন্যের id দিলে 404 পায়। এভাবে IDOR আটকাই।\"}, {\"id\": \"s12\", \"t\": \"Order: transaction দিয়ে oversell আটকানো\", \"g\": \"শেষ ১টা item দুইজন একসাথে কিনলে একজনই পাবে।\", \"w\": [\"সব withTransaction-এর ভেতরে\", \"UPDATE ... WHERE stock >= qty → atomic\", \"০ row → 409 → ROLLBACK (আগের item-ও ফেরত)\", \"দাম DB থেকে (RETURNING), client থেকে না\"], \"cmd\": \"\", \"f\": [{\"p\": \"src/modules/shop/shop.schema.ts\", \"k\": \"নতুন\", \"n\": [], \"c\": \"import { z } from 'zod';\\n\\nexport const CreateProductSchema = z.object({\\n  name: z.string().trim().min(1),\\n  price: z.number().int().positive(), // পয়সায়: ১২০০ টাকা = 120000\\n  stock: z.number().int().min(0),\\n});\\n\\nexport const CreateOrderSchema = z.object({\\n  items: z\\n    .array(z.object({ productId: z.number().int().positive(), qty: z.number().int().min(1).max(50) }))\\n    .min(1),\\n});\\n\\nexport type CreateOrderInput = z.infer\u003ctypeof CreateOrderSchema>;\\n\"}, {\"p\": \"src/modules/shop/shop.service.ts\", \"k\": \"নতুন\", \"n\": [\"মূল logic এখানে\"], \"c\": \"// Order তৈরি: interview-এর সবচেয়ে গুরুত্বপূর্ণ অংশ।\\n// সমস্যা: শেষ ১টা item দুইজন একসাথে কিনলে oversell হতে পারে।\\n// সমাধান: পুরোটা এক transaction-এ, আর stock কমানো একটাই atomic UPDATE-এ শর্তসহ:\\n//   UPDATE products SET stock = stock - qty WHERE id = $1 AND stock >= qty\\n// দুইজন একসাথে এলে DB row lock করে: প্রথমজন কমায়, দ্বিতীয়জন অপেক্ষা করে,\\n// তারপর শর্ত আর মেলে না → 0 row → 409। কখনো stock মাইনাস হয় না।\\nimport { query, withTransaction } from '../../lib/db';\\nimport { AppError } from '../../lib/errors';\\nimport type { CreateOrderInput } from './shop.schema';\\n\\nexport async function createProduct(data: { name: string; price: number; stock: number }) {\\n  const [p] = await query('INSERT INTO products (name, price, stock) VALUES ($1, $2, $3) RETURNING *', [\\n    data.name,\\n    data.price,\\n    data.stock,\\n  ]);\\n  return p;\\n}\\n\\nexport function listProducts() {\\n  return query('SELECT * FROM products ORDER BY id');\\n}\\n\\nexport async function createOrder(userId: number, input: CreateOrderInput) {\\n  return withTransaction(async (tx) => {\\n    let total = 0;\\n    const lines: { productId: number; qty: number; price: number }[] = [];\\n\\n    for (const it of input.items) {\\n      // atomic: শর্ত মিললে তবেই কমবে, আর একই সাথে দামও ফেরত পাই (RETURNING)\\n      const r = await tx.query\u003c{ price: number }>(\\n        'UPDATE products SET stock = stock - $2 WHERE id = $1 AND stock >= $2 RETURNING price',\\n        [it.productId, it.qty],\\n      );\\n      if (r.rowCount === 0) {\\n        // throw করলে withTransaction ROLLBACK করে: আগের item-এর stock-ও ফেরত যায়\\n        throw new AppError(409, `Product ${it.productId} out of stock`);\\n      }\\n      const price = r.rows[0].price; // দাম DB থেকে, client যা পাঠায় তা বিশ্বাস করি না\\n      total += price * it.qty;\\n      lines.push({ productId: it.productId, qty: it.qty, price });\\n    }\\n\\n    const order = (\\n      await tx.query\u003c{ id: number }>('INSERT INTO orders (user_id, total) VALUES ($1, $2) RETURNING *', [userId, total])\\n    ).rows[0];\\n    for (const l of lines) {\\n      await tx.query('INSERT INTO order_items (order_id, product_id, qty, price) VALUES ($1, $2, $3, $4)', [\\n        order.id,\\n        l.productId,\\n        l.qty,\\n        l.price,\\n      ]);\\n    }\\n    return { ...order, items: lines };\\n  });\\n}\\n\"}, {\"p\": \"src/modules/shop/shop.routes.ts\", \"k\": \"নতুন\", \"n\": [], \"c\": \"import { Router } from 'express';\\nimport { auth } from '../../middlewares/auth';\\nimport { validateBody } from '../../middlewares/validate';\\nimport { CreateOrderSchema, CreateProductSchema } from './shop.schema';\\nimport * as svc from './shop.service';\\n\\nexport const shopRouter = Router();\\n\\nshopRouter.get('/products', async (_req, res) => {\\n  res.json(await svc.listProducts());\\n});\\n\\n// বাস্তবে এটা শুধু admin পারবে (role check); practice-এর জন্য শুধু login লাগছে\\nshopRouter.post('/products', auth, validateBody(CreateProductSchema), async (req, res) => {\\n  res.status(201).json(await svc.createProduct(req.body));\\n});\\n\\nshopRouter.post('/orders', auth, validateBody(CreateOrderSchema), async (req, res) => {\\n  res.status(201).json(await svc.createOrder(req.user!.id, req.body));\\n});\\n\"}, {\"p\": \"src/app.ts\", \"k\": \"আপডেট\", \"n\": [\"shop route যোগ\"], \"c\": \"// Express app: এখানে middleware আর route জোড়া লাগাই।\\n// listen এখানে না (server.ts-এ), যাতে পরে test-এ app সরাসরি import করা যায়।\\nimport express from 'express';\\nimport { authRouter } from './modules/auth/auth.routes';\\nimport { tasksRouter } from './modules/tasks/tasks.routes';\\nimport { shopRouter } from './modules/shop/shop.routes';\\nimport { errorHandler, notFound } from './middlewares/error';\\n\\nexport const app = express();\\n\\napp.use(express.json({ limit: '100kb' })); // body-র JSON পড়া; বিশাল body আটকানো\\n\\napp.get('/health', (_req, res) => {\\n  res.json({ ok: true }); // load balancer / k8s এটা দেখে বোঝে app বেঁচে আছে\\n});\\n\\napp.use('/auth', authRouter);\\napp.use('/tasks', tasksRouter);\\napp.use('/', shopRouter);\\n\\napp.use(notFound);     // কোনো route না মিললে 404\\napp.use(errorHandler); // সবার শেষে\\n\"}], \"run\": \"curl -X POST localhost:3000/products -H \\\"Authorization: Bearer $TOKEN\\\" -H 'Content-Type: application/json' -d '{\\\"name\\\":\\\"Phone\\\",\\\"price\\\":2000000,\\\"stock\\\":1}'\\n# দুইটা order একসাথে (& দিয়ে parallel)\\nfor i in 1 2; do curl -s -X POST localhost:3000/orders -H \\\"Authorization: Bearer $TOKEN\\\" -H 'Content-Type: application/json' -d '{\\\"items\\\":[{\\\"productId\\\":1,\\\"qty\\\":1}]}' & done; wait\", \"exp\": \"{\\\"id\\\":1,\\\"total\\\":2000000,...}\\n{\\\"error\\\":\\\"Product 1 out of stock\\\"}\", \"say\": \"Stock কমানো একটা atomic UPDATE-এ শর্তসহ, পুরো order এক transaction-এ। দুইজন একসাথে এলে DB row lock করে, একজন পায়, অন্যজন 409।\"}, {\"id\": \"s13\", \"t\": \"Redis + Rate limit\", \"g\": \"Login-এ IP অনুযায়ী মিনিটে ৫ বার।\", \"w\": [\"MULTI দিয়ে INCR + EXPIRE একসাথে\", \"Counter Redis-এ → একাধিক server-এও কাজ করে\", \"429 + Retry-After\"], \"cmd\": \"\", \"f\": [{\"p\": \"src/lib/redis.ts\", \"k\": \"নতুন\", \"n\": [], \"c\": \"// পুরো app-এ একটাই Redis connection। Rate limit আর Bloom filter এটা ব্যবহার করে।\\nimport Redis from 'ioredis';\\nimport { env } from '../config/env';\\n\\nexport const redis = new Redis(env.REDIS_URL, { maxRetriesPerRequest: 2 });\\n\"}, {\"p\": \"src/middlewares/rateLimit.ts\", \"k\": \"নতুন\", \"n\": [], \"c\": \"// Redis দিয়ে fixed-window rate limiter।\\n// প্রতি key (যেমন IP) এক window-এ সর্বোচ্চ `max` বার। বেশি হলে 429।\\n// Counter Redis-এ, তাই একাধিক server থাকলেও সবাই একই হিসাব দেখে।\\nimport type { RequestHandler } from 'express';\\nimport { redis } from '../lib/redis';\\n\\nexport const rateLimit =\\n  (name: string, max: number, windowSec: number): RequestHandler =>\\n  async (req, res, next) => {\\n    const key = `rl:${name}:${req.ip}`;\\n    // INCR আর EXPIRE এক সাথে (MULTI) — আলাদা দিলে মাঝখানে crash হলে key চিরকাল থেকে যেত\\n    const results = await redis.multi().incr(key).expire(key, windowSec, 'NX').exec();\\n    const count = results![0][1] as number;\\n\\n    res.setHeader('X-RateLimit-Limit', max);\\n    res.setHeader('X-RateLimit-Remaining', Math.max(0, max - count));\\n    if (count > max) {\\n      res.setHeader('Retry-After', windowSec);\\n      res.status(429).json({ error: 'Too many requests, try again later' });\\n      return;\\n    }\\n    next();\\n  };\\n\"}, {\"p\": \"src/modules/auth/auth.routes.ts\", \"k\": \"আপডেট\", \"n\": [\"/login-এ rateLimit যোগ\"], \"c\": \"// URL → middleware → controller জোড়া লাগানো।\\n// Login-এ rate limit: প্রতি IP মিনিটে ৫ বার, যাতে কেউ password অনুমান করে করে চেষ্টা না করে।\\nimport { Router } from 'express';\\nimport { validateBody } from '../../middlewares/validate';\\nimport { rateLimit } from '../../middlewares/rateLimit';\\nimport { LoginSchema, RegisterSchema } from './auth.schema';\\nimport * as ctrl from './auth.controller';\\n\\nexport const authRouter = Router();\\n\\nauthRouter.post('/register', validateBody(RegisterSchema), ctrl.register);\\nauthRouter.post('/login', rateLimit('login', 5, 60), validateBody(LoginSchema), ctrl.login);\\n\"}], \"run\": \"for i in 1 2 3 4 5 6 7; do curl -s -o /dev/null -w \\\"%{http_code} \\\" -X POST localhost:3000/auth/login -H 'Content-Type: application/json' -d '{\\\"email\\\":\\\"a@x.com\\\",\\\"password\\\":\\\"wrong\\\"}'; done\", \"exp\": \"401 401 401 401 401 429 429\", \"say\": \"Login-এ Redis-ভিত্তিক rate limit দিই, তাই brute force আটকায় আর সব server একই counter দেখে।\"}, {\"id\": \"s14\", \"t\": \"⭐ Bloom filter (Asif vai)\", \"g\": \"Username available কিনা, বেশিরভাগ সময় DB-তে না গিয়েই।\", \"w\": [\"Bit গুলো Redis bitmap-এ (SETBIT/GETBIT) → সব server share\", \"size(n, p) দিয়ে m আর k\", \"Double hashing: h1 + i·h2\", \"'নেই' → নিশ্চিত, DB-তে যাই না\", \"'সম্ভবত আছে' → DB দিয়ে নিশ্চিত\", \"Register হলে filter-এ add, চালুর সময় DB থেকে ভরা\"], \"cmd\": \"\", \"f\": [{\"p\": \"src/lib/bloom.ts\", \"k\": \"নতুন\", \"n\": [\"মূল Bloom filter class\"], \"c\": \"// Bloom Filter (Asif vai-এর topic)\\n// ------------------------------------------------------------------\\n// কাজ: \\\"এই username কি আছে?\\\" খুব দ্রুত আর অল্প memory-তে বলা।\\n//   - বলে \\\"নিশ্চিত নেই\\\"  → ১০০% ঠিক (false negative হয় না)\\n//   - বলে \\\"সম্ভবত আছে\\\"  → মাঝে মাঝে ভুল (false positive), তাই তখন DB দিয়ে নিশ্চিত হই\\n//\\n// Bit গুলো Redis-এর bitmap-এ রাখি (SETBIT / GETBIT)। তাই ৫টা server চললেও\\n// সবাই একই filter দেখে। কোনো বাড়তি Redis module লাগে না।\\nimport { createHash } from 'node:crypto';\\nimport type Redis from 'ioredis';\\n\\nexport class BloomFilter {\\n  constructor(\\n    private redis: Redis,\\n    private key: string,\\n    private m: number, // মোট bit সংখ্যা\\n    private k: number, // কয়টা hash function\\n  ) {}\\n\\n  // n টা item আর p false-positive হার থেকে m আর k হিসাব করার সূত্র\\n  static size(n: number, p: number) {\\n    const m = Math.ceil((-n * Math.log(p)) / Math.LN2 ** 2);\\n    const k = Math.max(1, Math.round((m / n) * Math.LN2));\\n    return { m, k };\\n  }\\n\\n  // একটা item থেকে k টা bit-এর position বের করা।\\n  // k বার আলাদা hash না চালিয়ে \\\"double hashing\\\": h1 + i*h2  (দ্রুত, আর যথেষ্ট ভালো)\\n  private positions(item: string): number[] {\\n    const h = createHash('sha256').update(item).digest();\\n    const h1 = h.readUInt32BE(0);\\n    const h2 = h.readUInt32BE(4) || 1;\\n    return Array.from({ length: this.k }, (_, i) => (h1 + i * h2) % this.m);\\n  }\\n\\n  // add: k টা bit ১ করে দাও (pipeline = এক round trip-এ সব command)\\n  async add(item: string) {\\n    const p = this.redis.pipeline();\\n    for (const pos of this.positions(item)) p.setbit(this.key, pos, 1);\\n    await p.exec();\\n  }\\n\\n  // অনেকগুলো একসাথে add (startup-এ DB থেকে load করার সময়)\\n  async addMany(items: string[]) {\\n    const p = this.redis.pipeline();\\n    for (const item of items) for (const pos of this.positions(item)) p.setbit(this.key, pos, 1);\\n    await p.exec();\\n  }\\n\\n  // mightContain: k টা bit-এর একটাও ০ হলে → নিশ্চিত নেই (false)\\n  //               সবগুলো ১ হলে → সম্ভবত আছে (true)\\n  async mightContain(item: string): Promise\u003cboolean> {\\n    const p = this.redis.pipeline();\\n    for (const pos of this.positions(item)) p.getbit(this.key, pos);\\n    const res = await p.exec();\\n    return res!.every(([err, bit]) => !err && bit === 1);\\n  }\\n}\\n\"}, {\"p\": \"src/modules/users/username.bloom.ts\", \"k\": \"নতুন\", \"n\": [\"instance + warm-up\"], \"c\": \"// Username-এর জন্য একটাই Bloom filter instance।\\n// ১০ লাখ username, ১% false positive ধরে আকার হিসাব (m ≈ 9.6M bit ≈ 1.2MB, k = 7)।\\nimport { BloomFilter } from '../../lib/bloom';\\nimport { redis } from '../../lib/redis';\\nimport { query } from '../../lib/db';\\n\\nconst { m, k } = BloomFilter.size(1_000_000, 0.01);\\nexport const usernameBloom = new BloomFilter(redis, 'bloom:usernames', m, k);\\n\\n// Server চালু হওয়ার সময় DB-র সব username filter-এ ভরে দাও।\\n// বড় table হলে ১০০০ করে keyset pagination (id > last) দিয়ে পড়ি, যাতে memory-তে সব একসাথে না আসে।\\nexport async function warmUsernameBloom() {\\n  let lastId = 0;\\n  let total = 0;\\n  while (true) {\\n    const rows = await query\u003c{ id: number; username: string }>(\\n      'SELECT id, username FROM users WHERE id > $1 ORDER BY id LIMIT 1000',\\n      [lastId],\\n    );\\n    if (!rows.length) break;\\n    await usernameBloom.addMany(rows.map((r) => r.username));\\n    total += rows.length;\\n    lastId = rows[rows.length - 1].id;\\n  }\\n  return total;\\n}\\n\"}, {\"p\": \"src/modules/users/users.routes.ts\", \"k\": \"নতুন\", \"n\": [\"GET /users/username-available\"], \"c\": \"// GET /users/username-available?u=abed\\n// Signup form-এ টাইপ করার সময় বারবার call হয়। তাই আগে Bloom filter দেখি:\\n//   filter বলে \\\"নিশ্চিত নেই\\\" → সাথে সাথে available (DB-তে যাই-ই না)\\n//   filter বলে \\\"সম্ভবত আছে\\\" → তখন DB দিয়ে নিশ্চিত হই (false positive হতে পারে)\\nimport { Router } from 'express';\\nimport { z } from 'zod';\\nimport { validateQuery } from '../../middlewares/validate';\\nimport { usernameBloom } from './username.bloom';\\nimport { query } from '../../lib/db';\\n\\nexport const usersRouter = Router();\\n\\nconst Q = z.object({ u: z.string().trim().toLowerCase().min(3).max(30) });\\n\\nusersRouter.get('/username-available', validateQuery(Q), async (req, res) => {\\n  const { u } = res.locals.query as z.infer\u003ctypeof Q>;\\n\\n  if (!(await usernameBloom.mightContain(u))) {\\n    res.json({ username: u, available: true, checkedBy: 'bloom' }); // DB query হয়নি ✓\\n    return;\\n  }\\n  const rows = await query('SELECT 1 FROM users WHERE username = $1', [u]);\\n  res.json({ username: u, available: rows.length === 0, checkedBy: 'db' });\\n});\\n\"}, {\"p\": \"src/modules/auth/auth.service.ts\", \"k\": \"আপডেট\", \"n\": [\"import আর register-এর পরে usernameBloom.add যোগ\"], \"c\": \"// Business logic: password hash, user তৈরি, login যাচাই, JWT বানানো।\\n// HTTP (req/res) এখানে নেই, তাই আলাদা করে test করা সহজ।\\nimport bcrypt from 'bcryptjs';\\nimport jwt from 'jsonwebtoken';\\nimport { query } from '../../lib/db';\\nimport { env } from '../../config/env';\\nimport { AppError } from '../../lib/errors';\\nimport { usernameBloom } from '../users/username.bloom';\\nimport type { LoginInput, RegisterInput } from './auth.schema';\\n\\nconst signToken = (userId: number) =>\\n  jwt.sign({}, env.JWT_SECRET, {\\n    subject: String(userId),\\n    expiresIn: env.JWT_EXPIRES_IN as jwt.SignOptions['expiresIn'],\\n  });\\n\\nexport async function register(input: RegisterInput) {\\n  const hash = await bcrypt.hash(input.password, 12); // cost 12: ইচ্ছা করে ধীর, brute force কঠিন\\n  // email বা username আগে থাকলে UNIQUE ভাঙবে → code 23505 → error middleware 409 দেবে\\n  const [user] = await query\u003c{ id: number; email: string; username: string }>(\\n    'INSERT INTO users (email, username, password) VALUES ($1, $2, $3) RETURNING id, email, username',\\n    [input.email, input.username, hash],\\n  );\\n  await usernameBloom.add(user.username); // নতুন username filter-এ যোগ\\n  return { user, token: signToken(user.id) };\\n}\\n\\nexport async function login(input: LoginInput) {\\n  const [user] = await query\u003c{ id: number; password: string }>(\\n    'SELECT id, password FROM users WHERE email = $1',\\n    [input.email],\\n  );\\n  // email ভুল আর password ভুল — দুটোতেই একই উত্তর, যাতে কোন email আছে সেটা ফাঁস না হয়\\n  if (!user || !(await bcrypt.compare(input.password, user.password))) {\\n    throw new AppError(401, 'Invalid email or password');\\n  }\\n  return { token: signToken(user.id) };\\n}\\n\"}, {\"p\": \"src/app.ts\", \"k\": \"আপডেট (চূড়ান্ত)\", \"n\": [\"/users route যোগ\"], \"c\": \"// Express app বানানো: middleware আর route জোড়া লাগানো।\\n// listen এখানে না (server.ts-এ), যাতে test-এ app সরাসরি import করে চালানো যায়।\\nimport express from 'express';\\nimport { authRouter } from './modules/auth/auth.routes';\\nimport { tasksRouter } from './modules/tasks/tasks.routes';\\nimport { shopRouter } from './modules/shop/shop.routes';\\nimport { usersRouter } from './modules/users/users.routes';\\nimport { errorHandler, notFound } from './middlewares/error';\\n\\nexport const app = express();\\n\\napp.use(express.json({ limit: '100kb' })); // body JSON পড়া; বিশাল body আটকানো\\n\\napp.get('/health', (_req, res) => {\\n  res.json({ ok: true }); // load balancer / k8s এটা দেখে বোঝে app বেঁচে আছে\\n});\\n\\napp.use('/auth', authRouter);\\napp.use('/tasks', tasksRouter);\\napp.use('/users', usersRouter);\\napp.use('/', shopRouter);\\n\\napp.use(notFound);     // কোনো route না মিললে 404\\napp.use(errorHandler); // সবার শেষে\\n\"}], \"run\": \"curl \\\"localhost:3000/users/username-available?u=newperson\\\"\\ncurl \\\"localhost:3000/users/username-available?u=abed\\\"\", \"exp\": \"{\\\"username\\\":\\\"newperson\\\",\\\"available\\\":true,\\\"checkedBy\\\":\\\"bloom\\\"}\\n{\\\"username\\\":\\\"abed\\\",\\\"available\\\":false,\\\"checkedBy\\\":\\\"db\\\"}\", \"say\": \"Bloom filter Redis bitmap-এ রাখি, signup-এ বেশিরভাগ নতুন username DB-তে না গিয়েই available বলি; filter 'আছে' বললে তবেই DB check।\"}, {\"id\": \"s15\", \"t\": \"Graceful shutdown + Bloom warm-up\", \"g\": \"চালুর সময় filter ভরা, বন্ধের সময় চলমান request শেষ করা।\", \"w\": [\"SIGTERM/SIGINT → server.close() → নতুন request বন্ধ\", \"চলমান শেষ → pool.end(), redis.disconnect()\", \"১০ সেকেন্ডে না হলে force exit\"], \"cmd\": \"\", \"f\": [{\"p\": \"src/server.ts\", \"k\": \"আপডেট (চূড়ান্ত)\", \"n\": [], \"c\": \"// App চালু করা + Bloom filter ভরা + graceful shutdown।\\nimport { app } from './app';\\nimport { env } from './config/env';\\nimport { pool } from './lib/db';\\nimport { redis } from './lib/redis';\\nimport { warmUsernameBloom } from './modules/users/username.bloom';\\n\\nasync function main() {\\n  const n = await warmUsernameBloom();\\n  console.log(`Bloom filter ready: ${n} usernames`);\\n\\n  const server = app.listen(env.PORT, () => console.log(`API on http://localhost:${env.PORT}`));\\n\\n  // Graceful shutdown: deploy বা Ctrl+C-এ চলমান request শেষ করে, তারপর DB/Redis বন্ধ\\n  const shutdown = (signal: string) => {\\n    console.log(`${signal} received, shutting down...`);\\n    server.close(async () => {\\n      await pool.end();\\n      redis.disconnect();\\n      process.exit(0);\\n    });\\n    setTimeout(() => process.exit(1), 10_000).unref(); // ১০ সেকেন্ডে না হলে জোর করে\\n  };\\n  process.on('SIGTERM', () => shutdown('SIGTERM'));\\n  process.on('SIGINT', () => shutdown('SIGINT'));\\n}\\n\\nmain().catch((e) => {\\n  console.error(e);\\n  process.exit(1);\\n});\\n\"}], \"run\": \"npm run dev   # তারপর Ctrl+C\", \"exp\": \"Bloom filter ready: 1 usernames\\nAPI on http://localhost:3000\\nSIGINT received, shutting down...\", \"say\": \"Deploy-এর সময় SIGTERM পেলে চলমান request শেষ করে connection বন্ধ করি, কোনো request মাঝপথে কাটে না।\"}, {\"id\": \"s16\", \"t\": \"Test (Vitest + Supertest)\", \"g\": \"আসল DB আর Redis দিয়ে ১১টা test।\", \"w\": [\"Concurrency test mock দিয়ে না, আসল DB দিয়ে\", \"প্রতিবার TRUNCATE আর FLUSHDB দিয়ে পরিষ্কার শুরু\"], \"cmd\": \"npm test\", \"f\": [{\"p\": \"vitest.config.ts\", \"k\": \"নতুন\", \"n\": [\"test একটার পর একটা\"], \"c\": \"import { defineConfig } from 'vitest/config';\\nexport default defineConfig({ test: { fileParallelism: false, testTimeout: 20000 } });\\n\"}, {\"p\": \"tests/app.test.ts\", \"k\": \"নতুন\", \"n\": [\"auth, tasks, orders, bloom, rate limit\"], \"c\": \"// Supertest দিয়ে আসল DB আর Redis-এর বিরুদ্ধে API test।\\n// চালাও: npm test  (আগে docker compose up -d আর npm run db:migrate)\\nimport { beforeAll, afterAll, describe, expect, it } from 'vitest';\\nimport request from 'supertest';\\nimport { app } from '../src/app';\\nimport { pool } from '../src/lib/db';\\nimport { redis } from '../src/lib/redis';\\n\\nconst api = request(app);\\nlet tokenA = '';\\nlet tokenB = '';\\n\\nbeforeAll(async () => {\\n  // প্রতিবার পরিষ্কার শুরু\\n  await pool.query('TRUNCATE order_items, orders, products, tasks, users RESTART IDENTITY CASCADE');\\n  awa
