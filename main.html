003ctr>\u003ctd>Speed\u003c/td>\u003ctd>হাজার/sec\u003c/td>\u003ctd>হাজার – লাখ/sec\u003c/td>\u003ctd>লাখ – মিলিয়ন/sec\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Order\u003c/td>\u003ctd>Queue-এ FIFO\u003c/td>\u003ctd>Queue-এ FIFO\u003c/td>\u003ctd>Partition-এর ভেতরে\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Extra\u003c/td>\u003ctd>delay, retry, cron, priority\u003c/td>\u003ctd>DLX, priority, TTL\u003c/td>\u003ctd>replay, stream processing\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>কখন\u003c/td>\u003ctd>Node app-এর background job (email, PDF)\u003c/td>\u003ctd>Microservice-এর মাঝে routing সহ message\u003c/td>\u003ctd>বিশাল event, analytics, log, event sourcing\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>জটিলতা\u003c/td>\u003ctd>সহজ\u003c/td>\u003ctd>মাঝারি\u003c/td>\u003ctd>বেশি\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\u003cdiv class=\"legend\">\u003cb class=\"bk\">মনে রাখো:\u003c/b> BullMQ = to-do list · RabbitMQ = post office · Kafka = খাতা (সব লেখা থাকে, আবার পড়া যায়)\u003c/div>\u003c/div>`;\nA.rabbit+=QCMP;A.bull+=QCMP;\nconst parts=[\n{id:\"intro\",name:\"শুরু: নিজের পরিচয় ও অভিজ্ঞতা\",items:[\n {t:\"Tell me about yourself\",a:\"\",say:\"আমি মোঃ আবেদুর রহমান, প্রায় ৫ বছরের অভিজ্ঞতার একজন backend engineer। আমার মূল কাজ Node.js আর ASP.NET Core, দুটো দিয়েই। BAUST থেকে CSE করেছি, programming শুরু competitive programming দিয়ে। Bit Mascot-এ সাড়ে চার বছর ASP.NET Core, C#, MSSQL আর stored procedure দিয়ে production API বানিয়েছি, আর Mining Hub project-এ Node.js দিয়ে backend করেছি। মার্চ ২০২৬ থেকে WebAlive-এ Umerang-এর backend-এ flow automation আর load balancing নিয়ে কাজ করছি। দুই stack-এ কাজ করায় আমি async programming, API design, database optimization, queue আর caching-এর মূল ধারণা stack-এর বাইরে থেকে বুঝি, শুধু কোনো একটা framework দিয়ে না। এখন আমি পুরোপুরি Node.js backend-এ, scalable system নিয়ে কাজ করতে চাই, আর আমার .NET-এর শক্ত ভিত এখানে কাজে লাগবে।\",\n  ex:\"৬০–৯০ সেকেন্ডে শেষ করো। ক্রম: নাম + বছর → পড়াশোনা → Bit Mascot → WebAlive → Side work → কেন এই role। শেষ লাইনে role-এর সাথে connect করো।\",\n  hook:\"\u003cb>ক্রম মনে রাখো: কে → কোথায় পড়েছি → কোথায় কাজ → কী বানিয়েছি → কেন এই job।\u003c/b> ৯০ সেকেন্ডের বেশি না।\",\n  b:[\"নাম + ~৫ বছর backend experience।\",\"CSE, BAUST (2016–2020) · competitive programming থেকে শুরু।\",\"Bit Mascot (Sept 2021 – Feb 2026): ASP.NET Core, C#, MSSQL, SP, Vue/Angular।\",\"WebAlive (Mar 2026 – এখন): Umerang backend (Klaviyo-র মতো)।\",\"Code Expressors: Go দিয়ে multi-tenant commerce SaaS।\",\"Python instructor, ICCIT 2025 publication।\",\"শেষে: Node.js + scalable backend-এ grow করতে চাই।\"],c:\"\"},\n {t:\"অভিজ্ঞতা ও Project (What have you worked on?)\",a:\"\",say:\"WebAlive-এ আমি Umerang-এর backend-এ কাজ করি: flow automation, যেখানে marketing flow trigger আর schedule অনুযায়ী চলে, digital passes, আর load balancing-এর কাজ। Bit Mascot-এ Nintendo Repair & Returns, Mining Bull, Locum West Portal আর একটা Log Archiver-এর মতো project-এ কাজ করেছি। বেশিরভাগই ছিল ASP.NET Core API, MSSQL stored procedure, আর Vue বা Angular frontend। Mining Hub-এ Node.js দিয়ে কাজ করেছি। আর Code Expressors-এ আমরা বাংলাদেশি merchant-দের জন্য Go দিয়ে multi-tenant commerce SaaS বানাচ্ছি।\",\n  ex:\"প্রতিটা project-এর জন্য একটা গল্প রেডি রাখো: সমস্যা কী ছিল → আমি কী করলাম → ফল কী হলো (সংখ্যা থাকলে বলো)। যেটা নিজে করেছ শুধু সেটাই বলো।\",\n  hook:\"\u003cb>প্রতিটা project = সমস্যা → আমার কাজ → ফল।\u003c/b> \\\"we\\\" না, \\\"I\\\" বলো।\",\n  b:[\"\u003cb>Umerang (WebAlive):\u003c/b> flow automation, digital passes, load balancing।\",\"\u003cb>Nintendo Repair & Returns:\u003c/b> repair/return flow-এর backend।\",\"\u003cb>Mining Bull, Mining Hub:\u003c/b> mining industry platform · Mining Hub-এ Node.js।\",\"\u003cb>Locum West Portal:\u003c/b> portal backend।\",\"\u003cb>Log Archiver:\u003c/b> log জমা ও archive করার system।\",\"\u003cb>Code Expressors SaaS (Go):\u003c/b> multi-tenant, অনেক merchant এক system-এ।\",\"Stack: C#/.NET Core, Node.js, Go, TypeScript, Vue, Angular, MSSQL/MySQL, SP।\"],c:\"\"},\n {t:\"Node.js vs ASP.NET Core (দুটোই জানি)\",a:\"\",say:\"দুটোই async/await দিয়ে non-blocking কাজ করে, কিন্তু ভেতরে আলাদা। Node.js একটা thread-এ event loop চালায়, I/O কাজ libuv আর OS-কে দিয়ে দেয়, তাই I/O-heavy আর real-time কাজে খুব ভালো, কিন্তু CPU-heavy কাজে worker thread লাগে। ASP.NET Core multi-threaded thread pool-এ চলে, তাই CPU-heavy কাজও সহজে সামলায়, আর built-in DI আর strong typing দেয়। আমি দুটোতেই কাজ করেছি, তাই কাজের ধরন দেখে ঠিক করি। আর Node.js-এ TypeScript, layered architecture আর DI ব্যবহার করে .NET-এর মতো গোছানো code লিখি।\",\n  ex:\"Interviewer জিজ্ঞেস করতে পারে: \\\"আপনি তো .NET developer, Node কেন?\\\" → বলো: concept একই (async, REST, DB, queue, cache), শুধু runtime আলাদা। দুটো জানলে system design ভালো বোঝা যায়।\",\n  hook:\"\u003cb>Node = ১ thread + event loop\u003c/b> (I/O-তে সেরা) · \u003cb>.NET = thread pool\u003c/b> (CPU-তেও ভালো)। \u003cb>দুটোই async/await।\u003c/b>\",\n  b:[\"Node: single thread, event loop, non-blocking I/O।\",\"Node: API, real-time (WebSocket), I/O-heavy কাজে সেরা।\",\"Node: CPU-heavy হলে worker_threads বা cluster।\",\".NET Core: multi-thread thread pool, CPU কাজও সহজে।\",\".NET Core: built-in DI, middleware, strong typing (C#)।\",\"দুটোতেই: async/await, middleware pipeline, REST API।\",\"Mapping: Express middleware ≈ ASP.NET middleware · Prisma/TypeORM ≈ EF Core · NestJS ≈ ASP.NET (DI, controller)।\",\"আমার plus: .NET-এর discipline + Node-এর speed।\"],\n  c:`// Node (Express)                    // ASP.NET Core\napp.get('/users/:id', async (req,res)=>{ // [HttpGet(\"users/{id}\")]\n  const u = await repo.find(req.params.id); // var u = await _repo.FindAsync(id);\n  res.json(u);                              // return Ok(u);\n});`},\n {t:\"কেন এই Job / কেন Change?\",a:\"\",say:\"আমি Node.js আর ASP.NET Core দুটোতেই কাজ করেছি। .NET থেকে পেয়েছি শক্ত structure: layered architecture, dependency injection, strong typing, আর database ও stored procedure-এর গভীর অভিজ্ঞতা। Node.js-এ পেয়েছি event-driven, non-blocking I/O-এর দ্রুত কাজ। এখন আমি Node.js-এ পুরো সময় দিতে চাই, যেখানে queue, caching আর scaling-এর মতো system বড় scale-এ চলে। আমি .NET-এর এই discipline Node.js project-এ নিয়ে আসতে পারব, যেমন TypeScript, পরিষ্কার layer আর ভালো DB design। আমার মনে হয় এখানেই আমার সবচেয়ে বেশি growth আর contribution হবে।\",\n  ex:\"আগের বা এখনকার company নিয়ে কখনো খারাপ কথা বলবে না। ফোকাস রাখো growth আর role-এর সাথে মিলের উপর।\",\n  hook:\"\u003cb>Negative না, Growth।\u003c/b> পুরনো company-কে দোষ না দিয়ে বলো নতুন role-এ কী শিখবে আর কী দেবে।\",\n  b:[\"Growth: Node.js + scalable system-এ আরও গভীরে কাজ।\",\"Fit: আমার API, DB, SP, queue, cache-এর অভিজ্ঞতা কাজে লাগবে।\",\"Company-কে প্রশংসা: তাদের product / team নিয়ে এক লাইন (আগে website দেখে নাও)।\",\"কখনো বলবে না: boss খারাপ, salary কম, কাজ ভালো লাগে না।\",\"Notice period জিজ্ঞেস করলে সৎভাবে সময়টা বলো।\"],c:\"\"},\n {t:\"Strength, Weakness ও তুমি কী জিজ্ঞেস করবে\",a:\"\",say:\"আমার strength হলো competitive programming থেকে আসা problem solving, আর database ও backend-এর শক্ত fundamentals। আমি পড়াই, তাই technical জিনিস teammate-দের সহজ করে বোঝাতে পারি। Weakness হলো, মাঝে মাঝে ship করার আগেই optimize করতে গিয়ে বেশি গভীরে চলে যাই। এখন সময় বেঁধে নিই, আর optimize করার আগে আগে মেপে দেখি।\",\n  ex:\"শেষে প্রশ্ন জিজ্ঞেস করো: \\\"Team-এর tech stack আর architecture কেমন?\\\" · \\\"প্রথম ৩ মাসে আমার কাছে কী আশা করবেন?\\\" · \\\"Code review আর deploy process কেমন?\\\"\",\n  hook:\"\u003cb>Strength = problem solving + DB + explain করতে পারি।\u003c/b> Weakness = সত্যি একটা + কীভাবে ঠিক করছি।\",\n  b:[\"Strength: competitive programming → problem solving।\",\"Strength: DB, SP, query optimization-এ শক্ত।\",\"Strength: teaching → সহজ করে বোঝাতে পারি, junior-দের help।\",\"Weakness: আসল একটা বলো + সমাধান (time-box, আগে মাপো)।\",\"\\\"আপনার কোনো প্রশ্ন আছে?\\\" → সবসময় ২-৩টা প্রশ্ন করো।\",\"শেষে: ধন্যবাদ + আগ্রহ আবার বলো।\"],c:\"\"}\n]},\n{id:\"base\",name:\"শুরু: Node.js\",items:[\n {t:\"Node.js কিভাবে কাজ করে\",a:\"node\",ex:\"একটা e-commerce API-তে ১০০০ জন একসাথে product list চাইলে Node প্রতিটার জন্য নতুন thread খোলে না। DB query OS/libuv-কে দিয়ে পরের request ধরে, result এলে callback-এ response পাঠায়। তাই ছোট server-এও হাজার connection সামলায়।\",say:\"Node.js হলো V8 engine আর libuv দিয়ে বানানো JS runtime। JS চলে একটা thread-এ, কিন্তু I/O কাজ OS বা libuv-এর thread pool-এ চলে যায়। কাজ শেষ হলে event loop callback ফেরত আনে, তাই কম resource-এ অনেক request সামলাতে পারে।\",hook:\"\u003cb>Restaurant trick:\u003c/b> Waiter একজন (V8, single thread)। Order নেয়, kitchen-এ দেয় (libuv / OS)। রান্না হলে ঘণ্টা বাজে (callback)। Waiter বসে থাকে না।\",\n  b:[\"Node = V8 + libuv + Node APIs।\",\"V8: JS কে machine code বানিয়ে চালায়।\",\"JS চলে একটা thread-এ।\",\"Network I/O → OS নিজেই সামলায় (epoll)।\",\"fs, crypto, dns → libuv thread pool (default ৪টা)।\",\"কাজ শেষ → callback queue → event loop → JS-এ ফেরত।\",\"তাই হাজার request একসাথে, কিন্তু ভারী CPU loop দিলে সব আটকে যায়।\"],\n  c:`const fs = require('node:fs');\nconsole.log('1. শুরু');\nfs.readFile('a.txt', () => console.log('3. file পড়া শেষ')); // thread pool\nsetImmediate(() => console.log('setImmediate'));            // check phase\nconsole.log('2. শেষ, JS অপেক্ষা করে না');\n// UV_THREADPOOL_SIZE=8 node app.js  → pool বড় করা যায়`}\n]},\n{id:\"js\",name:\"JavaScript ও Node.js\",items:[\n {t:\"Event Loop\",a:\"eventloop\",ex:\"ধরুন checkout-এ আগে stock update হবে, তারপর email। stock-এর কাজ Promise-এ আর email setTimeout-এ দিলে stock আগে হবে, কারণ microtask আগে চলে।\",say:\"Event loop দেখে call stack খালি কিনা। আগে সব sync code চলে, তারপর সব microtask যেমন Promise, তারপর একটা macrotask যেমন setTimeout। তাই A, D, C, B print হয়।\",hook:\"\u003cb>Cashier trick:\u003c/b> Cashier একজন। রান্না হয় kitchen-এ। Order: \u003cb>sync → nextTick → Promise → setTimeout\u003c/b>।\",\n  b:[\"JS-এর thread একটা। Stack একটা।\",\"I/O বাইরে যায় (libuv / OS)। JS অপেক্ষা করে না।\",\"কাজ শেষ হলে callback queue-তে বসে।\",\"Stack খালি হলে Loop queue থেকে তুলে আনে।\",\"Promise (microtask) আগে, setTimeout (macrotask) পরে।\",\"ভারী CPU loop চালালে সব আটকে যায়।\"],\n  c:`console.log('A')                                 // 1. sync\nsetTimeout(()=> console.log(\"B\"),0)              // macrotask queue\nPromise.resolve().then(()=>console.log(\"C\"))     // microtask queue\nconsole.log('D')                                 // 2. sync\n// output: A, D, C, B\n// sync শেষ → microtask (C) → macrotask (B)`},\n {t:\"Worker Threads\",a:\"worker\",ex:\"User profile picture upload করলে sharp দিয়ে resize CPU-heavy কাজ। Main thread-এ করলে ওই ২ সেকেন্ড বাকি সব API আটকে যায়। Worker pool-এ দিলে API fast থাকে।\",say:\"Worker thread লাগে CPU-heavy কাজে, যেমন image process বা বড় hash। এতে main thread block হয় না, request নিতেই থাকে। I/O কাজে worker লাগে না, আর production-এ worker pool রাখি।\",hook:\"\u003cb>Helper trick:\u003c/b> কঠিন \u003cb>হিসাব\u003c/b> → Helper। DB/HTTP → helper লাগবে না। \u003cb>Pool\u003c/b> রাখো।\",\n  b:[\"CPU ভারী কাজ (image, PDF, hash) → Worker।\",\"I/O কাজে async-ই যথেষ্ট, worker না।\",\"Worker-এর নিজের memory, নিজের event loop।\",\"কথা বলে postMessage দিয়ে।\",\"প্রতিবার নতুন worker না, Pool (piscina)।\"],\n  c:`const { Worker } = require('node:worker_threads');\nconst w = new Worker('./heavy.js', { workerData: 40 });\nw.on('message', r => console.log('result', r));\n// heavy.js\nconst { parentPort, workerData } = require('node:worker_threads');\nparentPort.postMessage(fib(workerData));`},\n {t:\"Concurrency vs Parallelism\",a:\"conc\",ex:\"Node server ১টা core-এ ১০০০ request concurrently সামলায়, কারণ বেশিরভাগ সময় DB-র অপেক্ষা। কিন্তু video encode-এর মতো CPU কাজে ৪ core-এ cluster বা worker দিয়ে parallel চালাই।\",say:\"Concurrency মানে অনেক কাজ পালাক্রমে এগোনো, parallelism মানে একসাথে একাধিক core-এ চলা। Node concurrent, কিন্তু JS নিজে parallel না। Shared data-তে race condition ঠেকাতে atomic update বা lock দিই।\",hook:\"\u003cb>এক হাতে ২টা বল\u003c/b> = Concurrency। \u003cb>২ হাতে ২টা বল\u003c/b> = Parallelism।\",\n  b:[\"Concurrency: অনেক কাজ, পালাক্রমে এগোয়।\",\"Parallelism: এক মুহূর্তে একাধিক core-এ চলে।\",\"Shared data + দুজন লেখে = Race condition।\",\"Fix: atomic UPDATE, lock, বা version check।\",\"Deadlock: দুজন দুজনের lock চায়।\"],\n  c:`-- Race safe: atomic update\nUPDATE products SET stock = stock - 1\nWHERE id = 7 AND stock > 0;\n-- affectedRows = 0 হলে: stock শেষ`},\n {t:\"Batch Processing\",a:\"chunks\",ex:\"১০ লাখ user-এর report বানাতে সব একবারে load করলে memory crash। আমি ১০০০ করে cursor দিয়ে পড়ে bulk insert করি, তাতে ১০ লাখ insert-এর বদলে ১০০০টা query।\",say:\"অনেক data একবারে না নিয়ে ১০০০ করে batch-এ নিই, cursor দিয়ে। Bulk insert করলে DB round trip কমে। Job idempotent রাখি, fail হলে retry, বারবার fail হলে DLQ-তে পাঠাই।\",hook:\"\u003cb>১০০০ চিঠি → ১০০ করে ১০ বার।\u003c/b> \u003cb>Chunk + Cursor + Idempotent + Retry + DLQ\u003c/b>।\",\n  b:[\"সব একবারে memory-তে তুলো না।\",\"Chunk করে পড়ো (cursor / id > last)।\",\"Bulk insert → কম DB round trip।\",\"আবার চালালে double হবে না (idempotent)।\",\"Fail → retry। বারবার fail → DLQ।\"],\n  c:`let lastId = 0;\nwhile (true) {\n  const rows = await db.query(\n    'SELECT * FROM users WHERE id > ? ORDER BY id LIMIT 1000', [lastId]);\n  if (!rows.length) break;\n  await processBatch(rows);\n  lastId = rows.at(-1).id;\n}`},\n {t:\"Streams & Backpressure\",a:\"stream\",ex:\"2GB log file download দিতে readFile করলে RAM-এ 2GB লাগে। createReadStream().pipe(res) দিলে 64KB করে যায়, server RAM প্রায় একই থাকে।\",say:\"বড় file পুরোটা memory-তে না তুলে stream দিয়ে chunk করে পড়ি। Destination slow হলে backpressure source-কে থামায়। pipeline() দিয়ে লিখি, তাতে error-ও ঠিকমতো সামলানো হয়।\",hook:\"\u003cb>Pipe-এ পানি:\u003c/b> পুরো tank RAM-এ না। নিচে ভরে গেলে \u003cb>উপরের কল বন্ধ\u003c/b>।\",\n  b:[\"বড় file → টুকরো টুকরো (chunk) পড়ো।\",\"RAM কম লাগে।\",\"Readable → Transform → Writable।\",\"Destination slow হলে source থামে = backpressure।\",\"pipeline() use করো, error-ও সামলায়।\"],\n  c:`const { pipeline } = require('node:stream/promises');\nconst fs = require('node:fs'); const zlib = require('node:zlib');\nawait pipeline(\n  fs.createReadStream('big.log'),\n  zlib.createGzip(),\n  fs.createWriteStream('big.log.gz'));`},\n {t:\"Graceful Shutdown\",a:\"shutdown\",ex:\"Kubernetes-এ নতুন version deploy করলে পুরনো pod-কে SIGTERM দেয়। Graceful shutdown না থাকলে চলমান payment request মাঝপথে কেটে যায়, তাই আগে request শেষ করে তারপর DB close করি।\",say:\"SIGTERM পেলে server.close() দিয়ে নতুন request বন্ধ করি, চলমান request শেষ হতে দিই। তারপর DB, Redis close করি। Timeout পার হলে force exit করি, যাতে deploy-এর সময় কোনো request না কাটে।\",hook:\"\u003cb>দোকান বন্ধ:\u003c/b> shutter নামাও → ভেতরের customer শেষ → light off → সময় শেষ হলে জোর করে।\",\n  b:[\"SIGTERM আসে (K8s / Docker stop)।\",\"নতুন request নেব না।\",\"চলমান request শেষ হতে দাও।\",\"DB, Redis, queue বন্ধ করো।\",\"১০ সেকেন্ডে না হলে force exit।\"],\n  c:`process.on('SIGTERM', () => {\n  server.close(async () => {\n    await db.end(); await redis.quit();\n    process.exit(0);\n  });\n  setTimeout(() => process.exit(1), 10000).unref();\n});`}\n]},\n{id:\"arch\",name:\"Architecture, Queue ও Cloud\",items:[\n {t:\"Monolith vs Microservices\",a:\"micro\",ex:\"Daraz-এর মতো system-এ order, payment, notification আলাদা service। Sale-এর সময় শুধু order service ১০টা pod করা যায়, payment ২টাতেই থাকে।\",say:\"Monolith সহজ, এক deploy। Microservices আলাদা deploy আর scale দেয়, কিন্তু network failure, data consistency আর monitoring জটিল করে। ছোট team হলে আমি modular monolith দিয়ে শুরু করব।\",hook:\"\u003cb>এক বড় দোকান\u003c/b> vs \u003cb>অনেক ছোট দোকান\u003c/b>। ছোট team → \u003cb>Modular Monolith\u003c/b>।\",\n  b:[\"Monolith: এক code, এক deploy। সহজ।\",\"Micro: আলাদা deploy, আলাদা scale।\",\"Micro-র দাম: network fail, data sync, monitoring।\",\"প্রতিটা service-এর নিজের DB।\",\"Gateway, Circuit breaker, Saga লাগে।\"],\n  c:`// Circuit breaker idea\nif (failCount > 5) return fallback(); // open\ntry { const r = await callPayment(); failCount = 0; return r; }\ncatch (e) { failCount++; throw e; }`},\n {t:\"Saga Pattern\",a:\"saga\",ex:\"Ride booking: ride তৈরি হলো, payment কাটা হলো, কিন্তু driver পাওয়া গেল না। তখন compensating action দিয়ে refund আর ride cancel করি।\",say:\"অনেক service-এ single DB transaction হয় না, তাই Saga: প্রতি step-এর compensating action, fail হলে উল্টো ক্রমে undo। Choreography-তে service গুলো event শুনে নিজেরা কাজ করে, loosely coupled কিন্তু flow বোঝা কঠিন। Orchestration-এ একটা orchestrator step চালায় আর rollback করায়, debug সহজ। ছোট flow-এ choreography, জটিল flow-এ orchestration। দুটোতেই step idempotent আর outbox pattern।\",hook:\"\u003cb>Order → Payment → Stock।\u003c/b> মাঝে fail? \u003cb>উল্টো পথে undo\u003c/b>।\",\n  b:[\"অনেক service, এক DB transaction নেই।\",\"প্রতিটা step-এর একটা undo (refund, cancel)।\",\"\u003cb>Choreography:\u003c/b> boss নেই, event শুনে নিজে নিজে।\",\"→ ভালো: loosely coupled। খারাপ: flow ছড়ানো, debug কঠিন।\",\"\u003cb>Orchestration:\u003c/b> একজন boss ক্রম ধরে চালায়, fail হলে undo করায়।\",\"→ ভালো: এক জায়গায় flow। খারাপ: extra service। Tool: Temporal, Step Functions।\",\"ছোট flow → Choreography, জটিল → Orchestration।\",\"দুটোতেই: idempotent step, saga state DB-তে, Outbox pattern।\"],\n  c:`// Choreography: প্রতিটা service event শোনে\nbus.on('OrderCreated', e => charge(e).then(() => bus.publish('PaymentDone', e)));\nbus.on('StockFailed',  e => refund(e).then(() => bus.publish('PaymentRefunded', e)));\n\n// Orchestration: একজন boss\nconst steps = [{ do: createOrder, undo: cancelOrder },\n               { do: chargePayment, undo: refundPayment },\n               { do: reserveStock, undo: releaseStock }];\nconst done = [];\ntry { for (const s of steps) { await s.do(ctx); done.push(s); } }\ncatch (e) { for (const s of done.reverse()) await s.undo(ctx); } // উল্টো ক্রমে`},\n {t:\"Serverless, Cloud Run & Pub/Sub\",a:\"cloud\",ex:\"Order হলে Pub/Sub-এ event দিই, Cloud Run invoice PDF বানায়। Pub/Sub একই message দুবার দিতে পারে, তাই orderId দিয়ে check করি, নাহলে দুটো invoice হয়ে যাবে।\",say:\"Serverless-এ server আমি manage করি না, traffic অনুযায়ী auto scale হয়। Cold start একটা সমস্যা, min instances দিয়ে কমাই। Pub/Sub at-least-once, তাই handler idempotent রাখি messageId দিয়ে।\",hook:\"\u003cb>Server আছে, তুমি চালাও না।\u003c/b> Message ২ বার আসতে পারে → \u003cb>Idempotent\u003c/b>।\",\n  b:[\"Code দাও, cloud চালায়, scale করে।\",\"Cold start = প্রথম request slow।\",\"min instances দিলে cold start কমে।\",\"Pub/Sub at-least-once → duplicate আসে।\",\"Event ID দিয়ে duplicate skip।\"],\n  c:`app.post('/pubsub', async (req, res) => {\n  const msg = req.body.message;\n  if (await seen(msg.messageId)) return res.sendStatus(204);\n  await handle(JSON.parse(Buffer.from(msg.data, 'base64')));\n  await markSeen(msg.messageId);\n  res.sendStatus(204); // ack\n});`},\n {t:\"Docker\",a:\"docker\",ex:\"আমার laptop-এ Node 20, server-এ Node 16 থাকলে bug হয়। Dockerfile-এ node:20-alpine দিলে dev, staging, production সবখানে একই image চলে।\",say:\"Dockerfile হলো recipe, build করলে image হয়, image চালালে container। এতে সব জায়গায় একই environment পাই। Multi-stage build দিয়ে image ছোট রাখি আর non-root user-এ চালাই।\",hook:\"\u003cb>Recipe → রান্না → Plate।\u003c/b> Dockerfile → Image → Container।\",\n  b:[\"Dockerfile = recipe।\",\"Image = layer দিয়ে বানানো snapshot।\",\"Container = চালু image।\",\"Layer cache: package.json আগে COPY।\",\"Multi-stage → ছোট image। Non-root user।\"],\n  c:`FROM node:20-alpine\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci --omit=dev\nCOPY . .\nUSER node\nCMD [\"node\", \"server.js\"]`},\n {t:\"JWT\",a:\"jwt\",ex:\"Login-এর পর {sub: 42, role: 'user'} sign করে দিই। কেউ payload-এ role 'admin' করে দিলে signature মেলে না, তাই server 401 দেয়।\",say:\"JWT-র তিন অংশ: header, payload, signature। Payload শুধু Base64 encoded, encrypted না, তাই sensitive data রাখি না। Server signature, exp আর issuer verify করে।\",hook:\"\u003cb>H.P.S\u003c/b> = Header . Payload . Signature। Payload \u003cb>সবাই পড়তে পারে\u003c/b>।\",\n  b:[\"৩ অংশ, dot দিয়ে আলাদা।\",\"Payload Base64, encrypt না → password রাখবে না।\",\"Signature = secret দিয়ে সিল।\",\"Server signature verify করে।\",\"exp, iss, aud check করো।\"],\n  c:`const jwt = require('jsonwebtoken');\nconst token = jwt.sign({ sub: user.id }, SECRET, { expiresIn: '15m' });\nconst data = jwt.verify(token, SECRET); // ভুল হলে throw`},\n {t:\"Access & Refresh Token\",a:\"refresh\",ex:\"Mobile app-এ user প্রতি ১৫ মিনিটে login করবে না। Access expire হলে app নিজে refresh দিয়ে নতুন token আনে। Phone চুরি হলে refresh revoke করে সব session বন্ধ করি।\",say:\"Access token ছোট মেয়াদের, ১৫ মিনিট। Refresh token HttpOnly cookie-তে থাকে, DB-তে hash করে রাখি। প্রতিবার refresh-এ নতুন জোড়া দিই, পুরনোটা বাতিল, আর logout-এ revoke করি।\",hook:\"\u003cb>Cinema ticket (Access, অল্প মেয়াদ)\u003c/b> + \u003cb>Membership card (Refresh)\u003c/b>। Use করলে নতুন card।\",\n  b:[\"Access token: ১৫ মিনিট।\",\"Refresh token: ৭-৩০ দিন, HttpOnly cookie।\",\"Refresh DB-তে hash করে রাখো।\",\"Use করলে পুরনো বাতিল, নতুন দাও (rotation)।\",\"Logout → revoke।\"],\n  c:`res.cookie('rt', refreshToken, {\n  httpOnly: true, secure: true,\n  sameSite: 'strict', path: '/auth/refresh'\n});`},\n {t:\"Web Security\",a:\"security\",ex:\"/orders/15 call-এ শুধু login check করলে user অন্যের order দেখতে পারে (IDOR)। তাই query-তে WHERE id = ? AND user_id = ? দিই।\",say:\"SQL injection ঠেকাতে parameterized query, XSS ঠেকাতে output escape আর CSP, CSRF ঠেকাতে SameSite cookie। Password bcrypt দিয়ে hash করি। প্রতিটা request-এ authentication আর ownership check করি।\",hook:\"\u003cb>SQLi\u003c/b> → param query। \u003cb>XSS\u003c/b> → escape। \u003cb>CSRF\u003c/b> → SameSite। \u003cb>Password\u003c/b> → bcrypt।\",\n  b:[\"User input-এ ভরসা নেই।\",\"SQL string জোড়া না, ? param।\",\"Output escape, CSP header।\",\"Password hash: bcrypt / argon2।\",\"AuthN = তুমি কে। AuthZ = কী করতে পারো।\",\"Owner check: order.userId === আমি?\"],\n  c:`// SQLi safe\ndb.query('SELECT * FROM users WHERE email = ?', [email]);\n// password\nconst hash = await bcrypt.hash(pw, 12);\nconst ok = await bcrypt.compare(pw, hash);`}\n]},\n{id:\"db\",name:\"Database, Redis ও Performance\",items:[\n {t:\"Redis & Caching\",a:\"cache\",ex:\"Product page-এ প্রতি সেকেন্ডে ৫০০ hit, DB query ৫০ms। Redis cache দেওয়ার পর ২ms, আর DB load ৯০% কমে গেল। Price update হলে key delete করি।\",say:\"আমি cache-aside use করি: আগে Redis দেখি, না পেলে DB থেকে এনে TTL দিয়ে Redis-এ রাখি। Data update হলে cache delete করি। অনেক key একসাথে expire হয়ে stampede না হয়, তাই TTL-এ random jitter দিই।\",hook:\"\u003cb>হাতের কাছের তাক।\u003c/b> আগে তাক, না পেলে গুদাম (DB)। TTL দাও।\",\n  b:[\"Redis = RAM-এ data, খুব দ্রুত।\",\"Cache-aside: আগে cache, না পেলে DB → cache-এ রাখো।\",\"TTL দাও, না হলে পুরনো data।\",\"Data update → cache delete।\",\"একসাথে expire = stampede → lock / random TTL।\"],\n  c:`const key = 'user:' + id;\nlet u = await redis.get(key);\nif (!u) {\n  u = JSON.stringify(await db.findUser(id));\n  await redis.set(key, u, 'EX', 300);\n}\nreturn JSON.parse(u);`},\n {t:\"Transaction & ACID\",a:\"acid\",ex:\"bKash-এর মতো transfer-এ A থেকে কাটা আর B-তে যোগ এক transaction-এ। মাঝে server crash করলে rollback, টাকা হারায় না।\",say:\"Transaction মানে কয়েকটা operation এক কাজ হিসেবে চলে, হয় সব হবে নয়তো কিছুই না। ACID: Atomic, Consistent, Isolated, Durable। Concurrent update-এ FOR UPDATE row lock বা optimistic version check দিই।\",hook:\"\u003cb>বিকাশ transfer:\u003c/b> টাকা কাটল, পৌঁছাল না? হবে না। \u003cb>সব না হলে কিছুই না\u003c/b>।\",\n  b:[\"\u003cb>A = Atomicity:\u003c/b> সব step হবে, নয়তো একটাও না। মাঝে error → ROLLBACK।\",\"\u003cb>C = Consistency:\u003c/b> আগেও valid, পরেও valid। Rule (FK, UNIQUE, CHECK balance ≥ 0) ভাঙবে না।\",\"\u003cb>I = Isolation:\u003c/b> একসাথে চলা transaction একজন আরেকজনের অর্ধেক কাজ দেখে না।\",\"→ Level: Read Uncommitted \u003c Read Committed \u003c Repeatable Read \u003c Serializable (উপরে যত, safe তত, কিন্তু slow)।\",\"→ সমস্যা: dirty read, non-repeatable read, phantom read।\",\"\u003cb>D = Durability:\u003c/b> COMMIT হলে crash/বিদ্যুৎ যাওয়ার পরেও data থাকে (WAL / redo log)।\",\"Concurrent update: FOR UPDATE (pessimistic) বা version column (optimistic)।\"],\n  c:`BEGIN;\nSELECT balance FROM acc WHERE id=1 FOR UPDATE;\nUPDATE acc SET balance = balance - 500 WHERE id = 1;\nUPDATE acc SET balance = balance + 500 WHERE id = 2;\nCOMMIT; -- error হলে ROLLBACK`},\n {t:\"Deadlock\",a:\"deadlock\",ex:\"দুজন একসাথে A→B আর B→A transfer করলে deadlock হতে পারে। আমি সবসময় ছোট account id আগে lock করি, তাতে আর deadlock হয় না।\",say:\"দুটো transaction যখন একে অপরের lock-এর জন্য অপেক্ষা করে, তখন deadlock। Fix হলো সবসময় একই order-এ lock নেওয়া আর transaction ছোট রাখা। DB deadlock error দিলে retry করি।\",hook:\"\u003cb>দুটো গাড়ি এক-লেনের ব্রিজে।\u003c/b> Fix: ছোট transaction, \u003cb>একই order-এ lock\u003c/b>।\",\n  b:[\"T1: A lock, B চায়।\",\"T2: B lock, A চায়।\",\"কেউ ছাড়ে না → DB একজনকে মেরে ফেলে।\",\"Fix: সবসময় ছোট id থেকে বড় order-এ lock।\",\"Transaction ছোট রাখো। Deadlock error → retry।\"],\n  c:`// সবসময় একই order-এ lock\nconst [a, b] = [fromId, toId].sort((x, y) => x - y);\nawait q('SELECT * FROM acc WHERE id IN (?, ?) ORDER BY id FOR UPDATE', [a, b]);`},\n {t:\"Database Indexing\",a:\"index\",ex:\"orders table-এ ৫০ লাখ row, WHERE user_id = ? query ২ সেকেন্ড নিচ্ছিল। (user_id, created_at) composite index দেওয়ার পর ৫ms।\",say:\"Index হলো B-tree, তাই full scan না করে log n ধাপে খুঁজে পায়। Read দ্রুত হয়, কিন্তু write একটু ধীর হয়। Composite index-এ leftmost column দিয়ে শুরু করতে হয়, আর EXPLAIN দিয়ে verify করি।\",hook:\"\u003cb>বইয়ের শেষের Index।\u003c/b> Composite (a,b) = phone book: \u003cb>আগে surname\u003c/b>।\",\n  b:[\"Index ছাড়া = full table scan।\",\"Index = B-tree → log(n) step।\",\"Read দ্রুত, write একটু slow।\",\"Composite (a,b,c): a দিয়ে শুরু করতে হবে।\",\"EXPLAIN দিয়ে check: index use হচ্ছে?\"],\n  c:`CREATE INDEX idx_orders_user_date ON orders(user_id, created_at);\n-- ✓ index use হবে\nSELECT * FROM orders WHERE user_id = 5 ORDER BY created_at DESC;\n-- ✗ index use হবে না (leftmost নেই)\nSELECT * FROM orders WHERE created_at > '2026-01-01';`},\n {t:\"Query Optimization\",a:\"query\",ex:\"Order list API-তে ১০০ order-এর জন্য ১০০ বার user query হচ্ছিল (N+1)। JOIN দিয়ে ১টা query করলাম, response ৮০০ms থেকে ৬০ms।\",say:\"আন্দাজে না, আগে মাপি: slow query log দেখি, EXPLAIN চালাই। সাধারণ সমস্যা হলো missing index, N+1, SELECT * আর বড় OFFSET। Fix করে আবার মাপি।\",hook:\"\u003cb>আন্দাজে parts বদলাবে না।\u003c/b> Measure → EXPLAIN → বড়টা Fix → আবার measure।\",\n  b:[\"Slow query log / APM দিয়ে খোঁজো।\",\"EXPLAIN: full scan? কত row?\",\"N+1: loop-এর ভেতরে query → JOIN / IN।\",\"SELECT * না, দরকারি column।\",\"বড় OFFSET slow → keyset (id > last)।\"],\n  c:`// N+1 ✗\nfor (const o of orders) o.user = await getUser(o.userId);\n// fix ✓\nconst users = await q('SELECT * FROM users WHERE id IN (?)', [ids]);`},\n {t:\"Scaling\",a:\"scale\",ex:\"Eid sale-এ traffic ১০ গুণ হলো। App stateless ছিল, তাই LB-র পিছনে pod ২ থেকে ১০ করলাম, product data Redis-এ cache, read query replica-তে পাঠালাম।\",say:\"আমি ধাপে ধাপে scale করি: আগে bottleneck মাপি। App stateless করে load balancer-এর পিছনে অনেক server, তারপর cache, read replica। Sharding একদম শেষে, কারণ এটা সবচেয়ে জটিল।\",hook:\"\u003cb>বড় গাড়ি (Vertical)\u003c/b> vs \u003cb>বেশি গাড়ি (Horizontal)\u003c/b>। Sharding \u003cb>সবার শেষে\u003c/b>।\",\n  b:[\"Vertical: বড় machine। সহজ, কিন্তু limit আছে।\",\"Horizontal: বেশি machine + Load balancer।\",\"App stateless: session Redis-এ।\",\"Read বেশি → read replica।\",\"শেষ উপায়: sharding (user_id দিয়ে ভাগ)।\"],\n  c:`# nginx load balancer\nupstream api { server app1:3000; server app2:3000; server app3:3000; }\nserver { location / { proxy_pass http://api; } }`},\n {t:\"Load Testing & p95/p99\",a:\"load\",ex:\"Launch-এর আগে k6 দিয়ে ৫০০ VU চালালাম। Average 120ms কিন্তু p99 3s ছিল, কারণ connection pool মাত্র ১০। Pool বাড়ানোর পর p99 400ms।\",say:\"Average দেখি না, p95 আর p99 দেখি। k6 দিয়ে smoke, load, stress, spike আর soak test করি। একই সাথে app আর DB-র CPU, memory আর error rate দেখি।\",hook:\"\u003cb>p95 = ১০০ জনের ৯৫ জন এর চেয়ে দ্রুত পায়।\u003c/b> Smoke, Load, Stress, Spike, Soak।\",\n  b:[\"Average মিথ্যা বলে, p95/p99 দেখো।\",\"Smoke: ছোট test, কাজ করে কিনা।\",\"Load: স্বাভাবিক traffic।\",\"Stress: কোথায় ভাঙে?\",\"Spike: হঠাৎ চাপ। Soak: অনেক ঘণ্টা (memory leak)।\"],\n  c:`// k6\nexport const options = {\n  vus: 100, duration: '1m',\n  thresholds: { http_req_duration: ['p(95)\u003c300'] }\n};\nexport default () => http.get('https://api.test/orders');`}\n]},\n{id:\"infra\",name:\"Infra Scaling\",items:[\n {t:\"Vertical vs Horizontal Scaling\",a:\"vh\",ex:\"শুরুতে ১টা 2 CPU VM-এ চলছিল, CPU 90%। Vertical করে 8 CPU করলাম, এটা দ্রুত fix। পরে traffic আরও বাড়লে app stateless করে LB-র পিছনে ৪টা ছোট VM দিলাম (horizontal), একটা পড়লেও site চলে।\",say:\"Vertical scaling মানে একটা server-এ বেশি CPU আর RAM দেওয়া। সহজ, কিন্তু একটা limit আছে আর ওই একটা server পড়লে সব বন্ধ। Horizontal মানে বেশি server যোগ করে load balancer-এর পিছনে রাখা। এর জন্য app stateless হতে হয়, কিন্তু scale প্রায় সীমাহীন আর high availability পাই।\",\n  hook:\"\u003cb>বড় গাড়ি (Vertical)\u003c/b> vs \u003cb>বেশি গাড়ি (Horizontal)\u003c/b>। Vertical = scale \u003cb>up\u003c/b>, Horizontal = scale \u003cb>out\u003c/b>।\",\n  b:[\"Vertical: ১টা server, বেশি CPU/RAM।\",\"Vertical: code বদলাতে হয় না, সহজ।\",\"Vertical: hardware limit, downtime, single point of failure।\",\"Horizontal: অনেক server + Load Balancer।\",\"Horizontal: app stateless হতে হবে (session Redis-এ)।\",\"Horizontal: প্রায় সীমাহীন, একটা পড়লেও বাকিরা চলে।\"],\n  c:`# Vertical: machine বড় করো\ngcloud compute instances set-machine-type api-1 --machine-type=e2-standard-8\n# Horizontal: copy বাড়াও\nkubectl scale deployment api --replicas=5`},\n {t:\"Load Balancer\",a:\"lb\",ex:\"Nginx least_conn দিয়ে ৩টা Node instance। Deploy-এর সময় একটা restart হলে health check fail করে, LB তখন বাকি দুটোতে পাঠায়, user কিছু টের পায় না।\",say:\"Load balancer traffic অনেক server-এ ভাগ করে দেয়। Round robin বা least connections algorithm use করে, আর health check দিয়ে খারাপ server বাদ দেয়। L4 শুধু IP আর port দেখে, L7 URL আর header দেখে route করতে পারে।\",\n  hook:\"\u003cb>Traffic police:\u003c/b> গাড়ি (request) সব রাস্তায় (server) ভাগ করে। খারাপ রাস্তা (health check fail) বন্ধ।\",\n  b:[\"Request অনেক server-এ ভাগ করে।\",\"Algo: Round robin, Least connections, IP hash।\",\"Health check fail → ওই server বাদ।\",\"L4 = IP/port দেখে, L7 = URL/header দেখে।\",\"Sticky session এড়াও → state Redis-এ রাখো।\",\"Tool: Nginx, HAProxy, AWS ALB, GCP LB।\"],\n  c:`upstream api {\n  least_conn;\n  server app1:3000 max_fails=3 fail_timeout=10s;\n  server app2:3000;\n  server app3:3000;\n}\nserver { listen 80; location / { proxy_pass http://api; } }`},\n {t:\"Auto Scaling\",a:\"auto\",ex:\"Flash sale রাত ১২টায় শুরু হয়। HPA-তে CPU 70% target, min 3, max 30 দিলাম। Traffic বাড়লে ৩ মিনিটে pod ২৫টা হলো, সকালে আবার ৩টা, খরচ কম।\",say:\"Auto scaling metric দেখে নিজে থেকে server বাড়ায় বা কমায়, যেমন CPU ৭০ শতাংশের বেশি হলে নতুন pod। Kubernetes-এ HPA, cloud-এ auto scaling group। Min আর max সংখ্যা ঠিক করে দিই, আর app stateless আর দ্রুত start হতে হয়।\",\n  hook:\"\u003cb>দোকানে ভিড় বাড়লে নতুন cashier, কমলে ছুটি।\u003c/b> Metric → rule → replica বাড়ে/কমে।\",\n  b:[\"Metric দেখে: CPU, memory, RPS, queue length।\",\"CPU > ৭০% → server বাড়াও।\",\"Traffic কমলে কমাও → খরচ বাঁচে।\",\"min আর max সংখ্যা ঠিক করো।\",\"নতুন server দ্রুত start হতে হবে।\",\"K8s HPA, AWS ASG, Cloud Run auto।\"],\n  c:`apiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nspec:\n  minReplicas: 2\n  maxReplicas: 20\n  metrics:\n  - type: Resource\n    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }`},\n {t:\"Stateless App ও CDN\",a:\"stateless\",ex:\"আগে session server memory-তে ছিল, তাই LB অন্য server-এ পাঠালে user logout হয়ে যেত। Session Redis-এ আর upload S3-এ নিলাম, এখন যেকোনো server যেকোনো request নিতে পারে।\",say:\"Horizontal scaling-এর জন্য app stateless রাখি: session Redis-এ, file S3-এ, server-এর local disk-এ কিছু না। তাহলে যেকোনো server যেকোনো request নিতে পারে। Static file CDN-এ রাখি, তাতে user-এর কাছের server থেকে আসে আর origin-এর চাপ কমে।\",\n  hook:\"\u003cb>যেকোনো cashier যেকোনো customer নিতে পারে\u003c/b>, কারণ খাতা (state) সবার common আলমারিতে (Redis/S3)।\",\n  b:[\"Server-এ session / file রেখো না।\",\"Session → Redis, file → S3/GCS।\",\"যেকোনো server যেকোনো request নেয়।\",\"Server মরলেও data হারায় না।\",\"CDN: image/JS/CSS user-এর কাছের edge থেকে।\",\"CDN origin-এর চাপ আর latency কমায়।\"],\n  c:`// session Redis-এ, server-এ না\napp.use(session({\n  store: new RedisStore({ client: redis }),\n  secret: process.env.SESSION_SECRET, resave: false, saveUninitialized: false\n}));`}\n]},\n{id:\"lang\",s:\"JS/TS/Go\",name:\"JavaScript, TypeScript ও Go\",items:[\n {t:\"Closure, var/let/const, this\",a:\"closure\",ex:\"Search box-এ debounce: প্রতিটা keypress-এ API call না করে timer variable closure-এ রাখি। শেষ চাপের ৩০০ms পরেই কেবল call যায়।\",say:\"Closure মানে function তার বাইরের variable মনে রাখে, outer function শেষ হলেও। Private state বা debounce বানাতে কাজে লাগে। var function scope, let/const block scope, আর arrow function-এর নিজের this নেই।\",hook:\"\u003cb>Closure = ব্যাকপ্যাক:\u003c/b> function বাইরের variable সাথে নিয়ে ঘোরে।\",\n  b:[\"Function বাইরের variable মনে রাখে।\",\"Private state বানানো যায়।\",\"var = function scope, hoist হয়।\",\"let/const = block scope, TDZ।\",\"Arrow function-এর নিজের this নেই, বাইরেরটা নেয়।\"],\n  c:`function counter() {\n  let count = 0;\n  return () => ++count;\n}\nconst c = counter();\nc(); c(); // 2`},\n {t:\"TypeScript\",a:\"ts\",ex:\"Payment gateway-র response-এ amount কখনো string, কখনো number আসত। Zod দিয়ে parse করায় ভুল data DB-তে ঢোকার আগেই ধরা পড়ে।\",say:\"TypeScript compile time-এ type error ধরে। কিন্তু runtime-এ type থাকে না, তাই API data Zod দিয়ে validate করি। any-র বদলে unknown আর narrowing use করি।\",hook:\"\u003cb>any = seatbelt খুলে ফেলো। unknown = আগে check করো।\u003c/b>\",\n  b:[\"Compile time-এ ভুল ধরে।\",\"Runtime-এ type নেই → API data validate (Zod)।\",\"any না, unknown + narrowing।\",\"Generics = বারবার ব্যবহারযোগ্য type।\",\"Partial, Pick, Omit কাজে লাগে।\"],\n  c:`const User = z.object({ id: z.number(), email: z.string().email() });\ntype User = z.infer\u003ctypeof User>;\nfunction first\u003cT>(arr: T[]): T | undefined { return arr[0]; }`},\n {t:\"Go Concurrency\",a:\"go\",ex:\"১০০টা product-এর price ৩টা supplier API থেকে আনতে হবে। Goroutine দিয়ে একসাথে call করি আর context timeout ২ সেকেন্ড দিই, তাই ৬ সেকেন্ডের কাজ ২ সেকেন্ডে শেষ।\",say:\"Goroutine খুব হালকা thread, Go runtime চালায়। Channel দিয়ে data পাঠাই, WaitGroup দিয়ে সবার শেষ হওয়ার অপেক্ষা করি, context দিয়ে timeout আর cancel। Worker pool দিয়ে goroutine সংখ্যা limit করি।\",hook:\"\u003cb>Goroutine = হালকা কর্মী, Channel = পাইপ, Context = 'থামো' বাঁশি, WaitGroup = হাজিরা খাতা।\u003c/b>\",\n  b:[\"go f() → নতুন goroutine, খুব হালকা।\",\"Channel দিয়ে data পাঠাও।\",\"WaitGroup: সব শেষ হওয়ার অপেক্ষা।\",\"Context: timeout / cancel।\",\"Goroutine leak করো না। go test -race।\"],\n  c:`var wg sync.WaitGroup\nfor _, url := range urls {\n    wg.Add(1)\n    go func(u string) {\n        defer wg.Done()\n        fetch(ctx, u)\n    }(url)\n}\nwg.Wait()`}\n]},\n{id:\"sd\",name:\"System Design ও File Handling\",items:[\n {t:\"System Design Framework\",a:\"sd\",ex:\"“Design WhatsApp” এলে আগে জিজ্ঞেস করি: ১:১ নাকি group, কত DAU, message কতদিন রাখব। তারপর WebSocket gateway, message queue, Cassandra, আর trade-off বলি।\",say:\"আগে requirement আর scale clear করি। তারপর API, data model, high-level diagram। শেষে bottleneck আর trade-off বলি।\",hook:\"\u003cb>R-S-A-D-H-B-T:\u003c/b> Requirement → Scale → API → Data → High-level → Bottleneck → Trade-off।\",\n  b:[\"আগে প্রশ্ন করো, design পরে।\",\"কত user? Read বেশি না write?\",\"API endpoint লেখো।\",\"Table / data model।\",\"Box diagram। তারপর bottleneck।\",\"Trade-off বলো: 'এটা নিলে ওটা হারাই'।\"],\n  c:`POST /orders        {items}  → 201 {id}\nGET  /orders/:id             → 200 {order}\norders(id, user_id, status, total, created_at)`},\n {t:\"Email Campaign (১০ লাখ user)\",a:\"email\",ex:\"Black Friday-তে ১০ লাখ email পাঠাতে হবে আর SES limit ১৪/সেকেন্ড। ১০০০ করে batch করে BullMQ-তে দিলাম, worker rate limit মেনে পাঠায়, bounce হলে webhook-এ আপডেট হয়।\",say:\"Campaign create আর send আলাদা রাখি। Audience batch করে queue-তে দিই, jobId দিয়ে duplicate আটকাই। Worker provider-এর rate limit মানে, fail হলে retry, শেষে DLQ, আর webhook দিয়ে status update হয়।\",hook:\"\u003cb>বিয়ের দাওয়াত কার্ড:\u003c/b> ১০০ করে → queue → worker → fail = retry → বারবার = DLQ।\",\n  b:[\"Create আর send আলাদা।\",\"Audience batch করে queue-তে।\",\"Worker provider-এর rate limit মানে।\",\"আগে unsubscribe check।\",\"Idempotency key: একজন ২ বার পাবে না।\",\"Webhook দিয়ে delivered / bounce।\"],\n  c:`for await (const batch of audienceBatches(campaignId, 1000)) {\n  await queue.addBulk(batch.map(u => ({\n    name: 'send', data: { campaignId, userId: u.id },\n    opts: { jobId: campaignId + ':' + u.id } // duplicate হবে না\n  })));\n}`},\n {t:\"Rate Limiter\",a:\"rate\",ex:\"OTP API-তে কেউ bot দিয়ে প্রতি সেকেন্ডে ১০০০ request দিচ্ছিল। Redis-এ phone অনুযায়ী ৩ বার/মিনিট limit দিলাম, বাকিগুলো 429 পায়, SMS খরচ বাঁচে।\",say:\"Redis-এ user বা IP অনুযায়ী counter রাখি, INCR আর EXPIRE দিয়ে atomic। Token bucket burst allow করে। Limit পার হলে 429 আর Retry-After header দিই।\",hook:\"\u003cb>Token Bucket = বালতিতে coin, প্রতি request-এ ১ coin।\u003c/b> Limit পার = \u003cb>429\u003c/b>।\",\n  b:[\"Key: IP / user / API key।\",\"Counter Redis-এ (সব server share করে)।\",\"INCR + EXPIRE, atomic।\",\"Limit পার → 429 + Retry-After।\",\"Algo: Fixed, Sliding, Token bucket।\"],\n  c:`const key = 'rl:' + ip + ':' + Math.floor(Date.now() / 60000);\nconst n = await redis.incr(key);\nif (n === 1) await redis.expire(key, 60);\nif (n > 100) return res.status(429).set('Retry-After', '60').end();`},\n {t:\"URL Shortener\",a:\"url\",ex:\"bit.ly-র মতো: ১০ কোটি link, read অনেক বেশি। ৭ অক্ষরের Base62 code (৬২^৭ ≈ ৩.৫ trillion) আর Redis cache-এ জনপ্রিয় link, তাই redirect ৫ms-এর নিচে।\",say:\"Long URL validate করে Base62-এ ছোট code বানাই, DB-তে unique constraint। Redirect-এ আগে Redis, না পেলে DB, তারপর 302। Click count queue-তে পাঠাই যাতে redirect slow না হয়।\",hook:\"\u003cb>লম্বা URL → ছোট code → DB।\u003c/b> Redirect-এ \u003cb>আগে cache\u003c/b>।\",\n  b:[\"URL validate করো।\",\"Unique code (Base62, ৭ char)।\",\"Collision → unique constraint, আবার try।\",\"Redirect: আগে Redis, তারপর DB।\",\"Click count queue-তে, redirect slow হবে না।\"],\n  c:`app.get('/:code', async (req, res) => {\n  let url = await redis.get('u:' + req.params.code);\n  if (!url) url = await db.findUrl(req.params.code);\n  if (!url) return res.sendStatus(404);\n  queue.add('click', { code: req.params.code });\n  res.redirect(302, url);\n});`},\n {t:\"বড় File Upload (2 GB)\",a:\"upload\",ex:\"Course platform-এ teacher 2GB video upload করে। API শুধু pre-signed URL দেয়, video সরাসরি S3-এ যায়, শেষে worker HLS-এ convert করে।\",say:\"বড় file backend-এর memory দিয়ে নিই না। Backend একটা short-lived signed URL দেয়, client সরাসরি S3 বা GCS-এ multipart upload করে। Upload শেষে worker scan বা validate করে।\",hook:\"\u003cb>Furniture lift দিয়ে না, সরাসরি truck-এ:\u003c/b> backend শুধু \u003cb>Signed URL\u003c/b> দেয়।\",\n  b:[\"2GB server memory-তে না।\",\"Backend → অল্প মেয়াদের signed URL।\",\"Client সরাসরি S3/GCS-এ পাঠায়।\",\"বড় হলে → multipart / resumable।\",\"Upload শেষ → worker scan / validate।\"],\n  c:`const url = await getSignedUrl(s3,\n  new PutObjectCommand({ Bucket: 'uploads', Key: key, ContentType: type }),\n  { expiresIn: 600 });\nres.json({ url, key });`}\n]},\n{id:\"tools\",name:\"Tools ও Engineering Practice\",items:[\n {t:\"RabbitMQ\",a:\"rabbit\",ex:\"Order হলে 'order.created' publish করি। Topic exchange এটা email queue, SMS queue আর analytics queue তিন জায়গায় পাঠায়, প্রত্যেকে নিজের মতো consume করে।\",say:\"Producer exchange-এ message দেয়, exchange routing key দেখে queue-তে পাঠায়। Consumer কাজ শেষে ACK দেয়, না দিলে message আবার আসে। Durable queue, prefetch আর DLX use করি।\",hook:\"\u003cb>Post office:\u003c/b> Producer → Exchange → Binding → Queue → Consumer → \u003cb>ACK\u003c/b>।\",\n  b:[\"Producer সরাসরি queue-তে না, exchange-এ দেয়।\",\"Exchange routing key দেখে queue-তে পাঠায়।\",\"Types: direct, topic, fanout।\",\"Consumer কাজ শেষে ACK দেয়। না দিলে আবার আসে।\",\"prefetch = একবারে কয়টা। Fail → DLX।\"],\n  c:`ch.assertQueue('emails', { durable: true });\nch.prefetch(10);\nch.consume('emails', async msg => {\n  await send(JSON.parse(msg.content));\n  ch.ack(msg);\n});`},\n {t:\"BullMQ\",a:\"bull\",ex:\"Signup-এর পর welcome email request-এর ভেতরে পাঠালে response ২ সেকেন্ড দেরি হয়। BullMQ-তে job দিয়ে সাথে সাথে 201 দিই, SMTP fail করলে ৩ বার retry হয়।\",say:\"BullMQ হলো Redis-এর উপর Node.js-এর job queue। Delay, retry, exponential backoff, repeat job আর concurrency দেয়। Job handler idempotent রাখি।\",hook:\"\u003cb>Redis-এর উপর job queue।\u003c/b> Delay, Retry, Backoff, Repeat, Concurrency।\",\n  b:[\"Node.js-এর background job।\",\"Job থাকে Redis-এ।\",\"Delay: ১০ মিনিট পরে চালাও।\",\"Fail → retry + exponential backoff।\",\"Worker-এর concurrency set করো।\"],\n  c:`await queue.add('report', { id }, {\n  attempts: 3, backoff: { type: 'exponential', delay: 2000 }\n});\nnew Worker('reports', async job => build(job.data.id),\n  { connection, concurrency: 5 });`},\n {t:\"ORM, Migration, Stored Procedure\",a:\"orm\",ex:\"name column ভেঙে first_name, last_name করার সময় সরাসরি rename করলে পুরনো pod crash করবে। তাই expand-contract: আগে নতুন column, data copy, deploy, তারপর পুরনোটা drop।\",say:\"ORM দ্রুত develop করতে দেয়, কিন্তু generated SQL দেখি N+1-এর জন্য। Migration হলো DB-র version control। Production-এ expand-contract: আগে add, data copy, code switch, তারপর drop।\",hook:\"\u003cb>ORM = অনুবাদক।\u003c/b> \u003cb>Migration = DB-র git history।\u003c/b> Expand → Migrate → Switch → Contract।\",\n  b:[\"ORM দিয়ে দ্রুত লেখা যায়, কিন্তু SQL দেখো (N+1)।\",\"জটিল report → raw SQL / SP।\",\"Migration file git-এ।\",\"Production-এ সরাসরি column drop না।\",\"আগে add, data copy, code switch, পরে drop।\"],\n  c:`-- 001_expand.sql\nALTER TABLE users ADD COLUMN full_name VARCHAR(200);\nUPDATE users SET full_name = CONCAT(first, ' ', last);\n-- code deploy, তারপর 002_contract.sql\nALTER TABLE users DROP COLUMN first, DROP COLUMN last;`},\n {t:\"Express Middleware & Axios\",a:\"mw\",ex:\"আমাদের Express-এ requestId → logger → auth → zod validate → handler। সব error এক error middleware-এ যায়, যেটা একই JSON format-এ উত্তর দেয় আর Sentry-তে পাঠায়।\",say:\"Middleware হলো (req, res, next) function, chain হয়ে চলে: logger, auth, validate, তারপর handler। Error middleware-এর ৪টা argument, সবার শেষে থাকে। Axios-এ timeout দিই, আর retry শুধু idempotent request-এ।\",hook:\"\u003cb>Airport security line:\u003c/b> (req,res,next)। Error gate \u003cb>সবার শেষে\u003c/b>, ৪টা argument।\",\n  b:[\"Middleware = (req, res, next)।\",\"কাজ শেষে next()। না দিলে আটকে থাকে।\",\"Auth, log, validate middleware-এ।\",\"Error handler ৪ arg, সবার শেষে।\",\"Axios: timeout দাও। Retry শুধু GET / idempotent-এ।\"],\n  c:`const auth = (req, res, next) => {\n  if (!req.headers.authorization) return res.sendStatus(401);\n  next();\n};\napp.use((err, req, res, next) => res.status(500).json({ error: err.message }));\nconst http = axios.create({ timeout: 5000 });`},\n {t:\"Webhook\",a:\"hook\",ex:\"Stripe payment success webhook একই event দুবার পাঠাল। event.id DB-তে save করছিলাম, তাই দ্বিতীয়বার skip হলো, order দুবার confirm হয়নি।\",say:\"Webhook-এ আগে HMAC signature verify করি। দ্রুত 200 দিই, ভারী কাজ queue-তে পাঠাই। Event ID save করে duplicate skip করি।\",hook:\"\u003cb>Courier তোমার বাসায় আসে।\u003c/b> Signature check, দ্রুত 200, কাজ queue-তে, \u003cb>event ID দিয়ে duplicate আটকাও\u003c/b>।\",\n  b:[\"অন্য service তোমাকে POST করে।\",\"আগে HMAC signature check।\",\"দ্রুত 200 দাও, না হলে retry পাঠাবে।\",\"ভারী কাজ queue-তে।\",\"Event ID save → duplicate skip।\"],\n  c:`const sig = crypto.createHmac('sha256', SECRET).update(rawBody).digest('hex');\nif (!crypto.timingSafeEqual(Buffer.from(sig), Buffer.from(req.get('X-Sig'))))\n  return res.sendStatus(401);\nres.sendStatus(200);\nqueue.add('webhook', JSON.parse(rawBody));`}\n]},\n{id:\"trace\",name:\"Tracing ও Optimization\",items:[\n {t:\"Trace ID & Span ID\",a:\"trace\",ex:\"Checkout API ১.৫ সেকেন্ড নিচ্ছিল। Jaeger-এ trace দেখে দেখি shipping-rate external call একাই ১.২ সেকেন্ড। ওটা cache করলাম, এখন ৩০০ms।\",say:\"Trace ID পুরো request journey, আর প্রতিটা DB বা HTTP call একটা span। traceparent header দিয়ে service থেকে service-এ যায়। OpenTelemetry দিয়ে collect করে সবচেয়ে লম্বা span-এ bottleneck খুঁজি।\",hook:\"\u003cb>Parcel tracking number = Trace ID।\u003c/b> \u003cb>প্রতিটা stop = Span ID।\u003c/b>\",\n  b:[\"এক request = এক trace ID।\",\"প্রতিটা কাজ (DB, HTTP) = এক span।\",\"Header-এ pass হয়: traceparent।\",\"Log-এ trace ID রাখো → খুঁজে পাওয়া সহজ।\",\"OpenTelemetry → Jaeger / Tempo।\"],\n  c:`traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01\n//            ver  trace-id (32 hex)                span-id (16)   sampled\nlogger.info({ traceId, userId }, 'order created');`},\n {t:\"Optimization Mantra\",a:\"opt\",ex:\"Dashboard API p95 900ms ছিল। Trace-এ দেখলাম ৩টা query একটার পর একটা চলছে। Promise.all আর একটা missing index দেওয়ার পর p95 120ms।\",say:\"আগে মাপি: latency, throughput, error rate। Trace দেখে বড় bottleneck ধরি। Cache, index, batch, queue বা Promise.all দিয়ে fix করে আবার মাপি।\",hook:\"\u003cb>মাপো → Trace → বড় bottleneck → Fix → আবার মাপো।\u003c/b>\",\n  b:[\"আন্দাজে fix না, data দিয়ে।\",\"আগে বড় bottleneck।\",\"অস্ত্র: cache, index, batch, queue।\",\"আলাদা আলাদা call → Promise.all।\",\"Connection pool ঠিক করো।\"],\n  c:`// একটার পর একটা ~600ms ✗\nconst u = await getUser(); const o = await getOrders();\n// একসাথে ~300ms ✓\nconst [u2, o2] = await Promise.all([getUser(), getOrders()]);`}\n]},\n{id:\"code\",name:\"Coding Interview\",items:[\n {t:\"Coding Patterns\",a:\"code\",ex:\"Two Sum-এ বলি: brute force দুই loop, O(n²)। তারপর HashMap-এ আগের সংখ্যা রাখলে এক loop-এ হয়, O(n) time, O(n) space।\",say:\"আগে প্রশ্ন clear করি আর edge case জিজ্ঞেস করি। Brute force বলি, তারপর pattern চিনে optimize করি। ছোট example-এ dry run করে time আর space complexity বলি।\",hook:\"\u003cb>আগে Brute force বলো, তারপর Optimize।\u003c/b> Pair → HashMap। Sorted → Two Pointer। Subarray → Sliding Window।\",\n  b:[\"প্রশ্ন clear করো, edge case জিজ্ঞেস করো।\",\"Brute force বলো + Big-O।\",\"Pattern চেনো, optimize করো।\",\"ছোট example-এ dry run।\",\"Time + space complexity বলো।\"],\n  c:`// Two Sum: O(n)\nfunction twoSum(nums, target) {\n  const seen = new Map();\n  for (let i = 0; i \u003c nums.length; i++) {\n    const need = target - nums[i];\n    if (seen.has(need)) return [seen.get(need), i];\n    seen.set(nums[i], i);\n  }\n}`}\n]}\n];\n\nconst esc=s=>s.replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\");\nconst hl=s=>esc(s).split(\"\\n\").map(l=>l.replace(/(\\/\\/.*|--.*|#.*)$/,'\u003cspan class=\"cm\">$1\u003c/span>')).join(\"\\n\");\nconst KEY=\"bir-done\";\nlet done={};try{done=JSON.parse(localStorage.getItem(KEY)||\"{}\")}catch(e){}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};\nconst bn=n=>String(n).replace(/\\d/g,d=>\"০১২৩৪৫৬৭৮৯\"[d]);\nlet filter=\"all\";\nconst total=parts.reduce((a,p)=>a+p.items.length,0);\nfunction render(){\n  const cnt=Object.values(done).filter(Boolean).length;\n  document.getElementById(\"bar\").innerHTML=[[\"all\",\"সব\"],...parts.map(p=>[p.id,p.s||p.name.split(\" ও \")[0].split(\",\")[0]])]\n    .map(([id,l])=>`\u003cbutton aria-pressed=\"${filter===id}\" data-f=\"${id}\">${l}\u003c/button>`).join(\"\")\n    +`\u003cspan class=\"progress\">${bn(cnt)}/${bn(total)} শেষ\u003c/span>`;\n  let n=0;\n  document.getElementById(\"list\").innerHTML=parts.map(p=>{\n    const cards=p.items.map((it,i)=>{n++;const k=p.id+\"-\"+i;const d=!!done[k];\n      return `\u003carticle class=\"card${d?\" done\":\"\"}\" id=\"q-${k}\">\n        \u003cdiv class=\"top\">\u003ch3>\u003cspan class=\"n\">${bn(n)}\u003c/span>${it.t}\u003c/h3>\n        \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" id=\"c-${k}\" data-k=\"${k}\" ${d?\"checked\":\"\"}>Done\u003c/label>\u003c/div>\n        ${it.say?`\u003cdiv class=\"say\">\u003cb>🎤 Interview-এ এভাবে বলো\u003c/b>\u003cp>${it.say}\u003c/p>${it.ex?`\u003cp class=\"ex\">\u003cb>💡 Example\u003c/b>${it.ex}\u003c/p>`:\"\"}\u003c/div>`:\"\"}\n        \u003cp class=\"hook\">${it.hook}\u003c/p>\n        \u003cdiv class=\"duo${A[it.a]?\"\":\" solo\"}\">\u003cdiv class=\"pics\">${A[it.a]||\"\"}\u003c/div>\n        \u003cul class=\"cave\">${it.b.map(x=>`\u003cli>${x}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>\n        ${it.c?`\u003cpre>\u003ccode>${hl(it.c)}\u003c/code>\u003c/pre>`:\"\"}\u003c/article>`}).join(\"\");\n    return (filter===\"all\"||filter===p.id)?`\u003csection class=\"part\">\u003ch2>\u003csmall>Part\u003c/small>${p.name}\u003c/h2>\u003cdiv class=\"cards\">${cards}\u003c/div>\u003c/section>`:\"\";\n  }).join(\"\");\n  let m=0;\n  document.getElementById(\"side\").innerHTML=`\u003cdiv class=\"sh\">\u003cspan>সব প্রশ্ন · ${bn(cnt)}/${bn(total)} শেষ\u003c/span>\u003cbutton id=\"sideClose\">✕\u003c/button>\u003c/div>`+parts.map(p=>`\u003cdiv class=\"grp\">${p.name}\u003c/div>`+p.items.map((it,i)=>{m++;const k=p.id+\"-\"+i;\n    return `\u003ca href=\"#q-${k}\" data-go=\"${k}\" data-p=\"${p.id}\">\u003cspan class=\"sn2\">${bn(m)}\u003c/span>\u003cspan>${it.t}\u003c/span>${done[k]?'\u003cspan class=\"ok\">✓\u003c/span>':\"\u003cspan>\u003c/span>\"}\u003c/a>`}).join(\"\")).join(\"\");\n  spy();\n}\nlet io;\nfunction spy(){try{io&&io.disconnect();io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const k=e.target.id.slice(2);document.querySelectorAll(\"#side a\").forEach(a=>a.classList.toggle(\"on\",a.dataset.go===k));}});},{rootMargin:\"-80px 0px -60% 0px\"});document.querySelectorAll(\".card[id]\").forEach(c=>io.observe(c));}catch(e){}}\ndocument.addEventListener(\"click\",e=>{\n  const a=e.target.closest(\"#side a[data-go]\");\n  if(a){e.preventDefault();if(filter!==\"all\"&&filter!==a.dataset.p){filter=\"all\";render();}\n    const el=document.getElementById(\"q-\"+a.dataset.go);if(el)el.scrollIntoView({behavior:\"smooth\",block:\"start\"});\n    document.getElementById(\"side\").classList.remove(\"open\");return;}\n  if(e.target.closest(\"#sideBtn\")){document.getElementById(\"side\").classList.add(\"open\");return;}\n  if(e.target.closest(\"#sideClose\")){document.getElementById(\"side\").classList.remove(\"open\");}\n});\ndocument.addEventListener(\"click\",e=>{const b=e.target.closest(\"[data-f]\");if(b){filter=b.dataset.f;render();}});\ndocument.addEventListener(\"change\",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){done[k]=e.target.checked;save();render();}});\nrender();\n\u003c/script>\n\u003c/body>\u003c/html>", "sd": "\u003c!doctype html>\u003chtml lang=\"bn\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}\u003c/style>\u003c/head>\u003cbody>\u003ctitle>System Design Caveman\u003c/title>\n\u003cmeta name=\"claude:viewport-fit-sides\" content=\"cover\">\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap\">\n\u003cstyle>\n/* Layout: one column of topic cards grouped by Part; each card = trick → animation → caveman bullets → code */\n:root{\n  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202c; --muted:#5b6778; --line:#dde3ea;\n  --accent:#d9342b; --accent-soft:#fde8e6; --ok:#1f8a5b; --ok-soft:#e1f4eb; --chip:#eef1f6;\n  --blue:#2f6fdb; --amber:#d98a00; --codebg:#0f1720; --codefg:#e3e9f0;\n  --display:\"Anek Bangla\",\"Hind Siliguri\",\"Noto Sans Bengali\",system-ui,sans-serif;\n  --body:\"Hind Siliguri\",\"Noto Sans Bengali\",system-ui,sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,Menlo,monospace;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f141b; --surface:#171e28; --fg:#e7ecf2; --muted:#9aa6b6; --line:#273241;\n  --accent:#ff5a4f; --accent-soft:#3a1d1c; --ok:#4cc38a; --ok-soft:#163327; --chip:#1f2835;\n  --blue:#6a9cff; --amber:#f0b03a; --codebg:#0a0f15; --codefg:#e3e9f0; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0f141b; --surface:#171e28; --fg:#e7ecf2; --muted:#9aa6b6; --line:#273241;\n  --accent:#ff5a4f; --accent-soft:#3a1d1c; --ok:#4cc38a; --ok-soft:#163327; --chip:#1f2835;\n  --blue:#6a9cff; --amber:#f0b03a; --codebg:#0a0f15; --codefg:#e3e9f0; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}\n.wrap{max-width:1240px;margin:0 auto}\n.layout{display:grid;gap:24px;align-items:start}\n.card{scroll-margin-top:16px}\n#side{font-size:14px}\n#side .sh{font:700 15px var(--display);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}\n#side .sh button{display:none;font:600 13px var(--body);background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:2px 10px;cursor:pointer}\n#side .grp{font:600 11px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}\n#side a{display:grid;grid-template-columns:26px 1fr auto;gap:4px;align-items:baseline;padding:5px 8px;border-radius:6px;color:var(--fg);text-decoration:none;line-height:1.35}\n#side a:hover{background:var(--chip)}\n#side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}\n#side a .sn2{font:500 12px var(--mono);color:var(--muted)}\n#side a .ok{color:var(--ok);font-size:12px}\n#side a:focus-visible,#sideBtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n#sideBtn{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;font:700 14px var(--body);background:var(--fg);color:var(--bg);border:none;border-radius:999px;padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}\n@media (min-width:700px){.layout{grid-template-columns:clamp(220px,26vw,300px) minmax(0,1fr)}#side{order:-1;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px;margin-top:26px}#sideBtn{display:none}}\n@media (max-width:699px){#side{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);z-index:30;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .25s}#side.open{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.3)}#side .sh button{display:inline-block}}\nheader{padding-block:28px 14px}\nh1{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,42px);line-height:1.15;margin:0 0 6px;text-wrap:balance}\nh1 .play{display:inline-grid;place-items:center;width:1.05em;height:.75em;border-radius:.2em;background:var(--accent);color:#fff;font-size:.8em;vertical-align:.05em;margin-right:.25em}\n.lede{color:var(--muted);margin:0;max-width:62ch}\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}\nbody::before{c =n*H+(n-1)*G+8;let s=\"\";\n  arr.forEach(([t,sub,k=\"b\",e],i)=>{\n    const top=4+i*(H+G),cy=top+H/2;\n    s+=`\u003crect class=\"sb k-${k}\" x=\"8\" y=\"${top}\" width=\"${bw}\" height=\"${H}\" rx=\"9\" style=\"animation-duration:${T}s;animation-delay:${(i*1.2).toFixed(1)}s\"/>`;\n    s+=`\u003ccircle class=\"sn k-${k}\" cx=\"30\" cy=\"${cy}\" r=\"12\"/>\u003ctext class=\"snt\" x=\"30\" y=\"${cy+4.5}\">${i+1}\u003c/text>`;\n    s+=`\u003ctext class=\"st\" x=\"52\" y=\"${top+20}\">${t}\u003c/text>`;\n    if(sub)s+=`\u003ctext class=\"ss\" x=\"52\" y=\"${top+38}\">${sub}\u003c/text>`;\n    if(i\u003cn-1){const x=8+bw/2;s+=`\u003cline class=\"sa\" x1=\"${x}\" y1=\"${top+H+1}\" x2=\"${x}\" y2=\"${top+H+G-4}\" marker-end=\"url(#${id})\"/>`;\n      if(e)s+=`\u003ctext class=\"se\" x=\"${x+10}\" y=\"${top+H+G/2+4}\">${e}\u003c/text>`;}\n  });\n  let leg=o.leg||\"\";\n  if(o.back){const [f,t,l]=o.back,yf=4+f*(H+G)+H/2,yt=4+t*(H+G)+H/2,x0=8+bw;\n    s+=`\u003cpath class=\"sback\" d=\"M${x0} ${yf} H${x0+30} V${yt} H${x0+6}\" marker-end=\"url(#${id}r)\"/>`;\n    leg=`\u003cb class=\"bk\">↩ ${l}\u003c/b>`+(leg?\" · \"+leg:\"\");}\n  return `\u003cdiv class=\"anim\">\u003cdiv class=\"cap\">${cap}\u003c/div>\u003csvg class=\"dg\" viewBox=\"0 0 ${W} ${h}\" role=\"img\" aria-label=\"${cap}\">\n  \u003cdefs>\u003cmarker id=\"${id}\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\u003cpath class=\"mh\" d=\"M0 0L10 5L0 10z\"/>\u003c/marker>\n  \u003cmarker id=\"${id}r\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\u003cpath class=\"mhr\" d=\"M0 0L10 5L0 10z\"/>\u003c/marker>\u003c/defs>${s}\u003c/svg>${leg?`\u003cdiv class=\"legend\">${leg}\u003c/div>`:\"\"}\u003c/div>`;\n};\n/* lanes: timeline bars with labels. seg = [left%, width%, colorClass, delay, label] */\nconst lanes=(cap,rows,leg)=>`\u003cdiv class=\"anim\">\u003cdiv class=\"cap\">${cap}\u003c/div>\u003cdiv class=\"lanes\">${rows.map(([l,segs])=>`\u003cdiv class=\"lane\">\u003cspan>${l}\u003c/span>\u003cdiv class=\"rail\">${segs.map(([a,w,c,d,t])=>`\u003cdiv class=\"seg ${c}\" style=\"left:${a}%;width:${w}%;animation-delay:${d||0}s\">${t?`\u003cb>${t}\u003c/b>`:\"\"}\u003c/div>`).join(\"\")}\u003c/div>\u003c/div>`).join(\"\")}\u003c/div>${leg?`\u003cdiv class=\"legend\">${leg}\u003c/div>`:\"\"}\u003c/div>`;\n\n\nconst S=steps;\nconst parts=[];\nfunction P(id,name,items){parts.push({id,name,items});}\nfunction T(t,hook,b,say,ex,pic,code){return {t,hook,b,say,ex,pic:pic||\"\",c:code||\"\"};}\nP(\"intro\",\"System Design পরিচিতি\",[\nT(\"System Design কী?\",\"\u003cb>বাড়ির নকশা:\u003c/b> ইট গাঁথার আগে ঠিক করো কয়টা ঘর, কোথায় পানি, কোথায় সিঁড়ি।\",\n[\"অনেক user-এর জন্য software-এর কাঠামো ঠিক করা।\",\"কোন অংশ (API, DB, cache, queue) থাকবে, কীভাবে কথা বলবে।\",\"লক্ষ্য: scale, fast, available, reliable, কম খরচ।\",\"সবসময় trade-off: সব একসাথে পাওয়া যায় না।\"],\n\"System design মানে requirement অনুযায়ী এমন কাঠামো বানানো যেটা অনেক user সামলাতে পারে, দ্রুত চলে আর fail হলেও টিকে থাকে। এখানে সঠিক উত্তর একটা না, trade-off বুঝিয়ে বলাই আসল।\",\"ইনস্টাগ্রাম বানাতে হলে ঠিক করি: ছবি S3-এ, metadata DB-তে, feed cache-এ, notification queue দিয়ে।\",\nS(\"Interview flow\",[[\"Requirement\",\"কী feature, কী না\",\"b\"],[\"Scale estimate\",\"DAU, RPS, storage\",\"b\"],[\"API + Data model\",\"\",\"a\"],[\"High-level design\",\"LB → API → Cache → DB\",\"a\"],[\"Deep dive + Trade-off\",\"bottleneck কোথায়\",\"g\"]])),\nT(\"৩০টা জরুরি Concept\",\"\u003cb>বর্ণমালা আগে, কবিতা পরে।\u003c/b> এই concept গুলো জানলে যেকোনো design জোড়া লাগানো যায়।\",\n[\"Scale: vertical, horizontal, LB, cache, CDN।\",\"Data: SQL/NoSQL, index, replication, sharding, partition।\",\"যোগাযোগ: REST, gRPC, queue, pub/sub, websocket।\",\"নির্ভরযোগ্যতা: replica, failover, circuit breaker, rate limit।\",\"তত্ত্ব: CAP, consistency model, consistent hashing।\"],\n\"আমি system design-কে কয়েকটা building block হিসেবে দেখি: load balancer, cache, database, queue, CDN। প্রশ্ন এলে এগুলো জোড়া লাগিয়ে requirement মেটাই আর প্রতিটা বাছাইয়ের কারণ বলি।\",\"URL shortener: LB + stateless API + Redis cache + DB + Base62 code — সবই এই concept থেকে।\")\n]);\n\nP(\"core\",\"Core Concepts\",[\nT(\"Scalability\",\"\u003cb>দোকানে ভিড় বাড়লে:\u003c/b> বড় দোকান নাও (vertical) বা নতুন শাখা খোলো (horizontal)।\",\n[\"Load বাড়লেও performance ঠিক রাখার ক্ষমতা।\",\"Vertical = বড় machine, সহজ কিন্তু limit আছে।\",\"Horizontal = বেশি machine + LB, প্রায় সীমাহীন।\",\"Horizontal-এর শর্ত: app stateless।\",\"Bottleneck মাপো, তারপর scale।\"],\n\"Scalability মানে traffic বা data বাড়লেও system ঠিকমতো চলা। Vertical-এ machine বড় করি, horizontal-এ machine বাড়াই load balancer-এর পিছনে। আমি app stateless রাখি যাতে horizontal সহজ হয়।\",\"Sale-এ traffic ১০ গুণ হলে pod ২ থেকে ২০ করা।\",\nS(\"Scale ধাপ\",[[\"১ server\",\"\",\"b\"],[\"Vertical\",\"বড় CPU/RAM\",\"b\"],[\"Horizontal + LB\",\"stateless app\",\"a\"],[\"Cache + Replica\",\"\",\"a\"],[\"Sharding\",\"শেষে\",\"y\"]])),\nT(\"Availability\",\"\u003cb>দোকান কত সময় খোলা থাকে।\u003c/b> 99.9% = বছরে ~৮.৭ ঘণ্টা বন্ধ।\",\n[\"Availability = uptime / মোট সময়।\",\"99.9% (three nines) ≈ ৮.৭ ঘণ্টা/বছর down।\",\"99.99% ≈ ৫২ মিনিট/বছর।\",\"উপায়: redundancy, failover, multi-AZ, health check।\",\"Series-এ যুক্ত হলে availability গুণ হয়ে কমে।\"],\n\"Availability মানে system কত শতাংশ সময় চালু থাকে। বাড়াতে redundancy রাখি, health check দিয়ে খারাপ node বাদ দিই, আর একাধিক zone-এ deploy করি।\",\"দুটো 99.9% service series-এ থাকলে মোট ≈ 99.8%।\"),\nT(\"Reliability\",\"\u003cb>দোকান খোলা তো আছে, কিন্তু ঠিক জিনিস দেয় তো?\u003c/b> Available ≠ Reliable।\",\n[\"Reliability = ঠিকঠাক কাজ করা, ভুল ফল না দেওয়া।\",\"Available কিন্তু ভুল data দিলে reliable না।\",\"মাপ: MTBF (fail-এর মাঝে সময়), MTTR (ঠিক হতে সময়)।\",\"উপায়: test, retry, idempotency, backup, monitoring।\"],\n\"Reliability মানে system শুধু চালু না, সঠিকভাবে কাজ করে। Availability চালু থাকা মাপে, reliability সঠিকতা মাপে। Retry, idempotency আর ভালো test দিয়ে reliability বাড়াই।\",\"Payment API চালু আছে কিন্তু দুবার টাকা কাটে — available, কিন্তু reliable না।\"),\nT(\"Single Point of Failure (SPOF)\",\"\u003cb>একটা খুঁটির উপর পুরো ঘর।\u003c/b> খুঁটি ভাঙলে সব শেষ।\",\n[\"যে একটা অংশ পড়লে পুরো system পড়ে।\",\"উদাহরণ: ১টা DB, ১টা LB, ১টা server।\",\"সমাধান: redundancy (২+ copy), failover।\",\"LB-ও ২টা রাখো (active-passive)।\",\"DB: primary + replica + auto failover।\"],\n\"SPOF হলো এমন একটা component যেটা fail করলে পুরো system বন্ধ। আমি প্রতিটা স্তরে অন্তত দুটো copy রাখি আর automatic failover দিই।\",\"একটাই DB server থাকলে সেটা SPOF; replica + failover দিলে সমাধান।\",\nS(\"SPOF সরাও\",[[\"LB ×2\",\"active + standby\",\"y\"],[\"App ×3\",\"\",\"b\"],[\"DB primary + replica\",\"auto failover\",\"g\"]])),\nT(\"Latency vs Throughput vs Bandwidth\",\"\u003cb>রাস্তা:\u003c/b> Latency = এক গাড়ির সময়, Throughput = ঘণ্টায় কত গাড়ি, Bandwidth = রাস্তা কত চওড়া।\",\n[\"Latency: এক request-এর সময় (ms)।\",\"Throughput: প্রতি সেকেন্ডে কত কাজ (RPS)।\",\"Bandwidth: সর্বোচ্চ data capacity (Mbps)।\",\"Throughput ≤ Bandwidth।\",\"p95/p99 latency দেখো, average না।\"],\n\"Latency হলো একটা request-এ কত সময় লাগে, throughput হলো সেকেন্ডে কতগুলো request সামলাই, আর bandwidth হলো network-এর সর্বোচ্চ capacity। Batch করলে throughput বাড়ে কিন্তু latency একটু বাড়তে পারে।\",\"Cache দিলে latency 50ms → 2ms; worker বাড়ালে throughput 1k → 5k RPS।\"),\nT(\"Consistent Hashing\",\"\u003cb>গোল ঘড়ি:\u003c/b> server আর key দুটোই ঘড়ির কাঁটায় বসে। Key ঘড়ির দিকে এগিয়ে প্রথম server-এ যায়।\",\n[\"সাধারণ hash % N: server বাড়লে প্রায় সব key সরে যায়।\",\"Consistent hashing: শুধু ~1/N key সরে।\",\"Ring-এ server আর key দুটোই hash হয়।\",\"Virtual node দিলে load সমান ভাগ হয়।\",\"ব্যবহার: distributed cache, DynamoDB, Cassandra।\"],\n\"Consistent hashing-এ server আর key একটা ring-এ বসাই, key ঘড়ির কাঁটার দিকে প্রথম server-এ যায়। Server যোগ বা বাদ দিলে শুধু পাশের key গুলো সরে, সব না। Virtual node দিয়ে load সমান রাখি।\",\"Redis cluster-এ ৪ থেকে ৫ node করলে hash%N-এ ৮০% key সরত, consistent hashing-এ মাত্র ~২০%।\",\nnull,`// সহজ ধারণা\nring = sorted([hash(\"A#1\"), hash(\"A#2\"), hash(\"B#1\"), ...]) // virtual nodes\nnode = ring.find(h => h >= hash(key)) ?? ring[0]           // ঘড়ির কাঁটার দিকে প্রথমটা`),\nT(\"CAP Theorem\",\"\u003cb>৩টার মধ্যে ২টা।\u003c/b> Network ভাঙলে (P) ঠিক করো: সঠিক data (C) নাকি সবসময় উত্তর (A)।\",\n[\"C = Consistency: সবাই সর্বশেষ data দেখে।\",\"A = Availability: সবসময় উত্তর দেয়।\",\"P = Partition tolerance: network ভাঙলেও চলে।\",\"Distributed-এ P বাধ্যতামূলক → CP অথবা AP।\",\"CP: bank, inventory। AP: social feed, like count।\"],\n\"CAP বলে network partition হলে consistency আর availability-র মধ্যে একটা বেছে নিতে হয়। Bank-এর মতো জায়গায় CP নিই, ভুল balance দেখানোর চেয়ে error ভালো। Feed বা like count-এ AP নিই, একটু পুরনো data চললেও সমস্যা নেই।\",\"Cassandra = AP, MongoDB (default) / HBase = CP-ঘেঁষা।\")\n]);\n\nP(\"net\",\"Networking\",[\nT(\"OSI Model\",\"\u003cb>৭ তলা বাড়ি:\u003c/b> Please Do Not Throw Sausage Pizza Away (Physical → Application)।\",\n[\"7 Application: HTTP, DNS।\",\"6 Presentation: encryption, encoding (TLS)।\",\"5 Session: connection রাখা।\",\"4 Transport: TCP/UDP, port।\",\"3 Network: IP, routing। 2 Data link: MAC, switch। 1 Physical: তার, সিগন্যাল।\",\"L4 LB = TCP দেখে, L7 LB = HTTP দেখে।\"],\n\"OSI model network-কে ৭টা layer-এ ভাগ করে, physical থেকে application পর্যন্ত। Backend-এ বেশি লাগে L4 (TCP/UDP) আর L7 (HTTP), যেমন L4 আর L7 load balancer-এর পার্থক্য।\",\"L7 LB URL দেখে /api আর /images আলাদা server-এ পাঠায়; L4 শুধু IP:port দেখে।\"),\nT(\"IP Address\",\"\u003cb>বাড়ির ঠিকানা।\u003c/b> প্রতিটা device-এর network ঠিকানা।\",\n[\"IPv4: 32-bit (192.168.1.10), প্রায় শেষ।\",\"IPv6: 128-bit, অনেক বেশি ঠিকানা।\",\"Private (10.x, 192.168.x) vs Public IP।\",\"NAT: অনেক private IP এক public IP-তে।\",\"Static vs Dynamic (DHCP)।\"],\n\"IP address হলো network-এ device-এর ঠিকানা। Server-এর ভেতরে private IP থাকে, বাইরে public IP বা load balancer দিয়ে expose করি, আর NAT দিয়ে অনেক device এক public IP share করে।\",\"VPC-তে DB-কে শুধু private IP দিই, internet থেকে সরাসরি access নেই।\"),\nT(\"TCP vs UDP\",\"\u003cb>TCP = রেজিস্ট্রি চিঠি\u003c/b> (পৌঁছানো নিশ্চিত, ক্রম ঠিক)। \u003cb>UDP = লিফলেট ছোঁড়া\u003c/b> (দ্রুত, হারাতে পারে)।\",\n[\"TCP: connection (3-way handshake), reliable, ordered।\",\"TCP: retransmit, flow control → একটু slow।\",\"UDP: connection নেই, দ্রুত, হারাতে পারে।\",\"TCP: web, API, DB, email।\",\"UDP: video call, game, DNS, live stream।\"],\n\"TCP নির্ভরযোগ্য আর ক্রম ঠিক রাখে, তাই API আর DB-তে ব্যবহার হয়। UDP দ্রুত কিন্তু packet হারাতে পারে, তাই video call বা game-এ, যেখানে একটু হারানো চলে কিন্তু দেরি চলে না।\",\"Zoom call UDP; bKash API TCP।\"),\nT(\"HTTP/HTTPS\",\"\u003cb>HTTP = খোলা পোস্টকার্ড, HTTPS = খামে ভরা তালা দেওয়া চিঠি।\u003c/b>\",\n[\"HTTP: request/response, stateless।\",\"Method: GET, POST, PUT, PATCH, DELETE।\",\"Status: 2xx ঠিক, 3xx redirect, 4xx client ভুল, 5xx server ভুল।\",\"HTTPS = HTTP + TLS (encrypt + identity)।\",\"HTTP/2: multiplexing; HTTP/3: QUIC (UDP)।\"],\n\"HTTP হলো stateless request-response protocol। HTTPS-এ TLS দিয়ে data encrypt হয় আর certificate দিয়ে server-এর পরিচয় নিশ্চিত হয়। HTTP/2 এক connection-এ অনেক request চালায়।\",\"Login form HTTP-তে হলে password পথেই পড়া যায়; HTTPS-এ যায় না।\"),\nT(\"Domain Name System (DNS)\",\"\u003cb>Phone-এর contact list:\u003c/b> নাম (google.com) দিলে নম্বর (IP) দেয়।\",\n[\"Domain → IP অনুবাদ।\",\"ক্রম: browser cache → OS → resolver → root → TLD (.com) → authoritative।\",\"Record: A (IPv4), AAAA, CNAME (alias), MX (mail), TXT।\",\"TTL: কতক্ষণ cache থাকবে।\",\"DNS দিয়ে load balancing আর failover করা যায়।\"],\n\"DNS domain নামকে IP-তে রূপান্তর করে। Resolver ধাপে ধাপে root, TLD আর authoritative server থেকে উত্তর আনে, আর TTL অনুযায়ী cache করে। কম TTL দিলে failover দ্রুত হয় কিন্তু DNS query বাড়ে।\",\"Server বদলানোর আগে TTL ৩০০s করি, যাতে নতুন IP দ্রুত ছড়ায়।\",\nS(\"DNS lookup\",[[\"Browser / OS cache\",\"\",\"b\",\"miss\"],[\"Resolver (ISP / 8.8.8.8)\",\"\",\"a\"],[\"Root → .com TLD\",\"\",\"y\"],[\"Authoritative NS\",\"A record = IP\",\"g\"]])),\nT(\"Proxy vs Reverse Proxy\",\"\u003cb>Proxy = client-এর উকিল\u003c/b> (server জানে না আসল client কে)। \u003cb>Reverse proxy = server-এর রিসেপশনিস্ট\u003c/b> (client জানে না আসল server কোনটা)।\",\n[\"Forward proxy: client-এর হয়ে যায় (office firewall, VPN)।\",\"Reverse proxy: server-এর সামনে বসে (Nginx)।\",\"Reverse proxy কাজ: LB, SSL termination, cache, compress।\",\"Security: আসল server লুকানো থাকে।\"],\n\"Forward proxy client-এর পক্ষে কাজ করে, যেমন office-এর internet filter। Reverse proxy server-এর সামনে বসে, যেমন Nginx, যেটা load balance, SSL termination আর cache করে।\",\"Nginx 443-এ HTTPS নেয়, ভেতরে Node-এর 3000 port-এ HTTP পাঠায়।\"),\nT(\"Checksums\",\"\u003cb>পার্সেলের ওজন মিলিয়ে দেখা।\u003c/b> পাঠানোর আগে আর পরে hash মিললে data ঠিক আছে।\",\n[\"Data থেকে ছোট একটা মান (hash) বানানো।\",\"Receiver আবার হিসাব করে মিলিয়ে দেখে।\",\"না মিললে data নষ্ট বা বদলানো।\",\"উদাহরণ: CRC32, MD5, SHA-256।\",\"ব্যবহার: file download, TCP, S3 upload, backup।\"],\n\"Checksum দিয়ে দেখি data পথে নষ্ট হয়েছে কিনা। পাঠানোর আগে hash বানাই, পৌঁছে আবার বানিয়ে মিলাই। Security-র জন্য SHA-256-এর মতো cryptographic hash লাগে।\",\"S3-এ upload-এর সময় Content-MD5 দিলে নষ্ট file আটকে যায়।\")\n]);\n\nP(\"lb\",\"Load Balancing\",[\nT(\"Load Balancer কী?\",\"\u003cb>ট্রাফিক পুলিশ:\u003c/b> গাড়ি সব রাস্তায় ভাগ করে, বন্ধ রাস্তায় পাঠায় না।\",\n[\"Traffic অনেক server-এ ভাগ করে।\",\"Health check: খারাপ server বাদ।\",\"L4 (TCP) vs L7 (HTTP, URL দেখে)।\",\"SSL termination করতে পারে।\",\"নিজেই যেন SPOF না হয়, ২টা রাখো।\"],\n\"Load balancer traffic একাধিক server-এ ভাগ করে আর health check দিয়ে খারাপ server বাদ দেয়। এতে scale আর availability দুটোই বাড়ে। L7 LB URL বা header দেখে route করতে পারে।\",\"AWS ALB /api → API pods, /static → CDN origin।\",\nS(\"LB\",[[\"Users\",\"\",\"b\"],[\"Load Balancer\",\"health check\",\"y\"],[\"App 1 / App 2 / App 3\",\"\",\"b\"],[\"DB / Cache\",\"\",\"g\"]])),\nT(\"Load Balancing Algorithms\",\"\u003cb>Round robin = পালা করে, Least connection = যার হাতে কম কাজ, IP hash = একই লোক একই কাউন্টারে।\u003c/b>\",\n[\"Round Robin: পালাক্রমে।\",\"Weighted RR: শক্তিশালী server বেশি পায়।\",\"Least Connections: কম ব্যস্ত server।\",\"Least Response Time: সবচেয়ে দ্রুতটা।\",\"IP Hash / Consistent hash: একই client একই server (sticky)।\"],\n\"সাধারণ ক্ষেত্রে round robin, request-এর সময় ভিন্ন হলে least connections, আর session sticky লাগলে IP hash ব্যবহার করি। তবে আমি state Redis-এ রাখি, তাই sticky লাগে না।\",\"Upload API লম্বা চলে, তাই least connections দিলে কোনো server-এ জট লাগে না।\"),\nT(\"DNS Load Balancing\",\"\u003cb>এক নামের অনেক নম্বর:\u003c/b> DNS একেকজনকে একেক IP দেয়।\",\n[\"এক domain-এ একাধিক A record।\",\"DNS পালা করে বা location দেখে IP দেয়।\",\"সস্তা আর সহজ।\",\"দুর্বলতা: TTL cache, server মরলেও IP যেতে থাকে।\",\"Geo-DNS: কাছের data center।\"],\n\"DNS load balancing-এ এক domain-এর জন্য একাধিক IP দিই, DNS সেগুলো ভাগ করে। সহজ, তবে cache-এর কারণে কোনো server মরলে দ্রুত সরানো যায় না, তাই সাধারণত আসল LB-র সাথে মিলিয়ে ব্যবহার করি।\",\"Route 53 latency routing: বাংলাদেশি user সিঙ্গাপুর region-এ যায়।\"),\nT(\"Anycast Routing\",\"\u003cb>এক নম্বর, অনেক শাখা:\u003c/b> ৯৯৯ ডায়াল করলে কাছের থানায় যায়।\",\n[\"একই IP একাধিক জায়গা থেকে announce।\",\"Network (BGP) কাছের জায়গায় পাঠায়।\",\"ব্যবহার: CDN, DNS (1.1.1.1), DDoS ঠেকানো।\",\"একটা জায়গা পড়লে traffic অন্যটায় যায়।\"],\n\"Anycast-এ একই IP অনেক location থেকে advertise করা হয়, আর routing নিজেই user-কে সবচেয়ে কাছের location-এ পাঠায়। CDN আর DNS এটা দিয়ে কম latency আর DDoS সহনশীলতা পায়।\",\"Cloudflare-এর 1.1.1.1 ঢাকা থেকে কাছের PoP-এ যায়।\")\n]);\n\nP(\"api\",\"API Fundamentals\",[\nT(\"API কী?\",\"\u003cb>রেস্টুরেন্টের মেনু + ওয়েটার:\u003c/b> কী চাওয়া যায় আর কীভাবে, সেটা ঠিক করা চুক্তি।\",\n[\"দুই software-এর কথা বলার চুক্তি।\",\"Request → Response।\",\"Endpoint, method, input, output, error ঠিক করা থাকে।\",\"Versioning: /v1, /v2।\"],\n\"API হলো দুই system-এর মধ্যে চুক্তি, কোন endpoint-এ কী পাঠালে কী ফেরত আসবে। ভালো API-তে পরিষ্কার নাম, ঠিক status code, versioning আর documentation থাকে।\",\"Mobile app GET /v1/orders/15 দিয়ে order দেখে।\"),\nT(\"API Styles\",\"\u003cb>REST = মেনু থেকে অর্ডার, GraphQL = নিজের থালা নিজে সাজাও, gRPC = রান্নাঘরের ভেতরের দ্রুত ভাষা।\u003c/b>\",\n[\"REST: resource + HTTP method, সবচেয়ে প্রচলিত।\",\"GraphQL: client নিজে field বেছে নেয়, এক endpoint।\",\"gRPC: binary (protobuf), দ্রুত, service-to-service।\",\"WebSocket: দুই দিকে real-time।\",\"SOAP: XML, পুরনো enterprise।\"],\n\"Public API-তে REST, mobile-এ অনেক জায়গার data এক call-এ লাগলে GraphQL, আর internal microservice-এ দ্রুত যোগাযোগে gRPC ব্যবহার করি।\",\"Internal order → inventory call gRPC-তে, বাইরের app-এর জন্য REST।\"),\nT(\"Idempotency\",\"\u003cb>লিফটের বোতাম:\u003c/b> ১০ বার চাপলেও লিফট একবারই আসে।\",\n[\"একই request বারবার দিলেও ফল একবারের মতো।\",\"GET, PUT, DELETE স্বভাবত idempotent; POST না।\",\"POST-এ Idempotency-Key header দাও।\",\"Server key save করে, আবার এলে আগের উত্তর দেয়।\",\"Retry, payment, order-এ বাধ্যতামূলক।\"],\n\"Idempotency মানে একই request কয়েকবার এলেও ফল একবারের মতো। Network retry বা double click-এ duplicate order আটকাতে POST-এ idempotency key নিই আর DB-তে unique রাখি।\",\"User দুবার Pay চাপলে একই Idempotency-Key, তাই টাকা একবারই কাটে।\",\nnull,`const key = req.get('Idempotency-Key');\nconst old = await redis.get('idem:' + key);\nif (old) return res.json(JSON.parse(old));     // আগের উত্তর\nconst result = await createOrder(req.body);\nawait redis.set('idem:' + key, JSON.stringify(result), 'EX', 86400);\nres.status(201).json(result);`),\nT(\"Data Formats\",\"\u003cb>JSON = সবাই পড়তে পারে, Protobuf = ছোট আর দ্রুত কিন্তু মানুষ পড়তে পারে না।\u003c/b>\",\n[\"JSON: human-readable, web-এ সবচেয়ে বেশি।\",\"XML: পুরনো, verbose।\",\"Protobuf / Avro: binary, ছোট, schema লাগে।\",\"MessagePack: binary JSON।\",\"বড় traffic-এ binary format bandwidth বাঁচায়।\"],\n\"Public API-তে JSON দিই কারণ সবাই পড়তে পারে। Internal high-traffic যোগাযোগে Protobuf দিই, কারণ size ছোট, parse দ্রুত আর schema দিয়ে type ঠিক থাকে।\",\"একই message JSON-এ 1KB, Protobuf-এ ~300 bytes।\"),\nT(\"REST Fundamentals\",\"\u003cb>Noun-এ URL, verb-এ method।\u003c/b> /orders (noun) + POST (verb)।\",\n[\"Resource-based URL: /users/15/orders।\",\"GET পড়া, POST তৈরি, PUT পুরো বদল, PATCH আংশিক, DELETE মোছা।\",\"Stateless: প্রতিটা request নিজে সম্পূর্ণ।\",\"ঠিক status code: 201, 400, 401, 403, 404, 409, 500।\",\"Pagination, filter, versioning।\"],\n\"REST-এ URL দিয়ে resource বোঝাই আর HTTP method দিয়ে কাজ। প্রতিটা request stateless, সঠিক status code দিই, আর বড় list-এ pagination রাখি।\",\"POST /orders → 201 Created + Location: /orders/99।\",\nnull,`GET    /api/v1/orders?page=2&limit=20   200\nPOST   /api/v1/orders                   201\nPATCH  /api/v1/orders/99   {status}     200\nDELETE /api/v1/orders/99                204`),\nT(\"GraphQL Fundamentals\",\"\u003cb>বুফে:\u003c/b> যা লাগবে শুধু সেটুকু প্লেটে নাও, এক টেবিলেই সব।\",\n[\"এক endpoint (/graphql)।\",\"Client query-তে field বেছে নেয়।\",\"Over-fetching আর under-fetching কমে।\",\"Schema + resolver।\",\"সমস্যা: N+1 (DataLoader লাগে), cache কঠিন।\"],\n\"GraphQL-এ client নিজে ঠিক করে কোন field লাগবে, তাই অতিরিক্ত data আসে না আর একাধিক call লাগে না। তবে N+1 query সমস্যা ঠেকাতে DataLoader লাগে আর HTTP cache কঠিন।\",\"Mobile home screen-এ user, ৫টা order, notification count এক query-তে।\",\nnull,`query { user(id: 15) { name orders(last: 5) { id total } } }`),\nT(\"gRPC Fundamentals\",\"\u003cb>অফিসের ভেতরের হটলাইন:\u003c/b> দ্রুত, নির্দিষ্ট ফরম্যাট, বাইরের লোকের জন্য না।\",\n[\"HTTP/2 + Protobuf।\",\"Function call-এর মতো (RPC)।\",\"Streaming: client, server, দুই দিক।\",\"Strong contract (.proto file)।\",\"Browser-এ সরাসরি কঠিন, internal service-এ সেরা।\"],\n\"gRPC Protobuf আর HTTP/2 ব্যবহার করে, তাই REST-এর চেয়ে দ্রুত আর ছোট। .proto contract থেকে code generate হয়। Microservice-এর ভেতরের যোগাযোগে আমি এটা পছন্দ করি।\",\"Order service gRPC দিয়ে inventory-কে ReserveStock() call করে।\"),\nT(\"Rate Limiting\",\"\u003cb>টোকেনের বালতি:\u003c/b> প্রতি request-এ ১টা coin, coin শেষ হলে অপেক্ষা।\",\n[\"Abuse, DDoS, খরচ থেকে রক্ষা।\",\"Algo: Fixed window, Sliding window, Token bucket, Leaky bucket।\",\"Key: IP, user, API key।\",\"Counter Redis-এ, atomic।\",\"Limit পার → 429 + Retry-After।\"],\n\"Rate limiting দিয়ে কোনো user বা IP নির্দিষ্ট সময়ে কতবার call করতে পারবে সেটা সীমিত করি। Distributed system-এ counter Redis-এ রাখি, আর limit পার হলে 429 দিই।\",\"OTP: প্রতি phone মিনিটে ৩ বার।\",\nS(\"Token bucket\",[[\"Request আসে\",\"\",\"b\"],[\"Bucket-এ coin আছে?\",\"প্রতি সেকেন্ডে refill\",\"y\",\"হ্যাঁ\"],[\"API-তে যায় ✓\",\"coin −১\",\"g\",\"না হলে\"],[\"429 Too Many\",\"Retry-After\",\"p\"]])),\nT(\"Authentication vs Authorization\",\"\u003cb>AuthN = তুমি কে? (আইডি কার্ড)। AuthZ = তুমি কোথায় ঢুকতে পারো? (চাবি)।\u003c/b>\",\n[\"AuthN: পরিচয় যাচাই (password, OTP, JWT)।\",\"AuthZ: অনুমতি যাচাই (role, permission, owner)।\",\"আগে AuthN, তারপর AuthZ।\",\"401 = কে জানি না, 403 = জানি কিন্তু অনুমতি নেই।\"],\n\"Authentication যাচাই করে user কে, authorization যাচাই করে সে কী করতে পারবে। Login না থাকলে 401, login আছে কিন্তু অনুমতি নেই হলে 403।\",\"Customer admin panel-এ ঢুকলে 403।\"),\nT(\"Session vs Token Based Auth\",\"\u003cb>Session = হোটেলের রেজিস্টার\u003c/b> (server মনে রাখে)। \u003cb>Token = নিজের কাছে টিকিট\u003c/b> (server কিছু রাখে না)।\",\n[\"Session: server-এ data, client-এ শুধু session id cookie।\",\"Session: revoke সহজ, কিন্তু shared store (Redis) লাগে।\",\"Token (JWT): stateless, scale সহজ।\",\"Token: revoke কঠিন → ছোট মেয়াদ + refresh।\",\"Web app: session; mobile/API: token।\"],\n\"Session-based auth-এ server state রাখে, revoke সহজ কিন্তু horizontal scale-এ Redis লাগে। Token-based-এ JWT client-এর কাছে থাকে, server stateless, তবে revoke করতে ছোট মেয়াদ আর refresh token লাগে।\",\"Admin panel-এ session (সাথে সাথে logout), mobile API-তে JWT।\"),\nT(\"JWT\",\"\u003cb>H.P.S:\u003c/b> Header . Payload . Signature।
