ox h4{margin:0 0 6px;font:700 15px var(--display)}\n.box p,.box ul{margin:0}\n.flowl{display:flex;flex-wrap:wrap;gap:6px;font:700 13px var(--mono)}\n.flowl span{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 9px}\n\u003c/style>\n\u003cdiv class=\"wrap\">\n\u003cheader>\n  \u003ch1>\u003cspan class=\"play\">▶\u003c/span>SQL Optimize আর Pooling\u003c/h1>\n  \u003cp class=\"lede\">⭐ Asif vai-এর দেওয়া দুই topic: PostgreSQL-এ SQL query optimize, আর Redis ও DB connection pooling (কেন আর কীভাবে)। প্রতিটায় flow ছবি, বাস্তব scenario-র আগে → পরে code, 🎤 উত্তর আর 💡 example। সব SQL আসল Postgres 16-এ চালিয়ে যাচাই করা।\u003c/p>\n\u003c/header>\n\u003cdiv class=\"layout\">\u003cmain id=\"list\">\u003c/main>\u003caside id=\"side\" aria-label=\"সব topic\">\u003c/aside>\u003c/div>\n\u003cbutton id=\"sideBtn\" aria-controls=\"side\">☰ সব topic\u003c/button>\n\u003cfooter>EXPLAIN-এর output আর সময়ের সংখ্যাগুলো উদাহরণ; নিজের data-য় চালিয়ে আসল সংখ্যা দেখো। Video link ৯–১০ নভেম্বর ২০২৬-এ খোঁজা; এই topic-এ হিন্দি/বাংলা video কম, তাই কিছু জায়গায় ছোট English video। ভাষা নিশ্চিত না হলে লাল badge।\u003c/footer>\n\u003c/div>\n\u003cscript>\nlet MK=0;\n/* steps: vertical cheatsheet diagram. item = [title, sub, kind(b|a|g|y), edgeLabelToNext] */\nconst steps=(cap,arr,o={})=>{\n  const H=48,G=26,bw=o.back?296:344,W=360,n=arr.length,T=(n*1.2).toFixed(1),id=\"m\"+(MK++);\n  const h=n*H+(n-1)*G+8;let s=\"\";\n  arr.forEach(([t,sub,k=\"b\",e],i)=>{\n    const top=4+i*(H+G),cy=top+H/2;\n    s+=`\u003crect class=\"sb k-${k}\" x=\"8\" y=\"${top}\" width=\"${bw}\" height=\"${H}\" rx=\"9\" style=\"animation-duration:${T}s;animation-delay:${(i*1.2).toFixed(1)}s\"/>`;\n    s+=`\u003ccircle class=\"sn k-${k}\" cx=\"30\" cy=\"${cy}\" r=\"12\"/>\u003ctext class=\"snt\" x=\"30\" y=\"${cy+4.5}\">${i+1}\u003c/text>`;\n    s+=`\u003ctext class=\"st\" x=\"52\" y=\"${top+20}\">${t}\u003c/text>`;\n    if(sub)s+=`\u003ctext class=\"ss\" x=\"52\" y=\"${top+38}\">${sub}\u003c/text>`;\n    if(i\u003cn-1){const x=8+bw/2;s+=`\u003cline class=\"sa\" x1=\"${x}\" y1=\"${top+H+1}\" x2=\"${x}\" y2=\"${top+H+G-4}\" marker-end=\"url(#${id})\"/>`;\n      if(e)s+=`\u003ctext class=\"se\" x=\"${x+10}\" y=\"${top+H+G/2+4}\">${e}\u003c/text>`;}\n  });\n  let leg=o.leg||\"\";\n  if(o.back){const [f,t,l]=o.back,yf=4+f*(H+G)+H/2,yt=4+t*(H+G)+H/2,x0=8+bw;\n    s+=`\u003cpath class=\"sback\" d=\"M${x0} ${yf} H${x0+30} V${yt} H${x0+6}\" marker-end=\"url(#${id}r)\"/>`;\n    leg=`\u003cb class=\"bk\">↩ ${l}\u003c/b>`+(leg?\" · \"+leg:\"\");}\n  return `\u003cdiv class=\"anim\">\u003cdiv class=\"cap\">${cap}\u003c/div>\u003csvg class=\"dg\" viewBox=\"0 0 ${W} ${h}\" role=\"img\" aria-label=\"${cap}\">\n  \u003cdefs>\u003cmarker id=\"${id}\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\u003cpath class=\"mh\" d=\"M0 0L10 5L0 10z\"/>\u003c/marker>\n  \u003cmarker id=\"${id}r\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\u003cpath class=\"mhr\" d=\"M0 0L10 5L0 10z\"/>\u003c/marker>\u003c/defs>${s}\u003c/svg>${leg?`\u003cdiv class=\"legend\">${leg}\u003c/div>`:\"\"}\u003c/div>`;\n};\n/* lanes: timeline bars with labels. seg = [left%, width%, colorClass, delay, label] */\nconst lanes=(cap,rows,leg)=>`\u003cdiv class=\"anim\">\u003cdiv class=\"cap\">${cap}\u003c/div>\u003cdiv class=\"lanes\">${rows.map(([l,segs])=>`\u003cdiv class=\"lane\">\u003cspan>${l}\u003c/span>\u003cdiv class=\"rail\">${segs.map(([a,w,c,d,t])=>`\u003cdiv class=\"seg ${c}\" style=\"left:${a}%;width:${w}%;animation-delay:${d||0}s\">${t?`\u003cb>${t}\u003c/b>`:\"\"}\u003c/div>`).join(\"\")}\u003c/div>\u003c/div>`).join(\"\")}\u003c/div>${leg?`\u003cdiv class=\"legend\">${leg}\u003c/div>`:\"\"}\u003c/div>`;\n\n\n\nconst S=steps;\nconst parts=[];\nfunction P(id,name,items){parts.push({id,name,items});}\nfunction T(t,hook,b,say,ex,pic,code,v){return {t,hook,b,say,ex,pic:pic||\"\",c:code||\"\",v:v||[]};}\nfunction V(t,u,lang,note){return {t,u,lang,note};}\nP(\"sqlflow\",\"১. SQL Query Optimize (PostgreSQL): পুরো flow\",[\nT(\"Optimize করার ৫ ধাপ\",\"\u003cb>ডাক্তারের মতো:\u003c/b> আগে পরীক্ষা (মাপো), তারপর রোগ ধরো (EXPLAIN), তারপর ওষুধ (index/rewrite), শেষে আবার পরীক্ষা।\",\n[\"১. মাপো: কোন query ধীর? (pg_stat_statements, slow log)\",\"২. EXPLAIN (ANALYZE, BUFFERS) দিয়ে plan দেখো\",\"৩. সমস্যা চেনো: Seq Scan, ভুল row estimate, Sort, N+1\",\"৪. Fix: index, query rewrite, cache, pagination\",\"৫. আবার মাপো, আগে-পরের সংখ্যা বলো\"],\n\"আমি আন্দাজে optimize করি না। আগে pg_stat_statements বা slow query log দিয়ে সবচেয়ে বেশি সময় নেওয়া query খুঁজি, তারপর EXPLAIN ANALYZE দিয়ে plan দেখি কোথায় Seq Scan বা বড় Sort হচ্ছে। সেই অনুযায়ী index দিই বা query বদলাই, তারপর আবার মেপে আগে-পরের সংখ্যা মিলাই।\",\n\"Order list API-র p95 ছিল ১.৮ সেকেন্ড। pg_stat_statements-এ দেখা গেল একটা query মোট সময়ের ৬০% নিচ্ছে; EXPLAIN-এ Seq Scan; composite index দেওয়ার পর ১২ms।\",\nS(\"Optimization loop\",[[\"মাপো\",\"pg_stat_statements · slow log\",\"b\"],[\"EXPLAIN (ANALYZE, BUFFERS)\",\"plan পড়ো\",\"a\"],[\"সমস্যা চেনো\",\"Seq Scan · Sort · N+1 · ভুল estimate\",\"y\"],[\"Fix\",\"index · rewrite · cache · keyset\",\"a\"]],{back:[3,0,\"আবার মাপো, আগে-পরে তুলনা\"]}),\n`-- ১. সবচেয়ে বেশি সময় খাওয়া query (extension: pg_stat_statements)\nSELECT query, calls, round(mean_exec_time) AS avg_ms, round(total_exec_time) AS total_ms\nFROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 10;\n\n-- ধীর query নিজে log-এ আসুক (৫০০ms-এর বেশি)\nALTER SYSTEM SET log_min_duration_statement = '500ms';  SELECT pg_reload_conf();`),\nT(\"Postgres query-কে কীভাবে চালায়\",\"\u003cb>রান্নাঘর:\u003c/b> অর্ডার বোঝা (Parser) → কোন পথে রাঁধবে ঠিক করা (Planner) → রান্না (Executor)।\",\n[\"Parser: SQL বোঝে।\",\"Planner: statistics দেখে সবচেয়ে সস্তা plan বাছে (cost)।\",\"Executor: plan চালায়।\",\"Statistics পুরনো হলে planner ভুল plan বাছে → ANALYZE।\"],\n\"Postgres-এর planner table-এর statistics দেখে ঠিক করে index ব্যবহার করবে নাকি পুরো table পড়বে। তাই statistics পুরনো হলে ভুল plan আসে; ANALYZE চালালে বা autovacuum ঠিক থাকলে planner সঠিক সিদ্ধান্ত নেয়।\",\n\"বড় import-এর পর হঠাৎ query ধীর হলো; EXPLAIN-এ estimate ১০০ row, আসলে ৫ লাখ। ANALYZE orders চালানোর পর planner index ধরল।\",\nS(\"Query lifecycle\",[[\"SQL\",\"SELECT ...\",\"b\"],[\"Parser\",\"syntax বোঝে\",\"b\"],[\"Planner\",\"statistics → সস্তা plan\",\"y\"],[\"Executor\",\"plan চালায় → result\",\"g\"]])),\nT(\"EXPLAIN ANALYZE পড়তে শেখো\",\"\u003cb>রিপোর্ট কার্ড:\u003c/b> কোন পথে গেল (Scan), কত row ভেবেছিল vs আসলে কত, কত সময়।\",\n[\"Seq Scan = পুরো table পড়া (বড় table-এ খারাপ সংকেত)\",\"Index Scan / Index Only Scan / Bitmap Heap Scan = index ব্যবহার\",\"rows (estimate) vs actual rows অনেক আলাদা → ANALYZE লাগবে\",\"Sort / Hash-এ 'external merge Disk' → work_mem কম\",\"Nested Loop বড় data-য় ধীর হতে পারে; Hash Join ভালো\"],\n\"EXPLAIN ANALYZE দিয়ে আসল plan আর সময় দেখি: Seq Scan হচ্ছে কিনা, estimate আর actual row মিলছে কিনা, আর Sort disk-এ যাচ্ছে কিনা। BUFFERS দিলে কতগুলো page disk থেকে পড়ল সেটাও দেখা যায়।\",\n\"Plan-এ 'Seq Scan on orders … rows=5000000' দেখলাম, filter-এ user_id; index দেওয়ার পর 'Index Scan using idx_orders_user'।\",\nnull,\n`EXPLAIN (ANALYZE, BUFFERS)\nSELECT id, total FROM orders WHERE user_id = 42 ORDER BY created_at DESC LIMIT 20;\n\n-- ❌ আগে (উদাহরণ)\n-- Limit  (actual time=1830..1830 rows=20)\n--   -> Sort  (Sort Method: top-N heapsort)\n--     -> Seq Scan on orders  (rows=5000000)  Filter: (user_id = 42)   ← পুরো table!\n-- ✅ index-এর পরে\n-- Limit  (actual time=0.05..0.12 rows=20)\n--   -> Index Scan using idx_orders_user_created on orders  (rows=20)`)\n]);\n\nP(\"sqlcase\",\"১. SQL: বাস্তব scenario (আগে → পরে)\",[\nT(\"Scenario ১: user-এর order, নতুনগুলো আগে\",\"\u003cb>Composite index:\u003c/b> যে column দিয়ে খোঁজো আগে, যে column দিয়ে sort তারপর।\",\n[\"WHERE user_id + ORDER BY created_at → (user_id, created_at DESC)\",\"Index ক্রমে থাকায় Sort লাগে না, LIMIT-এ সাথে সাথে থামে\",\"শুধু created_at দিয়ে খুঁজলে এই index কাজে আসবে না (leftmost নিয়ম)\"],\n\"WHERE-এর column আগে আর ORDER BY-এর column পরে রেখে composite index দিই। তাতে Postgres index ধরে সরাসরি ঠিক ক্রমে প্রথম ২০টা পড়ে থেমে যায়, আলাদা Sort লাগে না।\",\n\"৫০ লাখ order-এ 'আমার শেষ ২০টা order' ১.৮s থেকে ১২ms।\",\nnull,\n`-- ❌ index নেই → Seq Scan + Sort\nSELECT * FROM orders WHERE user_id = 42 ORDER BY created_at DESC LIMIT 20;\n\n-- ✅ composite index (production-এ CONCURRENTLY, table lock হয় না)\nCREATE INDEX CONCURRENTLY idx_orders_user_created ON orders (user_id, created_at DESC);`),\nT(\"Scenario ২: column-এ function দিলে index কাজ করে না\",\"\u003cb>তালার নম্বর বদলে খুঁজলে চাবি মেলে না।\u003c/b> lower(email) চাইলে index-ও lower(email)-এর।\",\n[\"WHERE lower(email) = ... → সাধারণ email index ব্যবহার হয় না\",\"সমাধান: expression index ON users (lower(email))\",\"একইভাবে date(created_at) = ... → range দিয়ে লেখো\",\"Type না মিললেও index বাদ পড়তে পারে\"],\n\"Column-এর উপর function দিলে সাধারণ index কাজ করে না। তাই হয় expression index দিই, নয়তো query এমনভাবে লিখি যাতে column খালি থাকে, যেমন date() না দিয়ে তারিখের range।\",\n\"Login-এ lower(email) দিয়ে খোঁজায় ১০ লাখ user-এ ৪০০ms; expression index-এর পর ১ms।\",\nnull,\n`-- ❌ index থাকলেও কাজ করে না\nSELECT * FROM users WHERE lower(email) = 'abed@x.com';\n-- ✅ expression index\nCREATE INDEX idx_users_email_lower ON users (lower(email));\n\n-- ❌ date() দিলে index বাদ\nSELECT * FROM orders WHERE date(created_at) = '2026-11-10';\n-- ✅ range দিয়ে লেখো (created_at index কাজ করবে)\nSELECT * FROM orders WHERE created_at >= '2026-11-10' AND created_at \u003c '2026-11-11';`),\nT(\"Scenario ৩: বড় OFFSET pagination ধীর\",\"\u003cb>বইয়ের ১০০০ নম্বর পাতা:\u003c/b> OFFSET মানে আগের ৯৯৯ পাতা উল্টে তারপর পড়া। Keyset = সরাসরি bookmark থেকে।\",\n[\"OFFSET 100000 → আগের ১ লাখ row পড়ে ফেলে দেয়\",\"Keyset: WHERE id \u003c last_id ORDER BY id DESC LIMIT 20\",\"গতি সবসময় একই, যত পেছনের page হোক\",\"অসুবিধা: সরাসরি 'page 500'-এ লাফানো যায় না\"],\n\"বড় OFFSET-এ Postgres আগের সব row পড়ে বাদ দেয়, তাই পেছনের page যত দূরে তত ধীর। Infinite scroll বা বড় list-এ keyset pagination দিই: শেষ দেখা id থেকে পরের অংশ, তাই গতি সবসময় একই থাকে।\",\n\"Admin-এ ৫০০০ নম্বর page খুলতে ৩ সেকেন্ড লাগত; keyset-এর পর ১০ms।\",\nnull,\n`-- ❌ যত পেছনের page, তত ধীর\nSELECT * FROM orders ORDER BY id DESC LIMIT 20 OFFSET 100000;\n\n-- ✅ keyset (cursor): আগের page-এর শেষ id পাঠাও\nSELECT * FROM orders WHERE id \u003c $1 ORDER BY id DESC LIMIT 20;`),\nT(\"Scenario ৪: N+1 query\",\"\u003cb>দোকানে ১০০ বার যাওয়া vs একবারে list নিয়ে যাওয়া।\u003c/b>\",\n[\"Loop-এর ভেতরে query = ১টা + N টা query\",\"Fix: JOIN, অথবা WHERE id = ANY($1) দিয়ে একবারে\",\"ORM-এ include/eager loading\",\"Log-এ একই query বারবার দেখলে N+1 সন্দেহ করো\"],\n\"N+1 হয় যখন একটা list আনার পর loop-এর ভেতরে প্রতিটার জন্য আলাদা query যায়। আমি JOIN দিয়ে বা সব id একসাথে ANY দিয়ে এক query-তে আনি, তাতে ১০১টা round trip একটায় নেমে আসে।\",\n\"১০০টা order-এর জন্য ১০১টা query, ৮০০ms; ANY দিয়ে ২টা query, ৬০ms।\",\nnull,\n`// ❌ N+1\nconst orders = await query('SELECT * FROM orders LIMIT 100');\nfor (const o of orders) o.user = (await query('SELECT * FROM users WHERE id = $1', [o.user_id]))[0];\n\n// ✅ একবারে\nconst ids = [...new Set(orders.map(o => o.user_id))];\nconst users = await query('SELECT * FROM users WHERE id = ANY($1)', [ids]);`),\nT(\"Scenario ৫: LIKE '%keyword%' search ধীর\",\"\u003cb>শব্দের মাঝখান দিয়ে খোঁজা:\u003c/b> সাধারণ B-tree index শুরু থেকে মেলায়, মাঝখান পারে না।\",\n[\"LIKE 'abc%' → B-tree চলে (text_pattern_ops)\",\"LIKE '%abc%' / ILIKE → pg_trgm GIN index\",\"পুরো লেখা search → full-text (tsvector) বা Elasticsearch\",\"Search-এ সবসময় LIMIT দাও\"],\n\"শুরুর দিকে wildcard থাকলে সাধারণ index কাজ করে না। Postgres-এ pg_trgm extension দিয়ে GIN index দিই, তাতে ILIKE '%keyword%'-ও index ব্যবহার করে। আরও উন্নত search লাগলে full-text search বা Elasticsearch।\",\n\"Product নাম দিয়ে ILIKE search ২ লাখ product-এ ৯০০ms; trigram GIN index-এর পর ১৫ms।\",\nnull,\n`CREATE EXTENSION IF NOT EXISTS pg_trgm;\nCREATE INDEX idx_products_name_trgm ON products USING gin (name gin_trgm_ops);\n\nSELECT id, name FROM products WHERE name ILIKE '%samsung%' LIMIT 20;   -- এখন index ব্যবহার করে`),\nT(\"Scenario ৬: শুধু অল্প কিছু row-এ query (partial + covering index)\",\"\u003cb>পুরো খাতার না, শুধু 'বাকি' তালিকার index।\u003c/b>\",\n[\"Partial index: WHERE status = 'PENDING' → ছোট আর দ্রুত index\",\"Covering index (INCLUDE): table-এ না গিয়েই উত্তর (Index Only Scan)\",\"SELECT * না, দরকারি column\",\"অপ্রয়োজনীয় index মুছো (write ধীর করে)\"],\n\"যখন query সবসময় অল্প কিছু row নিয়ে, যেমন শুধু PENDING order, তখন partial index দিই, যেটা ছোট আর দ্রুত। আর দরকারি column INCLUDE করলে Postgres table-এ না গিয়েই index থেকে উত্তর দেয়।\",\n\"৫০ লাখ order-এর মধ্যে মাত্র ২ হাজার PENDING; partial index মাত্র কয়েক KB, worker-এর query ১ms।\",\nnull,\n`-- শুধু PENDING order-এর ছোট index\nCREATE INDEX idx_orders_pending ON orders (created_at) WHERE status = 'PENDING';\n\n-- covering: total আর status index-এর ভেতরেই → Index Only Scan\nCREATE INDEX idx_orders_user_cov ON orders (user_id) INCLUDE (total, status);`),\nT(\"Scenario ৭: ভারী dashboard / report\",\"\u003cb>আগে থেকে রান্না করে রাখা খাবার।\u003c/b>\",\n[\"বারবার একই ভারী aggregation → materialized view\",\"নির্দিষ্ট সময়ে REFRESH (CONCURRENTLY)\",\"অথবা ফল Redis-এ cache\",\"বা read replica-তে চালাও, primary-কে চাপ দিয়ো না\"],\n\"Dashboard-এর ভারী aggregation বারবার চালানোর বদলে materialized view-এ আগে থেকে হিসাব করে রাখি আর নির্দিষ্ট সময়ে refresh করি। আরও কমাতে ফল Redis-এ cache করি বা read replica-তে চালাই।\",\n\"মাসিক sales summary ১৫ সেকেন্ড লাগত; materialized view থেকে ২০ms, প্রতি ১০ মিনিটে refresh।\",\nnull,\n`CREATE MATERIALIZED VIEW daily_sales AS\nSELECT date_trunc('day', created_at) AS day, count(*) AS orders, sum(total) AS revenue\nFROM orders GROUP BY 1;\nCREATE UNIQUE INDEX ON daily_sales (day);\n\nREFRESH MATERIALIZED VIEW CONCURRENTLY daily_sales;   -- cron দিয়ে প্রতি ১০ মিনিটে`),\nT(\"অন্যান্য দ্রুত উপায় (checklist)\",\"\u003cb>ছোট ছোট অভ্যাস, বড় লাভ।\u003c/b>\",\n[\"ANALYZE / autovacuum ঠিক রাখো (statistics আর dead row)\",\"Bulk insert: এক INSERT-এ অনেক row, বা COPY\",\"OR-এর বদলে IN / ANY\",\"COUNT(*) বিশাল table-এ ধীর → আনুমানিক count বা cache\",\"Transaction ছোট রাখো, লম্বা transaction lock ধরে রাখে\",\"বিশাল table → partitioning (মাস ধরে)\"],\n\"Index আর query ছাড়াও statistics আর vacuum ঠিক রাখি, insert batch করি, transaction ছোট রাখি, আর খুব বড় table মাস ধরে partition করি যাতে query শুধু দরকারি অংশ পড়ে।\",\n\"১০ হাজার row এক এক করে insert ৮ সেকেন্ড; ১০০০ করে batch-এ ০.৫ সেকেন্ড।\",\nnull,\n`-- ❌ ১০০০০ বার INSERT\n-- ✅ একসাথে অনেক row\nINSERT INTO products (name, price, stock)\nSELECT * FROM unnest($1::text[], $2::int[], $3::int[]);\n\nVACUUM (ANALYZE) orders;   -- statistics আর dead row পরিষ্কার`)\n]);\n\nP(\"pool\",\"২. Connection Pooling: কেন আর কীভাবে\",[\nT(\"Connection কেন দামি\",\"\u003cb>প্রতিবার নতুন গাড়ি কেনা vs ট্যাক্সি স্ট্যান্ড।\u003c/b> নতুন connection = TCP + TLS + login + Postgres-এ নতুন process।\",\n[\"Postgres প্রতিটা connection-এর জন্য আলাদা process চালায় (কয়েক MB RAM)\",\"নতুন connection খুলতে কয়েক ms থেকে বেশি (TCP + TLS + auth)\",\"max_connections সীমিত (default ১০০)\",\"প্রতি request-এ নতুন connection → ধীর + 'too many connections'\"],\n\"Postgres প্রতিটা connection-এর জন্য আলাদা process আর memory খরচ করে, আর connection খুলতে TCP, TLS আর authentication-এ সময় লাগে। তাই প্রতি request-এ নতুন connection খোলা ধীর আর DB-র সীমা দ্রুত ফুরিয়ে যায়। Pool কয়েকটা connection খোলা রেখে বারবার ব্যবহার করে।\",\n\"Traffic বাড়ার পর 'FATAL: sorry, too many clients already' error আসছিল, কারণ প্রতি request নতুন connection খুলছিল।\",\nS(\"Pool ছাড়া vs সাথে\",[[\"Request\",\"\",\"b\"],[\"Pool থেকে connection নাও\",\"খোলা আছে, ০ms\",\"a\",\"query\"],[\"Postgres\",\"\",\"y\",\"শেষ\"],[\"Pool-এ ফেরত (release)\",\"পরের request ব্যবহার করবে\",\"g\"]])),\nT(\"Node.js-এ Postgres Pool (pg)\",\"\u003cb>Pool = ট্যাক্সি স্ট্যান্ড:\u003c/b> নাও, কাজ শেষে ফেরত দাও। ফেরত না দিলে স্ট্যান্ড খালি হয়ে যায়।\",\n[\"পুরো app-এ একটাই Pool (module-এ একবার বানাও)\",\"pool.query() নিজেই নেয় আর ফেরত দেয়\",\"Transaction: pool.connect() → একই client → finally release()\",\"release না করলে leak → কিছুক্ষণ পর সব request আটকে যায়\",\"connectionTimeoutMillis দাও, যাতে অনন্তকাল অপেক্ষা না করে\"],\n\"পুরো app-এ একটাই pg Pool রাখি। সাধারণ query-তে pool.query দিই, ওটা নিজেই connection নেয় আর ফেরত দেয়। Transaction-এ pool.connect দিয়ে একই client নিই আর finally-তে release করি, নাহলে connection leak হয়ে কিছুক্ষণ পর সব request আটকে যায়।\",\n\"একবার error path-এ release ভুলে যাওয়ায় ১০ মিনিট পর API hang হতো; finally-তে release দেওয়ার পর ঠিক।\",\nnull,\n`import { Pool } from 'pg';\nexport const pool = new Pool({\n  connectionString: process.env.DATABASE_URL,\n  max: 10,                        // এই instance সর্বোচ্চ ১০টা connection\n  idleTimeoutMillis: 30_000,      // অলস connection ৩০s পর বন্ধ\n  connectionTimeoutMillis: 2_000, // ২s-এ connection না পেলে error (hang না)\n});\n\n// সাধারণ query: নিজেই নেয়, নিজেই ফেরত দেয়\nconst { rows } = await pool.query('SELECT * FROM users WHERE id = $1', [id]);\n\n// transaction: একই client, আর অবশ্যই release\nconst client = await pool.connect();\ntry {\n  await client.query('BEGIN');\n  await client.query('UPDATE products SET stock = stock - 1 WHERE id = $1 AND stock > 0', [pid]);\n  await client.query('COMMIT');\n} catch (e) { await client.query('ROLLBACK'); throw e; }\nfinally { client.release(); }      // ← ভুলে গেলে leak`),\nT(\"Pool size কত দেব?\",\"\u003cb>বড় pool মানেই দ্রুত না।\u003c/b> DB-র CPU সীমিত; বেশি connection একে অপরের সাথে ধাক্কা খায়।\",\n[\"মোট = instance সংখ্যা × pool max ≤ DB max_connections − কিছু reserve\",\"DB-র জন্য ভালো শুরু: মোট active ≈ CPU core × ২ (আনুমানিক)\",\"১০ pod × ২০ = ২০০ > ১০০ → সমস্যা\",\"Waiting বেশি কিন্তু DB CPU কম → pool একটু বাড়াও\",\"DB CPU ১০০% → pool কমাও, query optimize করো\"],\n\"Pool size এমনভাবে ঠিক করি যাতে সব instance মিলিয়ে DB-র max_connections না পেরোয়। অনেক বড় pool দিলে DB context switching-এ সময় নষ্ট করে, তাই ছোট pool দিয়ে শুরু করে waiting count আর DB CPU দেখে বাড়াই বা কমাই।\",\n\"৮টা pod × max 10 = ৮০, Postgres max_connections ১০০, admin আর migration-এর জন্য ২০ বাকি।\",\nS(\"হিসাব\",[[\"Pods = ৮\",\"autoscale হলে max ধরো\",\"b\"],[\"Pool max = ১০ / pod\",\"\",\"a\"],[\"মোট = ৮০\",\"\",\"y\"],[\"DB max_connections = ১০০\",\"২০ reserve ✓\",\"g\"]])),\nT(\"PgBouncer: অনেক instance / serverless হলে\",\"\u003cb>বড় অফিসের রিসেপশন:\u003c/b> হাজার অতিথি, কিন্তু ভেতরে মিটিং রুম মাত্র ২০টা; রিসেপশন ভাগ করে দেয়।\",\n[\"App আর Postgres-এর মাঝে হালকা connection pooler\",\"হাজারো client connection → অল্প কয়েকটা আসল DB connection\",\"Transaction mode: transaction শেষ হলেই connection অন্যজনকে\",\"Serverless (Lambda, Cloud Run) আর অনেক pod-এ খুব কাজে লাগে\",\"সাবধান: transaction mode-এ session-ভিত্তিক জিনিস (SET, advisory lock, কিছু prepared statement) সমস্যা করতে পারে\"],\n\"অনেক pod বা serverless function হলে প্রত্যেকের নিজের pool মিলিয়ে DB-র সীমা পেরিয়ে যায়। তখন মাঝে PgBouncer বসাই transaction mode-এ, যেটা হাজারো client connection-কে অল্প কয়েকটা আসল DB connection-এ ভাগ করে দেয়।\",\n\"Cloud Run ৫০টা instance পর্যন্ত scale হচ্ছিল; PgBouncer দেওয়ার পর Postgres-এ মাত্র ৪০টা আসল connection।\",\nS(\"PgBouncer\",[[\"৫০ instance × pool\",\"~৫০০ client connection\",\"b\"],[\"PgBouncer\",\"transaction mode\",\"y\"],[\"Postgres\",\"মাত্র ৪০ আসল connection\",\"g\"]])),\nT(\"Redis connection: pool লাগে কি?\",\"\u003cb>Redis এক কাউন্টারের দোকান, কিন্তু অসম্ভব দ্রুত।\u003c/b> এক লাইনেই সবাই দাঁড়ায়, pipelining-এ একসাথে অনেক অর্ডার।\",\n[\"Redis single-threaded; ioredis এক connection-এ অনেক command চালায় (pipelining)\",\"সাধারণত পুরো app-এ একটা shared connection যথেষ্ট\",\"প্রতি request-এ নতুন connection খুলবে না\",\"আলাদা connection লাগে: blocking command (BLPOP), SUBSCRIBE, BullMQ worker\",\"খুব বেশি load-এ কয়েকটা connection বা Redis Cluster\"],\n\"Redis-এ সাধারণত পুরো app-এর জন্য একটা shared connection যথেষ্ট, কারণ ioredis এক connection-এই অনেক command pipeline করে আর Redis খুব দ্রুত। শুধু blocking command, pub/sub subscribe বা BullMQ worker-এর জন্য আলাদা connection রাখি, কারণ ওগুলো connection আটকে রাখে।\",\n\"প্রতি request-এ new Redis() খোলায় হাজারো connection জমে Redis-এর maxclients ছুঁয়েছিল; একটা shared client দেওয়ার পর connection ৩টা।\",\nnull,\n`// redis.ts — পুরো app-এ একটাই\nimport Redis from 'ioredis';\nexport const redis = new Redis(process.env.REDIS_URL, { maxRetriesPerRequest: 2 });\n\n// pub/sub-এর জন্য আলাদা (subscribe করলে ওই connection অন্য কাজ করতে পারে না)\nexport const sub = redis.duplicate();\nawait sub.subscribe('order.created');\n\n// ❌ প্রতি request-এ নতুন connection\napp.get('/x', async (req, res) => { const r = new Redis(); /* ... */ });`),\nT(\"Redis + DB pool একসাথে: পুরো request flow\",\"\u003cb>আগে হাতের কাছের তাক (Redis), না পেলে স্ট্যান্ড থেকে ট্যাক্সি (DB pool)।\u003c/b>\",\n[\"Redis hit → DB connection লাগেই না\",\"Miss → pool থেকে connection → query → release → Redis-এ রাখো\",\"Cache থাকায় DB-তে কম connection লাগে\",\"দুই জায়গাতেই timeout দাও\"],\n\"Request এলে আগে shared Redis connection দিয়ে cache দেখি; পেলে DB connection লাগেই না। না পেলে pool থেকে connection নিয়ে query করি, সাথে সাথে ফেরত দিই আর ফল Redis-এ রাখি। এভাবে cache DB-র connection-এর চাপও কমায়।\",\n\"Cache hit ৯০% হওয়ায় একই traffic-এ DB-তে active connection ৬০ থেকে ৮-এ নামল।\",\nS(\"Request flow\",[[\"Request\",\"\",\"b\"],[\"Redis (shared conn)\",\"hit → return ⚡\",\"y\",\"miss\"],[\"DB Pool → connection\",\"\",\"a\",\"query\"],[\"Postgres\",\"\",\"a\",\"release\"],[\"Redis SET + TTL → response\",\"\",\"g\"]]),\n`async function getProduct(id) {\n  const hit = await redis.get('product:' + id);          // shared Redis connection\n  if (hit) return JSON.parse(hit);                         // DB connection লাগল না\n\n  const { rows } = await pool.query('SELECT * FROM products WHERE id = $1', [id]); // pool নেয় + ফেরত দেয়\n  await redis.set('product:' + id, JSON.stringify(rows[0]), 'EX', 300);\n  return rows[0];\n}`),\nT(\"সমস্যা হলে কীভাবে ধরবে (monitoring)\",\"\u003cb>লক্ষণ দেখে রোগ ধরো।\u003c/b>\",\n[\"pool.totalCount / idleCount / waitingCount log করো\",\"waitingCount বাড়ছে → pool ছোট বা query ধীর\",\"Request কিছুক্ষণ পর hang → release ভুলে যাওয়া (leak)\",\"pg_stat_activity: কোন connection কী করছে, 'idle in transaction' খোঁজো\",\"'too many clients' → মোট pool > max_connections\"],\n\"Pool-এর total, idle আর waiting count metric হিসেবে রাখি। Waiting বাড়লে বুঝি pool ছোট বা query ধীর; request ধীরে ধীরে hang হলে connection leak সন্দেহ করি; আর pg_stat_activity-তে 'idle in transaction' খুঁজি, যেটা সাধারণত COMMIT বা release ভুলে যাওয়ার লক্ষণ।\",\n\"Grafana-য় waitingCount ২০ দেখে query optimize করলাম; waiting ০-তে নামল, pool বাড়াতে হয়নি।\",\nnull,\n`setInterval(() => console.log({ total: pool.totalCount, idle: pool.idleCount, waiting: pool.waitingCount }), 10_000);\n\n-- কোন connection কী করছে\nSELECT pid, state, now() - query_start AS running_for, left(query, 60)\nFROM pg_stat_activity WHERE datname = 'app' ORDER BY running_for DESC;`)\n]);\n\nP(\"say\",\"৩. Interview-এ একসাথে বলার উত্তর\",[\nT(\"\\\"API load-এ ধীর, DB-তে 'too many connections'\\\" — কী করবে?\",\"\u003cb>মাপো → pool → PgBouncer → cache → query।\u003c/b>\",\n[\"প্রথমে মাপি: pool waiting, DB CPU, slow query\",\"প্রতি request-এ নতুন connection? → একটা shared Pool\",\"মোট pool > max_connections? → size ঠিক করো / PgBouncer\",\"Read বেশি → Redis cache, read replica\",\"ধীর query → EXPLAIN → index\"],\n\"আগে মাপি সমস্যা connection-এর নাকি query-র। প্রতি request-এ নতুন connection খুললে একটা shared pool দিই; সব instance মিলিয়ে pool যেন max_connections না পেরোয়, দরকার হলে PgBouncer। Read বেশি হলে Redis cache দিই, তাতে DB connection কম লাগে; আর ধীর query EXPLAIN দেখে index দিয়ে ঠিক করি, কারণ দ্রুত query মানে connection দ্রুত ফেরত আসে।\",\n\"এই চারটা ধাপে p95 ১.৫s থেকে ১২০ms, আর 'too many clients' error বন্ধ।\",\nS(\"উত্তরের ক্রম\",[[\"মাপো\",\"waiting · CPU · slow query\",\"b\"],[\"Shared Pool + সঠিক size\",\"\",\"a\"],[\"PgBouncer (অনেক instance হলে)\",\"\",\"a\"],[\"Redis cache + replica\",\"\",\"y\"],[\"EXPLAIN → index / rewrite\",\"\",\"g\"]]))\n]);\n\n// ── video link (৯–১০ নভেম্বর ২০২৬-এ খোঁজা) ──\nconst VID={\n\"Optimize করার ৫ ধাপ\":[V(\"How does indexing work in Databases in Hindi (How to optimize SQL Queries in Hindi)\",\"https://www.youtube.com/watch?v=xXtig5uLQS4\",\"Hindi\",\"Engineering Digest\"),V(\"Understanding Explain and Explain Analyze in PostgreSQL\",\"https://www.youtube.com/watch?v=GmX8tjT7UcQ\",\"English\"),V(\"A beginners guide to EXPLAIN ANALYZE\",\"https://www.youtube.com/watch?v=31EmOKBP1PY\",\"English\")],\n\"Postgres query-কে কীভাবে চালায়\":[V(\"Postgres Explain Explained: How Databases Prepare Optimal Query Plans\",\"https://www.youtube.com/watch?v=P7EUFtjeAmI\",\"English\")],\n\"EXPLAIN ANALYZE পড়তে শেখো\":[V(\"PT-02 How to read and understand Explain Query Plan in Postgresql\",\"https://www.youtube.com/watch?v=YxLl_SAaRhc\",\"ভাষা যাচাই হয়নি\"),V(\"Understanding Explain and Explain Analyze in PostgreSQL\",\"https://www.youtube.com/watch?v=GmX8tjT7UcQ\",\"English\")],\n\"Scenario ১: user-এর order, নতুনগুলো আগে\":[V(\"What Is Indexing, Easiest Explanation Ever in Hindi\",\"https://www.youtube.com/watch?v=Lo7YEw93U_E\",\"Hindi\",\"5 Minutes Engineering\"),V(\"How does indexing work in Databases in Hindi\",\"https://www.youtube.com/watch?v=xXtig5uLQS4\",\"Hindi\",\"Engineering Digest\")],\n\"Scenario ৪: N+1 query\":[V(\"100 Orders, 101 Queries: The N+1 Problem\",\"https://www.youtube.com/shorts/QNgmrDKEPtE\",\"English\",\"Short\"),V(\"N+1 Query Problem Explained ⚡ Fix Slow ORM Performance\",\"https://www.youtube.com/watch?v=_QmT0GmQJ8o\",\"English\")],\n\"Connection কেন দামি\":[V(\"Why do we need a database connection pooling?\",\"https://www.youtube.com/watch?v=j1pdutk8XUQ\",\"English\"),V(\"DB Connection Pooling Explained (Watch at 1.5×)\",\"https://www.youtube.com/watch?v=zjvggxgGD_Q\",\"English\")],\n\"Node.js-এ Postgres Pool (pg)\":[V(\"Node.js In Hindi Part-9: Connection Pooling (MongoDB + Node + Express; ধারণা একই)\",\"https://www.youtube.com/watch?v=On7BrbIi0CE\",\"Hindi\"),V(\"Postgres Connection Pooling Masterclass\",\"https://www.youtube.com/watch?v=MOq5yM6cMxw\",\"English\")],\n\"PgBouncer: অনেক instance / serverless হলে\":[V(\"Using PgBouncer to improve performance and reduce the load on PostgreSQL\",\"https://www.youtube.com/watch?v=TQZA3sIjF-c\",\"Hindi (সম্ভবত)\"),V(\"PgBouncer in 3 Minutes\",\"https://www.youtube.com/watch?v=nCA8HdGjMWo\",\"English\"),V(\"How PgBouncer Fixes PostgreSQL Performance\",\"https://www.youtube.com/shorts/YRxBlCEDkPw\",\"English\",\"Short\")],\n\"Redis connection: pool লাগে কি?\":[V(\"Redis Explained in Simple Hinglish 🔥\",\"https://www.youtube.com/shorts/YxlJcbX12p0\",\"Hinglish\",\"Short\"),V(\"Redis Crash Course + Node.js Integration\",\"https://www.youtube.com/watch?v=-Ai7GDa2OgE\",\"ভাষা যাচাই হয়নি\")],\n\"Redis + DB pool একসাথে: পুরো request flow\":[V(\"Redis Explained in Simple Hinglish 🔥\",\"https://www.youtube.com/shorts/YxlJcbX12p0\",\"Hinglish\",\"Short\"),V(\"Caching API Responses with Redis\",\"https://www.youtube.com/watch?v=ztLsihiCHic\",\"English\")]\n};\nparts.forEach(p=>p.items.forEach(it=>{if(VID[it.t])it.v=VID[it.t];}));\n\nconst esc=s=>String(s).replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\");\nconst hl=s=>esc(s).split(\"\\n\").map(l=>l.replace(/(\\/\\/.*|--.*)$/,'\u003cspan class=\"cm\">$1\u003c/span>')).join(\"\\n\");\nconst KEY=\"av-done\";let done={};try{done=JSON.parse(localStorage.getItem(KEY)||\"{}\")}catch(e){}\nconst save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};\nconst bn=n=>String(n).replace(/\\d/g,d=>\"০১২৩৪৫৬৭৮৯\"[d]);\nconst total=parts.reduce((a,p)=>a+p.items.length,0);\nconst lgc=l=>/সম্ভবত|যাচাই|নিশ্চিত/.test(l)?\"un\":/hindi|hinglish|bangla/i.test(l)?\"hi\":/english/i.test(l)?\"en\":\"un\";\nconst vids=v=>v.length?`\u003cdiv class=\"vids\">\u003ch4>▶️ আগে ছোট video দেখো\u003c/h4>${v.map(x=>`\u003ca class=\"vid\" href=\"${x.u}\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"pl\">▶\u003c/span>\u003cspan class=\"vt\">${esc(x.t)}${x.note&&x.note!==\"Short\"?` \u003cspan class=\"lcno\" style=\"color:var(--muted);font-size:12.5px\">· ${esc(x.note)}\u003c/span>`:\"\"}\u003c/span>${x.note===\"Short\"?'\u003cspan class=\"lg sh\">Short\u003c/span>':\"\"}\u003cspan class=\"lg ${lgc(x.lang)}\">${esc(x.lang)}\u003c/span>\u003c/a>`).join(\"\")}\u003c/div>`:\"\";\nconst INTRO=`\u003csection class=\"part\">\u003ch2>\u003csmall>শুরু\u003c/small>এক নজরে\u003c/h2>\u003cdiv class=\"cards\">\u003carticle class=\"card intro\">\n\u003cdiv class=\"box\">\u003ch4>🧭 SQL optimize-এর ক্রম\u003c/h4>\u003cdiv class=\"flowl\">\u003cspan>মাপো\u003c/span>\u003cspan>EXPLAIN ANALYZE\u003c/span>\u003cspan>সমস্যা চেনো\u003c/span>\u003cspan>Index / Rewrite / Cache\u003c/span>\u003cspan>আবার মাপো\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>🧭 Pooling-এর মূল কথা\u003c/h4>\u003cdiv class=\"flowl\">\u003cspan>একটাই Pool\u003c/span>\u003cspan>নাও → query → release\u003c/span>\u003cspan>size ≤ max_connections\u003c/span>\u003cspan>অনেক instance → PgBouncer\u003c/span>\u003cspan>Redis: একটা shared connection\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"box\">\u003ch4>📺 পুরো course (হিন্দি/বাংলা), সময় থাকলে\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://www.youtube.com/playlist?list=PLCiS1ws9lhBvbGAY3w0853BcUD_4nRYaJ\" target=\"_blank\" rel=\"noopener\">PostgreSQL Free Course in Hindi (110+ video)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.youtube.com/watch?v=blkZ6APzT8Q\" target=\"_blank\" rel=\"noopener\">SQL Complete Course in Hindi (MySQL + PostgreSQL)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.youtube.com/playlist?list=PLTydW-y9HsbQ2ztoaLBJTd4wwjc_oqWx4\" target=\"_blank\" rel=\"noopener\">Bangla MySQL Database Tutorials (বাংলা playlist)\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"say\">\u003cb>🎤 ৩০ সেকেন্ডে দুটোই\u003c/b>\u003cp>Query ধীর হলে আগে pg_stat_statements দিয়ে খুঁজি, EXPLAIN ANALYZE দিয়ে plan দেখি, তারপর index বা query rewrite করি আর আবার মাপি। Connection-এর জন্য পুরো app-এ একটা pg Pool রাখি, transaction-এ finally-তে release করি, আর সব instance মিলিয়ে pool যেন DB-র max_connections না পেরোয়; অনেক instance হলে PgBouncer। Redis-এ একটা shared connection যথেষ্ট, শুধু subscribe বা blocking কাজে আলাদা। আর cache থাকলে DB-তে connection-এর চাপও কমে।\u003c/p>\u003c/div>\n\u003c/article>\u003c/div>\u003c/section>`;\nfunction render(){const cnt=Object.values(done).filter(Boolean).length;let n=0;\n document.getElementById(\"list\").innerHTML=INTRO+parts.map(p=>`\u003csection class=\"part\">\u003ch2>\u003csmall>Part\u003c/small>${p.name}\u003c/h2>\u003cdiv class=\"cards\">`+p.items.map((it,i)=>{n++;const k=p.id+\"-\"+i,d=!!done[k];\n  return `\u003carticle class=\"card${d?\" done\":\"\"}\" id=\"q-${k}\">\u003cdiv class=\"top\">\u003ch3>\u003cspan class=\"n\">${bn(n)}\u003c/span>${it.t}\u003c/h3>\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" id=\"c-${k}\" data-k=\"${k}\" ${d?\"checked\":\"\"}>Done\u003c/label>\u003c/div>\n  ${vids(it.v)}\n  \u003cdiv class=\"say\">\u003cb>🎤 Interview-এ এভাবে বলো\u003c/b>\u003cp>${it.say}\u003c/p>\u003cp class=\"ex\">\u003cb>💡 Example\u003c/b>${it.ex}\u003c/p>\u003c/div>\n  \u003cp class=\"hook\">${it.hook}\u003c/p>\n  \u003cdiv class=\"duo${it.pic?\"\":\" solo\"}\">\u003cdiv class=\"pics\">${it.pic}\u003c/div>\u003cul class=\"cave\">${it.b.map(x=>`\u003cli>${x}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>\n  ${it.c?`\u003cpre>\u003ccode>${hl(it.c)}\u003c/code>\u003c/pre>`:\"\"}\u003c/article>`}).join(\"\")+`\u003c/div>\u003c/section>`).join(\"\");\n let m=0;document.getElementById(\"side\").innerHTML=`\u003cdiv class=\"sh\">\u003cspan>সব topic · ${bn(cnt)}/${bn(total)} শেষ\u003c/span>\u003cbutton id=\"sideClose\">✕\u003c/button>\u003c/div>`+parts.map(p=>`\u003cdiv class=\"grp\">${p.name}\u003c/div>`+p.items.map((it,i)=>{m++;const k=p.id+\"-\"+i;return `\u003ca href=\"#q-${k}\" data-go=\"${k}\">\u003cspan class=\"sn2\">${bn(m)}\u003c/span>\u003cspan>${it.t}\u003c/span>${done[k]?'\u003cspan class=\"ok\">✓\u003c/span>':\"\u003cspan>\u003c/span>\"}\u003c/a>`}).join(\"\")).join(\"\");spy();}\nlet io;function spy(){try{io&&io.disconnect();io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const k=e.target.id.slice(2);document.querySelectorAll(\"#side a\").forEach(a=>a.classList.toggle(\"on\",a.dataset.go===k));}});},{rootMargin:\"-80px 0px -60% 0px\"});document.querySelectorAll(\".card[id]\").forEach(c=>io.observe(c));}catch(e){}}\ndocument.addEventListener(\"click\",e=>{const a=e.target.closest(\"#side a[data-go]\");\n if(a){e.preventDefault();document.getElementById(\"q-\"+a.dataset.go)?.scrollIntoView({behavior:\"smooth\",block:\"start\"});document.getElementById(\"side\").classList.remove(\"open\");return;}\n if(e.target.closest(\"#sideBtn\")){document.getElementById(\"side\").classList.add(\"open\");return;}\n if(e.target.closest(\"#sideClose\"))document.getElementById(\"side\").classList.remove(\"open\");});\ndocument.addEventListener(\"change\",e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){done[k]=e.target.checked;save();const y=scrollY;render();scrollTo(0,y);}});\nrender();\n\u003c/script>\n\u003c/body>\u003c/html>", "mk": "\u003c!doctype html>\u003chtml lang=\"bn\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}\u003c/style>\u003c/head>\u003cbody>\u003ctitle>System Design Must-Know\u003c/title>\n\u003cmeta name=\"claude:viewport-fit-sides\" content=\"cover\">\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&famil ce:nowrap}\n.lg.hi{background:var(--ok-soft);color:var(--ok)}.lg.en{background:var(--chip);color:var(--muted)}.lg.un{background:var(--accent-soft);color:var(--accent)}\n.lg.sh{background:var(--accent);color:#fff}\n.novid{font-size:13.5px;color:var(--muted)}\n.intro{display:grid;gap:12px}\n.box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px}\n.box h4{margin:0 0 6px;font:700 15px var(--display)}\n.box p,.box ul{margin:0}\n.flowl{display:flex;flex-wrap:wrap;gap:6px;font:700 13px var(--mono)}\n.flowl span{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 9px}\n\u003c/style>\n\u003cdiv class=\"wrap\">\n\u003cheader>\n  \u003ch1>\u003cspan class=\"play\">▶\u003c/span>System Design Must-Know\u003c/h1>\n  \u003cp class=\"lede\">Hands-on round-এর আগে যা না দেখলেই নয়: ১৫টা must-know, হিসাবের সূত্র আর ৪টা bonus। প্রতিটায় 🎤 ছোট উত্তর, 💡 example, trick, 🪨 লাইন, আর হিন্দি বা ছোট video। বলতে পারলে \"Done\" tick দাও।\u003c/p>\n\u003c/header>\n\u003cdiv class=\"layout\">\u003cmain id=\"list\">\u003c/main>\u003caside id=\"side\" aria-label=\"সব topic\">\u003c/aside>\u003c/div>\n\u003cbutton id=\"sideBtn\" aria-controls=\"side\">☰ সব topic\u003c/button>\n\u003cfooter>Video link গুলো ৯ নভেম্বর ২০২৬-এ খুঁজে পাওয়া; সময়কাল আর ভাষা খোলার আগে একবার দেখে নিও। বাংলা video কম পাওয়া গেছে, তাই বেশিরভাগ হিন্দি, কিছু জায়গায় ছোট English video।\u003c/footer>\n\u003c/div>\n\u003cscript>\nlet MK=0;\n/* steps: vertical cheatsheet diagram. item = [title, sub, kind(b|a|g|y), edgeLabelToNext] */\nconst steps=(cap,arr,o={})=>{\n  const H=48,G=26,bw=o.back?296:344,W=360,n=arr.length,T=(n*1.2).toFixed(1),id=\"m\"+(MK++);\n  const h=n*H+(n-1)*G+8;let s=\"\";\n  arr.forEach(([t,sub,k=\"b\",e],i)=>{\n    const top=4+i*(H+G),cy=top+H/2;\n    s+=`\u003crect class=\"sb k-${k}\" x=\"8\" y=\"${top}\" width=\"${bw}\" height=\"${H}\" rx=\"9\" style=\"animation-duration:${T}s;animation-delay:${(i*1.2).toFixed(1)}s\"/>`;\n    s+=`\u003ccircle class=\"sn k-${k}\" cx=\"30\" cy=\"${cy}\" r=\"12\"/>\u003ctext class=\"snt\" x=\"30\" y=\"${cy+4.5}\">${i+1}\u003c/text>`;\n    s+=`\u003ctext class=\"st\" x=\"52\" y=\"${top+20}\">${t}\u003c/text>`;\n    if(sub)s+=`\u003ctext class=\"ss\" x=\"52\" y=\"${top+38}\">${sub}\u003c/text>`;\n    if(i\u003cn-1){const x=8+bw/2;s+=`\u003cline class=\"sa\" x1=\"${x}\" y1=\"${top+H+1}\" x2=\"${x}\" y2=\"${top+H+G-4}\" marker-end=\"url(#${id})\"/>`;\n      if(e)s+=`\u003ctext class=\"se\" x=\"${x+10}\" y=\"${top+H+G/2+4}\">${e}\u003c/text>`;}\n  });\n  let leg=o.leg||\"\";\n  if(o.back){const [f,t,l]=o.back,yf=4+f*(H+G)+H/2,yt=4+t*(H+G)+H/2,x0=8+bw;\n    s+=`\u003cpath class=\"sback\" d=\"M${x0} ${yf} H${x0+30} V${yt} H${x0+6}\" marker-end=\"url(#${id}r)\"/>`;\n    leg=`\u003cb class=\"bk\">↩ ${l}\u003c/b>`+(leg?\" · \"+leg:\"\");}\n  return `\u003cdiv class=\"anim\">\u003cdiv class=\"cap\">${cap}\u003c/div>\u003csvg class=\"dg\" viewBox=\"0 0 ${W} ${h}\" role=\"img\" aria-label=\"${cap}\">\n  \u003cdefs>\u003cmarker id=\"${id}\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\u003cpath class=\"mh\" d=\"M0 0L10 5L0 10z\"/>\u003c/marker>\n  \u003cmarker id=\"${id}r\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\u003cpath class=\"mhr\" d=\"M0 0L10 5L0 10z\"/>\u003c/marker>\u003c/defs>${s}\u003c/svg>${leg?`\u003cdiv class=\"legend\">${leg}\u003c/div>`:\"\"}\u003c/div>`;\n};\n/* lanes: timeline bars with labels. seg = [left%, width%, colorClass, delay, label] */\nconst lanes=(cap,rows,leg)=>`\u003cdiv class=\"anim\">\u003cdiv class=\"cap\">${cap}\u003c/div>\u003cdiv class=\"lanes\">${rows.map(([l,segs])=>`\u003cdiv class=\"lane\">\u003cspan>${l}\u003c/span>\u003cdiv class=\"rail\">${segs.map(([a,w,c,d,t])=>`\u003cdiv class=\"seg ${c}\" style=\"left:${a}%;width:${w}%;animation-delay:${d||0}s\">${t?`\u003cb>${t}\u003c/b>`:\"\"}\u003c/div>`).join(\"\")}\u003c/div>\u003c/div>`).join(\"\")}\u003c/div>${leg?`\u003cdiv class=\"legend\">${leg}\u003c/div>`:\"\"}\u003c/div>`;\n\n\n\nconst S=steps;\nconst parts=[];\nfunction P(id,name,items){parts.push({id,name,items});}\nfunction T(t,hook,b,say,ex,pic,code,v){return {t,hook,b,say,ex,pic:pic||\"\",c:code||\"\",v:v||[]};}\nfunction V(t,u,lang,note){return {t,u,lang,note};}\n// V(title, url, lang, note)\nP(\"scale\",\"Scale ও নির্ভরযোগ্যতা\",[\nT(\"Vertical vs Horizontal Scaling\",\"\u003cb>বড় গাড়ি (Vertical) vs বেশি গাড়ি (Horizontal)।\u003c/b> Scale up vs scale out।\",\n[\"Vertical: একই server-এ বেশি CPU/RAM। সহজ, কিন্তু limit আছে।\",\"Horizontal: বেশি server + Load Balancer। প্রায় সীমাহীন।\",\"Horizontal-এর শর্ত: app stateless (session Redis-এ)।\",\"একটা server পড়লেও horizontal-এ বাকিরা চলে।\"],\n\"Vertical-এ একটা server বড় করি, সহজ কিন্তু hardware limit আছে আর ওটা পড়লে সব বন্ধ। Horizontal-এ server বাড়িয়ে load balancer-এর পিছনে রাখি; app stateless হলে প্রায় যত খুশি scale করা যায়।\",\n\"Sale-এ CPU 90% হলে দ্রুত fix vertical (2 → 8 CPU)। স্থায়ী সমাধান horizontal: ৪টা pod + LB।\",\nS(\"দুই রকম scale\",[[\"Vertical\",\"২ CPU → ৩২ CPU\",\"b\"],[\"Horizontal\",\"LB + ২ CPU × ৪\",\"a\"],[\"শর্ত\",\"app stateless\",\"g\"]]),null,\n[V(\"Horizontal or Vertical Scaling 🤔? Explained in Hindi\",\"https://www.youtube.com/watch?v=yRG1iXPuNsk\",\"Hindi\"),V(\"Horizontal Vs Vertical Scaling (দোকান-বিল্ডিং উদাহরণ)\",\"https://www.youtube.com/watch?v=uJkF7EzTDz4\",\"Hinglish\")]),\nT(\"Load Balancer\",\"\u003cb>ট্রাফিক পুলিশ:\u003c/b> গাড়ি সব রাস্তায় ভাগ করে, বন্ধ রাস্তায় পাঠায় না।\",\n[\"Traffic অনেক server-এ ভাগ করে।\",\"Algorithm: Round robin, Least connections, IP hash।\",\"Health check fail → ওই server বাদ।\",\"L4 = IP/port দেখে, L7 = URL/header দেখে।\"],\n\"Load balancer traffic একাধিক server-এ ভাগ করে আর health check দিয়ে খারাপ server বাদ দেয়। সাধারণত round robin বা least connections। L7 হলে URL দেখে আলাদা service-এ পাঠাতে পারে।\",\n\"Nginx least_conn দিয়ে ৩টা Node instance; deploy-এর সময় একটা restart হলে LB বাকি দুটোতে পাঠায়।\",\nS(\"Load Balancer\",[[\"Users\",\"\",\"b\"],[\"Load Balancer\",\"health check\",\"y\"],[\"App 1 / App 2 / App 3\",\"\",\"b\"],[\"Redis + DB\",\"shared state\",\"g\"]]),null,\n[V(\"Load Balancers For System Design: Algorithms, L4 vs L7, Failover\",\"https://www.youtube.com/watch?v=WmzB4MJcCiU\",\"English\"),V(\"System Design: Load Balancing\",\"https://www.youtube.com/watch?v=PmNOrh568Os\",\"English\")]),\nT(\"Single Point of Failure (SPOF)\",\"\u003cb>একটা খুঁটির উপর পুরো ঘর।\u003c/b> খুঁটি ভাঙলে সব শেষ।\",\n[\"যে একটা অংশ পড়লে পুরো system বন্ধ।\",\"উদাহরণ: ১টা DB, ১টা LB, ১টা server।\",\"সমাধান: প্রতিটা স্তরে ২টা copy + auto failover।\",\"একাধিক zone (multi-AZ)-এ deploy।\"],\n\"SPOF হলো এমন একটা অংশ যেটা fail করলে পুরো system বন্ধ। আমি প্রতিটা স্তরে অন্তত দুটো copy রাখি, LB-ও দুটো, DB-তে replica আর automatic failover।\",\n\"একটাই DB server ছিল = SPOF। Primary + replica + auto failover দেওয়ার পর primary মরলেও ১ মিনিটে replica উঠে আসে।\",\nnull,null,[V(\"Load Balancers… Failover (failover অংশটা দেখো)\",\"https://www.youtube.com/watch?v=WmzB4MJcCiU\",\"English\")]),\nT(\"CAP Theorem\",\"\u003cb>৩টার মধ্যে ২টা।\u003c/b> Network ভাঙলে বেছে নাও: সঠিক data (C) নাকি সবসময় উত্তর (A)।\",\n[\"C = সবাই সর্বশেষ data দেখে।\",\"A = সবসময় উত্তর দেয়।\",\"P = network ভাঙলেও চলে (distributed-এ বাধ্যতামূলক)।\",\"CP: bank, stock। AP: feed, like count।\"],\n\"CAP বলে network partition হলে consistency আর availability-র মধ্যে একটা বাছতে হয়। টাকা বা stock-এ CP নিই, ভুল data দেখানোর চেয়ে error ভালো। Feed বা like-এ AP নিই, একটু পুরনো data চলে।\",\n\"bKash balance = CP (ভুল balance দেখানো চলবে না)। Facebook like count = AP (কয়েক সেকেন্ড পুরনো হলেও সমস্যা নেই)।\",\nnull,null,[V(\"CAP Theorem (Hindi)\",\"https://youtu.be/3qRBeZsUa18\",\"Hindi\"),V(\"CAP Theorem Explained in 5 minutes\",\"https://www.youtube.com/watch?v=xUBMRdTyd30\",\"English\"),V(\"CAP Theorem - System Design\",\"https://www.youtube.com/shorts/qMa3f3R592M\",\"English\",\"Short\")])\n]);\n\nP(\"calc\",\"হিসাবের সূত্র (Latency, Throughput, Bandwidth)\",[\nT(\"Latency vs Throughput vs Bandwidth\",\"\u003cb>রাস্তা:\u003c/b> Latency = এক গাড়ির পৌঁছানোর সময়, Throughput = ঘণ্টায় কত গাড়ি পার হলো, Bandwidth = রাস্তা কত চওড়া (সর্বোচ্চ কত গাড়ি পারে)।\",\n[\"Latency = response পাওয়ার সময় − request পাঠানোর সময় (ms)\",\"Latency = network + queue-তে অপেক্ষা + processing + DB সময়\",\"Throughput = শেষ হওয়া request ÷ সময় (RPS)\",\"Bandwidth = সর্বোচ্চ data capacity (Mbps); Throughput ≤ Bandwidth\",\"Average না, p95/p99 latency দেখো\"],\n\"Latency হলো একটা request শেষ হতে কত সময় লাগে, throughput হলো প্রতি সেকেন্ডে কতগুলো request শেষ করি, আর bandwidth হলো network সর্বোচ্চ কত data নিতে পারে। Throughput কখনো bandwidth-এর বেশি হয় না, আর latency বোঝাতে average না দিয়ে p95 আর p99 বলি।\",\n\"১০০ জনের মধ্যে ৯৫ জন ১২০ms-এর মধ্যে উত্তর পেলে p95 = ১২০ms। Average ৫০ms হলেও p99 ২ সেকেন্ড হতে পারে, তাই average বিভ্রান্তিকর।\",\nS(\"Latency-র ভাগ\",[[\"Network (যাওয়া)\",\"~২০–৫০ms\",\"b\"],[\"Queue-তে অপেক্ষা\",\"ভিড় হলে বাড়ে\",\"y\"],[\"App processing\",\"\",\"a\"],[\"DB / Redis\",\"\",\"a\"],[\"Network (ফেরা) → response\",\"\",\"g\"]])),\nT(\"Back-of-envelope: RPS, Storage, Bandwidth\",\"\u003cb>খাতা-কলমে আনুমানিক হিসাব:\u003c/b> ১ দিন ≈ ১ লাখ সেকেন্ড (৮৬,৪০০)।\",\n[\"গড় RPS = DAU × প্রতি user-এর দৈনিক request ÷ ৮৬,৪০০\",\"Peak RPS ≈ গড় RPS × ২ থেকে ৩\",\"Storage/দিন = দৈনিক নতুন record × প্রতি record-এর size\",\"Bandwidth = RPS × response size (bytes/s → × ৮ = bits/s)\",\"বছরের storage = দৈনিক × ৩৬৫ (replica থাকলে × copy সংখ্যা)\"],\n\"Design-এ আগে আনুমানিক হিসাব করি: দৈনিক active user আর প্রতি user-এর request থেকে গড় RPS, তার দুই-তিন গুণ peak; record-এর size থেকে storage; আর RPS গুণ response size থেকে bandwidth। এতে বুঝি কোথায় cache, replica বা CDN লাগবে।\",\n\"১০ লাখ DAU × ২০ request = ২ কোটি/দিন ÷ ৮৬,৪০০ ≈ ২৩০ RPS গড়, peak ≈ ৭০০ RPS। Response ২০KB হলে bandwidth ≈ ৭০০ × ২০KB = ১৪MB/s ≈ ১১২ Mbps।\",\nnull,\n`গড় RPS   = 1,000,000 DAU × 20 req lish (rate limit অংশ)\",\"https://www.youtube.com/shorts/YxlJcbX12p0\",\"Hinglish\",\"Short\")]),\nT(\"⭐ Bloom Filter (Asif vai)\",\"\u003cb>দারোয়ানের খাতা:\u003c/b> নাম না থাকলে নিশ্চিত নেই; থাকলে 'সম্ভবত আছে', তখন ভেতরে গিয়ে মিলাও।\",\n[\"Bit array + কয়েকটা hash।\",\"'নেই' উত্তর ১০০% ঠিক (false negative নেই)।\",\"'আছে' মাঝে মাঝে ভুল (false positive) → তখন DB check।\",\"খুব কম memory। DB-র আগে ছাঁকনি, cache penetration আটকায়।\"],\n\"Bloom filter খুব কম memory-তে বলে কোনো item নিশ্চিত নেই নাকি সম্ভবত আছে। 'নেই' হলে DB-তে যাই-ই না; 'সম্ভবত আছে' হলে DB দিয়ে নিশ্চিত হই। তাই ভুল উত্তর যায় না, শুধু অপ্রয়োজনীয় DB query কমে।\",\n\"Signup-এ username available কিনা: বেশিরভাগ নতুন নাম filter 'নেই' বলে দেয়, DB-তে query-ই যায় না।\",\nS(\"Bloom filter\",[[\"username = 'abed'?\",\"\",\"b\"],[\"Bloom filter\",\"k টা bit দেখো\",\"y\",\"কোনো bit ০\"],[\"নিশ্চিত নেই → available\",\"DB-তে যায় না\",\"g\"]],{leg:\"সব bit ১ হলে → 'সম্ভবত আছে' → DB দিয়ে নিশ্চিত\"}),\n`await redis.call('BF.ADD', 'usernames', 'abed');\nconst maybe = await redis.call('BF.EXISTS', 'usernames', 'abed'); // 0 = নিশ্চিত নেই`,\n[V(\"Bloom Filter Basic concept in Hindi\",\"https://www.youtube.com/watch?v=5geaRjUZ3Ck\",\"Hindi\"),V(\"Interview: What Is a Bloom Filter? 🧠\",\"https://www.youtube.com/shorts/ZSFSA1Tx6lk\",\"English\",\"Short\"),V(\"What is a Bloom Filter?\",\"https://www.youtube.com/shorts/E1aH7nPTQdU\",\"English\",\"Short\")])\n]);\n\nP(\"bonus\",\"Bonus (সময় থাকলে)\",[\nT(\"Circuit Breaker\",\"\u003cb>বাড়ির ফিউজ:\u003c/b> বারবার গোলমাল হলে লাইন কেটে দেয়, সব পুড়ে যাওয়া আটকায়।\",\n[\"Closed: স্বাভাবিক।\",\"বেশি fail → Open: সাথে সাথে fallback, call বন্ধ।\",\"কিছু পরে Half-open: অল্প call দিয়ে পরীক্ষা।\",\"একটা service-এর সমস্যা পুরো system-এ ছড়ায় না।\"],\n\"Circuit breaker কোনো service বারবার fail করলে কিছুক্ষণ তাকে call করা বন্ধ করে fallback দেয়, পরে অল্প request দিয়ে পরীক্ষা করে। এতে একটা service-এর সমস্যায় পুরো system ধসে না।\",\n\"Recommendation service down → খালি list দেখাও, কিন্তু checkout চলতেই থাকে।\",null,null,[]),\nT(\"Saga + Outbox\",\"\u003cb>Saga = লম্বা কাহিনি, প্রতি পর্বের undo। Outbox = চিঠি আগে নিজের ড্রয়ারে, পিয়ন পরে নেবে।\u003c/b>\",\n[\"একাধিক service-এ এক transaction নেই।\",\"Saga: প্রতিটা step-এর undo; fail হলে উল্টো ক্রমে।\",\"Outbox: data আর event একই DB transaction-এ লেখো।\",\"আলাদা process outbox থেকে broker-এ পাঠায়।\"],\n\"Microservice-এ একাধিক DB জুড়ে transaction করা যায় না, তাই Saga: প্রতিটা step-এর একটা undo, মাঝে fail হলে উল্টো ক্রমে ফিরিয়ে নিই। Outbox দিয়ে নিশ্চিত করি DB update আর event কখনো অমিল হয় না।\",\n\"Order ✓ → Payment ✓ → Stock ✗ → refund → order cancel।\",null,null,[]),\nT(\"JWT vs Session\",\"\u003cb>Session = হোটেলের রেজিস্টার\u003c/b> (server মনে রাখে)। \u003cb>JWT = নিজের কাছে সিল-মারা টিকিট\u003c/b> (server কিছু রাখে না)।\",\n[\"Session: server/Redis-এ state, revoke সহজ।\",\"JWT: stateless, scale সহজ, DB lookup লাগে না।\",\"JWT revoke কঠিন → ছোট মেয়াদ (১৫ মিনিট) + refresh token।\",\"JWT payload encrypt না, গোপন কিছু রাখবে না।\"],\n\"Session-এ server state রাখে, তাই logout বা revoke সহজ। JWT stateless, তাই অনেক server-এ scale সহজ, কিন্তু revoke কঠিন, তাই ছোট মেয়াদের access token আর rotate করা refresh token দিই।\",\n\"Admin panel-এ session (সাথে সাথে logout দরকার), mobile API-তে JWT।\",null,null,[]),\nT(\"Observability\",\"\u003cb>Log = ডায়েরি, Metric = থার্মোমিটার, Trace = ভ্রমণের মানচিত্র।\u003c/b>\",\n[\"Metric বলে কিছু ভুল হচ্ছে (p95, error rate)।\",\"Trace দেখায় কোথায় (কোন service ধীর)।\",\"Log বলে কেন।\",\"সব log-এ trace ID রাখো।\"],\n\"Metric দিয়ে বুঝি সমস্যা হচ্ছে, trace দিয়ে দেখি কোন ধাপে, আর log দিয়ে জানি কেন। সব log-এ trace ID রাখি যাতে তিনটা জোড়া লাগানো যায়।\",\n\"p99 বাড়ল (metric) → trace-এ DB span ১.২ সেকেন্ড → log-এ lock timeout।\",null,null,[])\n]);\n\nconst esc=s=>String(s).replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\");\nconst hl=s=>esc(s).split(\"\\n\").map(l=>l.replace(/(\\/\\/.*|--.*)$/,'\u003cspan class=\"cm\">$1\u003c/span>') iv class=\"box\">\u003ch4>📚 বাংলায় আরও পড়তে / দেখতে চাইলে\u003c/h4>\u003cul>\u003cli>\u003ca href=\"https://www.youtube.com/playlist?list=PLbC4KRSNcMnowfvFbPXG9dInbl20mEdZy\" target=\"_blank\" rel=\"noopener\">System Design Course Bangla (Learn Hunter, ১৪টা video)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.youtube.com/shorts/OcMMpdJcsBE\" target=\"_blank\" rel=\"noopener\">What is System Design? (বাংলা Short, চায়ের দোকানের উদাহরণ)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://github.com/lahin31/system-design-bangla\" target=\"_blank\" rel=\"noopener\">system-design-bangla (GitHub, বাংলা লেখা note)\u003c/a>\u003c/li>\u003c/ul>\u003c/div>\n\u003c/article>\u003c/div>\u003c/section>`;\nfunction render(){const cnt=Object.values(done).filter(Boolean).length;let n=0;\n document.getElementById(\"list\").innerHTML=INTRO+parts.map(p=>`\u003csection class=\"part\">\u003ch2>\u003csmall>Part\u003c/small>${p.name}\u003c/h2>\u003cdiv class=\"cards\">`+p.items.map((it,i)=>{n++;const k=p.id+\"-\"+i,d=!!done[k];\n  return `\u003carticle class=\"card${d?\" done\":\"\"}\" id=\"q-${k}\">\u003cdiv class=\"top\">\u003ch3>\u003cspan class=\"n\">${bn(n)}\u003c/span>${it.t}\u003c/h3>\u003clabel class=\"chk\">\u003cinput type=\"checkbox\" id=\"c-${k}\" data-k=\"${k}\" ${d?\"checked\":\"\"}>Done\u003c/label>\u003c/div>\n  ${vids(it.v)}\n  \u003cdiv class=\"say\">\u003cb>🎤 Interview-এ এভাবে বলো\u003c/b>\u003cp>${it.say}\u003c/p>\u003cp class=\"ex\">\u003cb>💡 Example\u003c/b>${it.ex}\u003c/p>\u003c/div>\n  \u003cp class=\"hook\">${it.hook}\u003c/p>\n  \u003cdiv class=\"duo${it.pic?\"\":\" solo\"}\">\u003cdiv class=\"pics\">${it.pic}\u003c/div>\u003cul class=\"cave\">${it.b.map(x=>`\u003cli>${x}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/div>\n  ${it.c?`\u003cpre>\u003ccode>${hl(it.c)}\u003c/code>\u003c/pre>`:\"\"}\u003c/article>`}).join(\"\")+`\u003c/div>\u003c/section>`).join(\"\");\n let m=0;document.getElementById(\"side\").innerHTML=`\u003cdiv class=\"sh\">\u003cspan>সব topic ze:12.5px}\n.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}\n.cmp th{font:700 12.5px var(--body)}\n.cmp td:first-child{color:var(--muted);font-weight:600}\n.reel{background:#0b0b0e;border-radius:12px;padding:8px;display:grid;gap:8px}\n.reel canvas{width:100%;aspect-ratio:360/470;display:block;border-radius:8px}\n.reel-cap{color:#f2f2f2;font:600 15px var(--body);min-height:3.2em;padding-inline:6px;line-height:1.5}\n.reel-nav{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px 4px}\n.reel-nav button{font:600 13px var(--mono);background:#1c1c22;color:#ddd;border:1px solid #333;border-radius:6px;padding:4px 10px;cursor:pointer}\n.reel-nav button[aria-pressed=\"true\"]{background:#4fc3f7;color:#0b0b0e;border-color:#4fc3f7}\n.reel-nav .pp{margin-left:auto}\n.reel-nav button:focus-visible{outline:2px solid #ffd54f;outline-offset:2px}\n.say .ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--ok)}\n.say .ex b{display:block;font:700 13px var(--display);color:var(--amber);margin-bottom:2px}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important}}\nfooter{margin-top:32px;color:var(--muted);font-size:14px}\n\u003c/style>\n\n\u003cdiv class=\"wrap\">\n\u003cheader>\n  \u003ch1>\u003cspan class=\"play\">▶\u003c/span>Backend Interview Reels\u003c/h1>\n  \u003cp class=\"lede\">Caveman mode। ছোট কথা। Animation দেখো, 🪨 bullet পড়ো, code দেখো। মুখে বলতে পারলে \"Done\" tick দাও।\u003c/p>\n\u003c/header>\n\u003cdiv class=\"bar\" id=\"bar\" hidden>\u003c/div>\n\u003cdiv class=\"layout\">\u003cmain id=\"list\">\u003c/main>\u003caside id=\"side\" aria-label=\"সব প্রশ্ন\">\u003c/aside>\u003c/div>\n\u003cbutton id=\"sideBtn\" aria-controls=\"side\">☰ সব প্রশ্ন\u003c/button>\n\u003cfooter>Tip: প্রতিটা card-এর লাল box-এর trick ৩০ সেকেন্ডে জোরে জোরে বলো। তারপর tick দাও। Tick এই browser-এই মনে থাকবে।\u003c/footer>\n\u003c/div>\n\n\u003cscript>\n/* ---------- Reel: canvas scene like a short video ---------- */\nconst REEL={\n conc:{dur:24,phases:[\n  [0,5,\"১০০০ জন user একসাথে request পাঠাচ্ছে। সব আসছে একটা Node server-এ।\"],\n  [5,12,\"Concurrency: ১টা core। একটা task চালায়, DB/Network-এর অপেক্ষায় গেলে সাথে সাথে পরেরটা ধরে। কেউ বসে থাকে না।\"],\n  [12,19,\"Parallelism: ৪টা core। ৪টা task একই মুহূর্তে চলছে (cluster / worker_threads)।\"],\n  [19,24,\"মনে রাখো: Node = by default Concurrent (event loop)। Parallel চাইলে cluster বা worker।\"]\n ]}\n};\nconst TASKC=[\"#ff6b8b\",\"#4fc3f7\",\"#ffd54f\",\"#81c784\",\"#ba68c8\",\"#ff8a65\"];\nfunction rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}\nfunction person(c,x,y,col,a){c.globalAlpha=a;c.strokeStyle=col;c.lineWidth=2.2;c.beginPath();c.arc(x,y,7,0,7);c.stroke();c.beginPath();c.arc(x,y+20,12,Math.PI,0);c.lineTo(x+12,y+22);c.moveTo(x-12,y+20);c.lineTo(x-12,y+22);c.stroke();c.globalAlpha=1;}\nfunction hand(c,txt,x,y,size,col,al){c.font=`${size}px \"Patrick Hand\",\"Anek Bangla\",cursive`;c.fillStyle=col;c.textAlign=al||\"center\";c.fillText(txt,x,y);}\nfunction task(c,x,y,s,i,label){c.fillStyle=TASKC[i%6];rr(c,x,y,s,s,4);c.fill();if(label){c.fillStyle=\"#111\";c.font=`700 ${Math.round(s*.42)}px \"JetBrains Mono\",monospace`;c.textAlign=\"center\";c.fillText(label,x+s/2,y+s*.64);}}\nfunction drawConc(c,t){\n  const W=360,H=470;c.fillStyle=\"#0b0b0e\";c.fillRect(0,0,W,H);\n  hand(c,\"CONCURRENCY\",W/2,40,34,\"#4fc3f7\");\n  c.strokeStyle=\"#555\";c.lineWidth=1;c.beginPath();c.moveTo(70,60);c.lineTo(155,60);c.moveTo(205,60);c.lineTo(290,60);c.stroke();\n  rr(c,160,48,40,24,5);c.stroke();hand(c,\"vs\",180,66,18,\"#ddd\");\n  hand(c,\"PARALLELISM\",W/2,100,34,\"#ffd54f\");\n  // users\n  const ux=[]; for(let i=0;i\u003c9;i++)ux.push(22+i*39.5);\n  ux.forEach((x,i)=>person(c,x,122,\"#ff6b8b\",i===8?.5:1));\n  // connection streams\n  c.lineWidth=1.2;\n  ux.forEach((x,i)=>{for(let k=0;k\u003c3;k++){const p=((t*0.9+i*.13+k*.33)%1);const y0=150+p*28;c.strokeStyle=`rgba(255,255,255,${.6*(1-p)})`;c.beginPath();c.moveTo(x-8+k*6,y0);c.lineTo(x-12+k*6+ (W/2-x)*.08,y0+8);c.stroke();}});\n  // server\n  c.strokeStyle=\"#e8e8e8\";c.lineWidth=2;rr(c,8,182,344,250,14);c.stroke();\n  c.fillStyle=\"#5fb85f\";c.beginPath();for(let k=0;k\u003c6;k++){const a=Math.PI/3*k+Math.PI/6;c.lineTo(118+9*Math.cos(a),206+9*Math.sin(a));}c.fill();\n  hand(c,\"Node server\",190,213,22,\"#eee\");\n  // cpu\n  const cx=20,cy=228,cw=320,ch=176;c.strokeStyle=\"#9b8cff\";c.lineWidth=1.5;rr(c,cx,cy,cw,ch,10);c.stroke();\n  for(let i=0;i\u003c22;i++){const x=cx+12+i*14;c.beginPath();c.moveTo(x,cy-6);c.lineTo(x,cy);c.moveTo(x,cy+ch);c.lineTo(x,cy+ch+6);c.stroke();}\n  hand(c,\"CPU\",cx+10,cy+18,15,\"#9b8cff\",\"left\");\n  const ph=t\u003c5?0:t\u003c12?1:t\u003c19?2:3;\n  // connection counter\n  const n=Math.min(1000,Math.floor(t/4*1000));\n  c.font='600 16px \"JetBrains Mono\",monospace';c.fillStyle=\"#fff\";c.textAlign=\"center\";c.fillText((ph===0?n:1000).toLocaleString(\"en\")+\" connections\",W/2,458);\n  if(ph===0){ // one idle core\n    c.strokeStyle=\"#5ee6c8\";rr(c,120,262,120,110,8);c.stroke();hand(c,\"core\",132,278,13,\"#5ee6c8\",\"left\");\n    const p=(t%1.5)/1.5;task(c,166,300+p*0,28,Math.floor(t/1.5),\"\");\n  } else if(ph===1||ph===3&&false){\n    const lt=t-5,slot=0.9,k=Math.floor(lt/slot),f=(lt%slot)/slot;\n    // queue\n    hand(c,\"Queue\",58,262,13,\"#aaa\");\n    // core\n    c.strokeStyle=\"#5ee6c8\";c.lineWidth=2;rr(c,128,254,104,128,8);c.stroke();hand(c,\"core (১টা)\",136,270,13,\"#5ee6c8\",\"left\");\n    // io box\n    c.strokeStyle=\"#ff8a65\";c.setLineDash([4,3]);rr(c,244,254,88,128,8);c.stroke();c.setLineDash([]);hand(c,\"DB / Network\",288,270,12,\"#ff8a65\");hand(c,\"অপেক্ষা\",288,284,12,\"#ff8a65\");\n    const cur=k%6;\n    for(let q=1;q\u003c=4;q++){const id=(k+q)%6;task(c,44,268+q*24,20,id,\"T\"+(id+1));}\n    const ex=f\u003c.2?44+(140-44)*(f/.2):f>.8?140+(270-140)*((f-.8)/.2):140;\n    const ey=f\u003c.2?292+(300-292)*(f/.2):300;\n    task(c,ex,ey,36,cur,\"T\"+(cur+1));\n    if(f>.2&&f\u003c.8){c.fillStyle=\"#5ee6c8\";c.fillRect(140,344,80*((f-.2)/.6),5);hand(c,\"চলছে…\",180,370,13,\"#5ee6c8\");}\n    for(let j=1;j\u003c=2;j++){const id=(k-j+6*9)%6;task(c,274,296+j*28-28+20,24,id,\"T\"+(id+1));}\n  } else if(ph===2){\n    const lt=t-12;const pos=[[38,254],[186,254],[38,330],[186,330]];\n    pos.forEach(([x,y],i)=>{c.strokeStyle=\"#5ee6c8\";c.lineWidth=2;rr(c,x,y,136,66,8);c.stroke();hand(c,\"core \"+(i+1),x+8,y+16,13,\"#5ee6c8\",\"left\");\n      const id=(Math.floor(lt/1.75)*4+i)%6;task(c,x+10,y+24,32,id,\"T\"+(id+1));\n      const p=(lt%1.75)/1.75;c.fillStyle=TASKC[id];c.fillRect(x+50,y+38,76*p,6);c.strokeStyle=\"#333\";c.strokeRect(x+50,y+38,76,6);});\n  } else {\n    hand(c,\"Node\",W/2,286,22,\"#4fc3f7\");hand(c,\"= Concurrent (event loop)\",W/2,312,18,\"#4fc3f7\");\n    hand(c,\"Parallel চাইলে\",W/2,346,18,\"#ffd54f\");hand(c,\"cluster / worker_threads\",W/2,372,18,\"#ffd54f\");\n  }\n}\nconst DRAW={conc:drawConc};\nfunction reelLoop(now){\n  document.querySelectorAll(\"canvas.reelc\").forEach(cv=>{\n    const key=cv.dataset.reel,R=REEL[key];const c=cv.getContext(\"2d\");\n    const dpr=window.devicePixelRatio||1,w=cv.clientWidth;if(!w)return;\n    if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr*470/360);}\n    if(cv.dataset.paused!==\"1\"){const last=+cv.dataset.last||now;cv.dataset.t=((+cv.dataset.t||0)+(now-last)/1000)%R.dur;}\n    cv.dataset.last=now;const t=+cv.dataset.t||0;\n    c.setTransform(cv.width/360,0,0,cv.width/360,0,0);DRAW[key](c,t);\n    const box=cv.closest(\".reel\");const pi=R.phases.findIndex(p=>t>=p[0]&&t\u003cp[1]);\n    if(box&&box.dataset.pi!=String(pi)){box.dataset.pi=pi;box.querySelector(\".reel-cap\").textContent=R.phases[pi][2];\n      box.querySelectorAll(\".reel-nav [data-ph]\").forEach((b,i)=>b.setAttribute(\"aria-pressed\",i===pi));}\n  });\n  requestAnimationFrame(reelLoop);\n}\nrequestAnimationFrame(reelLoop);\ndo
